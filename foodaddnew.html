<!DOCTYPE html>
<html lang="th">
<head>
    <!-- [Start Block 1.1] HEAD CONFIGURATION & DEPENDENCIES -->
    <script src="appInit.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>เพิ่มเมนูอาหารใหม่ - ลาบหนองบัวลำภู</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <!-- [End Block 1.1] HEAD CONFIGURATION & DEPENDENCIES -->

    <!-- [Start Block 1.2] GLOBAL STYLES -->
    <style>
        html, body { 
            width: 100%; min-height: 100%;
            background-color: #ffffff; color: #1e293b;
            font-family: 'Sarabun', sans-serif; margin: 0; padding: 0; user-select: none;
            display: flex; flex-direction: column; 
            border-radius: 0 !important; 
        }

        input, select, textarea, button { font-size: 16px; }

        .custom-label { font-size: 15px !important; font-weight: 700; }
        input[type="number"], input[type="text"] { font-size: 16px !important; padding-top: 0.45rem !important; padding-bottom: 0.45rem !important; line-height: 1.4 !important; }
        .back-btn { background-color: #f1f5f9; border: 1.5px solid #cbd5e1; color: #334155; font-weight: 700; font-size: 13px !important; padding: 0.25rem 0.5rem; border-radius: 0.6rem; cursor: pointer; }
    </style>
    <!-- [End Block 1.2] GLOBAL STYLES -->
</head>
<body>

    <!-- ==========================================================
         [Start Block 2] USER INTERFACE & LAYOUT COMPONENTS
         ========================================================== -->
    <div class="flex justify-between items-center px-4 py-3 border-b border-slate-100 bg-slate-50 flex-shrink-0">
        <div class="flex items-center gap-1.5">
            <span class="text-base text-blue-600 font-extrabold flex items-center justify-center">➕</span>
            <span id="foodTitleHeader" class="font-extrabold text-sm text-slate-700 truncate px-1">เพิ่มเมนูอาหารใหม่</span>
        </div>
        <button type="button" id="btnCloseModalTop" onclick="closeModal()" class="w-7 h-7 rounded-full bg-slate-200 hover:bg-rose-100 hover:text-rose-600 text-slate-600 flex items-center justify-center font-bold text-xs transition cursor-pointer">✕</button>
    </div>

    <form id="addMenuForm" onsubmit="saveNewMenuData(event)" class="p-3.5 space-y-3 bg-white w-full">
        <div class="grid grid-cols-2 gap-2.5">
            <div>
                <label class="block custom-label text-slate-700 mb-1">หมวดหมู่</label>
                <input type="text" id="addCategoryDisplay" readonly value="⏳ กำลังโหลด..." 
                       class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 font-bold text-slate-600 outline-none truncate">
            </div>
            <div>
                <label class="block custom-label text-slate-700 mb-1">
                    ชื่อเมนู <span class="text-rose-500 font-bold">*</span>
                </label>
                <input type="text" id="addFoodNameInput" required placeholder="เช่น กะเพราไก่" 
                       class="w-full border border-blue-400 focus:border-blue-600 rounded-xl px-3 py-2 font-bold text-slate-800 outline-none focus:ring-1 focus:ring-blue-500 placeholder:text-slate-300 transition">
            </div>
        </div>

        <div>
            <label class="block custom-label text-slate-700 mb-1">ราคา (บาท)</label>
            <div class="grid grid-cols-3 gap-2">
                <div>
                    <span class="block text-xs font-bold text-slate-500 text-center mb-1">ชาวบ้าน</span>
                    <input type="number" id="addPrice1Input" min="0" step="any" placeholder="0" 
                           class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-center font-extrabold text-slate-700 outline-none focus:bg-white focus:border-blue-500 transition">
                </div>
                <div>
                    <span class="block text-xs font-bold text-slate-500 text-center mb-1">นักท่องเที่ยว</span>
                    <input type="number" id="addPrice2Input" min="0" step="any" placeholder="0" 
                           class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-center font-extrabold text-slate-700 outline-none focus:bg-white focus:border-blue-500 transition">
                </div>
                <div>
                    <span class="block text-xs font-bold text-slate-500 text-center mb-1">สบายดี</span>
                    <input type="number" id="addPrice3Input" min="0" step="any" placeholder="0" 
                           class="w-full bg-slate-50 border border-slate-300 rounded-xl p-2 text-center font-extrabold text-slate-700 outline-none focus:bg-white focus:border-blue-500 transition">
                </div>
            </div>
        </div>

        <div class="pt-2 grid grid-cols-2 gap-2">
            <button type="button" id="btnCancelAddMenu" onclick="closeModal()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 rounded-xl text-base transition cursor-pointer">
                ยกเลิก
            </button>
            <button type="submit" id="btnSubmitAddMenu" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-extrabold py-2.5 rounded-xl text-base flex items-center justify-center gap-1.5 transition cursor-pointer shadow-md">
                <span>✓</span> บันทึกเมนู
            </button>
        </div>
    </form>

    <!-- ==========================================================
         [Start Block 3] JAVASCRIPT CORE LOGIC & FUNCTIONS
         ========================================================== -->
    <script>
        /* --- [Start Block 3.1] INITIALIZATION & SETUP --- */
        let db = null;
        let currentGroupId = 99;
        let isSaving = false;

        function resolveGroupId(rawGroupId) {
            if (rawGroupId === null || rawGroupId === undefined || String(rawGroupId).trim() === '') {
                return 99;
            }
            const parsed = Number(rawGroupId);
            if (!Number.isInteger(parsed) || parsed < 0) {
                return 99;
            }
            return parsed;
        }

        function resolveSupabaseClient() {
            if (typeof window.supabaseClient !== 'undefined' && window.supabaseClient) {
                return window.supabaseClient;
            }
            if (typeof supabaseClient !== 'undefined' && supabaseClient) {
                return supabaseClient;
            }
            return null;
        }

        function setFormBusyState(busy) {
            isSaving = busy;
            const btnSubmit = document.getElementById('btnSubmitAddMenu');
            const btnCancel = document.getElementById('btnCancelAddMenu');
            const btnCloseTop = document.getElementById('btnCloseModalTop');

            if (btnSubmit) btnSubmit.disabled = busy;
            if (btnCancel) btnCancel.disabled = busy;
            if (btnCloseTop) btnCloseTop.disabled = busy;
        }

        function getTargetOrigin() {
            return window.location.origin && window.location.origin !== 'null' ? window.location.origin : '*';
        }

        window.addEventListener('DOMContentLoaded', () => {
            db = resolveSupabaseClient();

            const urlParams = new URLSearchParams(window.location.search);
            currentGroupId = resolveGroupId(urlParams.get('group_id'));
            const groupName = urlParams.get('group_name');

            const categoryInput = document.getElementById('addCategoryDisplay');
            if (categoryInput) {
                if (groupName && groupName.trim() !== '') {
                    categoryInput.value = groupName.trim();
                } else {
                    categoryInput.value = currentGroupId === 99 ? 'ทั่วไป (99)' : `หมวดหมู่ #${currentGroupId}`;
                }
            }

            resizeObserver.observe(document.body);
            updateParentHeight();
        });
        /* --- [End Block 3.1] INITIALIZATION & SETUP --- */

        /* --- [Start Block 3.2] RESIZE & POPUP HANDLERS --- */
        let lastReportedHeight = 0;
        let resizeTimer = null;
        function updateParentHeight() {
            if (window.parent !== window) {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    const totalHeight = document.body.scrollHeight;
                    if (Math.abs(totalHeight - lastReportedHeight) >= 2) {
                        lastReportedHeight = totalHeight;
                        window.parent.postMessage({
                            type: 'RESIZE_POPUP',
                            height: totalHeight
                        }, getTargetOrigin());
                    }
                }, 60);
            }
        }

        const resizeObserver = new ResizeObserver(() => {
            updateParentHeight();
        });

        window.addEventListener('load', updateParentHeight);

        function closeModal() {
            if (isSaving) return;
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'CLOSE_ADD_MENU' }, getTargetOrigin());
            }
        }
        /* --- [End Block 3.2] RESIZE & POPUP HANDLERS --- */

        /* --- [Start Block 3.3] DATABASE SAVE OPERATIONS --- */
        function parseNonNegativePrice(inputId) {
            const el = document.getElementById(inputId);
            const raw = el ? parseFloat(el.value) : 0;
            if (!Number.isFinite(raw) || raw < 0) return 0;
            return raw;
        }

        async function saveNewMenuData(e) {
            if (e) e.preventDefault();
            if (isSaving) return;

            const foodNameInput = document.getElementById('addFoodNameInput');
            const foodName = foodNameInput ? foodNameInput.value.trim() : '';
            const priceLocal = parseNonNegativePrice('addPrice1Input');
            const priceTourist = parseNonNegativePrice('addPrice2Input');
            const priceSabaidee = parseNonNegativePrice('addPrice3Input');

            if (!foodName) {
                alert('กรุณากรอกชื่อเมนูอาหาร');
                if (foodNameInput) foodNameInput.focus();
                return;
            }

            db = db || resolveSupabaseClient();
            if (!db || typeof db.from !== 'function') {
                alert('ไม่พบการเชื่อมต่อฐานข้อมูล (Supabase Client)');
                return;
            }

            setFormBusyState(true);

            try {
                const payload = {
                    food_name: foodName,
                    food_group_id: currentGroupId,
                    price_1: priceLocal,
                    price_2: priceTourist,
                    price_3: priceSabaidee
                };

                const { data, error } = await db.from('foods').insert([payload]).select().single();

                if (error) throw error;

                if (data && window.parent && window.parent !== window) {
                    const resolvedGroupId = data.food_group_id ?? currentGroupId;
                    window.parent.postMessage({
                        type: 'ADD_TO_CART',
                        cartItem: {
                            item_id: Date.now() + '_' + Math.random().toString(36).substring(2, 6),
                            food_id: data.food_id,
                            name: data.food_name,
                            price: data.price_1 ?? priceLocal,
                            base_price: data.price_1 ?? priceLocal,
                            price_1: data.price_1 ?? priceLocal,
                            price_2: data.price_2 ?? priceTourist,
                            price_3: data.price_3 ?? priceSabaidee,
                            cost_price: 0,
                            friedEggQty: 0,
                            omeletQty: 0,
                            qty: 1,
                            note: '',
                            food_group_id: resolvedGroupId
                        }
                    }, getTargetOrigin());
                }

                isSaving = false;
                closeModal();
            } catch (err) {
                console.error('Error saving menu:', err);
                alert('เกิดข้อผิดพลาดในการบันทึก: ' + (err && err.message ? err.message : err));
            } finally {
                setFormBusyState(false);
            }
        }
        /* --- [End Block 3.3] DATABASE SAVE OPERATIONS --- */
    </script>
    <!-- [End Block 3] JAVASCRIPT CORE LOGIC & FUNCTIONS -->
</body>
</html>
