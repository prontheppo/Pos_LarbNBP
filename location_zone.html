<!--
  ========================================================================
  FILE NAME: location_zone.html
  SUMMARY: แบ่งโครงสร้างออกเป็น 2 บล็อกหลัก และ 12 บล็อกย่อย ดังนี้

   - [บล็อก 1] UI COMPONENTS & LAYOUT (ส่วนแสดงผลหน้าจอผู้ใช้)
     (ประกอบด้วย 4 หัวข้อ)
       - [บล็อก 1.1] ADD NEW LOCATION (ช่องเพิ่มสถานที่ใหม่)
       - [บล็อก 1.2] ADD NEW ZONE (ช่องเพิ่มโซน/ห้องพักใหม่)
       - [บล็อก 1.3] LOCATION AND ZONE SELECTION GRID (ตารางแสดงรายการ Locations/Zones)
       - [บล็อก 1.4] CSS STYLES (รูปแบบ CSS พื้นฐาน)

   - [บล็อก 2] LOGIC & DATABASE OPERATIONS (ระบบการทำงานและการจัดการข้อมูล)
     (ประกอบด้วย 8 หัวข้อ)
       - [บล็อก 2.1] PAGE INITIALIZATION (เริ่มต้นการทำงานเมื่อโหลดหน้าเว็บ)
       - [บล็อก 2.2] AUTOMATIC POPUP HEIGHT ADJUSTMENT (ปรับความสูง Popup อัตโนมัติ)
       - [บล็อก 2.3] FETCH LOCATIONS AND ZONES FROM SUPABASE (ดึงข้อมูล Locations และ Zones จาก Supabase)
       - [บล็อก 2.4] RENDER LOCATION SELECTION VIEW (แสดงรายการสถานที่)
       - [บล็อก 2.5] RENDER ZONE SELECTION VIEW (แสดงรายการโซน)
       - [บล็อก 2.6] ADD NEW LOCATION TO DATABASE (เพิ่มสถานที่ใหม่)
       - [บล็อก 2.7] ADD NEW ZONE TO DATABASE (เพิ่มโซนใหม่)
       - [บล็อก 2.8] SELECT LOCATION AND RETURN DATA TO PARENT WINDOW (เลือกสถานที่และส่งข้อมูลกลับหน้าต่างแม่)
  ========================================================================
-->
<!DOCTYPE html>
<html lang="th">
<head>
    <script src="appInit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เลือกสถานที่ / โซน</title>
    
    <!-- Supabase JS Client, Tailwind CSS, and FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- ----------------------------------------------------------
         BLOCK 1.4: CSS STYLES
         ---------------------------------------------------------- -->
    <style>
        html, body { background-color: transparent; font-family: 'Sarabun', sans-serif; margin: 0; padding: 0; user-select: none; }
    </style>
    <!-- END BLOCK 1.4 -->
</head>
<body class="flex flex-col h-full bg-white">

    <!-- ==========================================================
         BLOCK 1: UI COMPONENTS & LAYOUT
         ========================================================== -->
    <div class="flex flex-col space-y-3 p-1">

        <!-- ----------------------------------------------------------
             BLOCK 1.1: ADD NEW LOCATION
             ---------------------------------------------------------- -->
        <div id="addLocationSection" class="bg-amber-50 p-2.5 rounded-2xl border border-amber-200 flex gap-2">
            <input type="text" id="newLocationInput" placeholder="➕ เพิ่มสถานที่ใหม่..." class="flex-1 h-9 px-3 text-xs rounded-xl border border-amber-300 bg-white outline-none">
            <button type="button" onclick="addNewLocation()" class="h-9 px-4 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs rounded-xl transition cursor-pointer shadow-sm">+ เพิ่ม</button>
        </div>
        <!-- END BLOCK 1.1 -->

        <!-- ----------------------------------------------------------
             BLOCK 1.2: ADD NEW ZONE
             ---------------------------------------------------------- -->
        <div id="addZoneSection" class="bg-blue-50 p-2.5 rounded-2xl border border-blue-200 flex gap-2 hidden">
            <input type="text" id="newZoneInput" placeholder="➕ เพิ่มโซน/ห้องพักใหม่..." class="flex-1 h-9 px-3 text-xs rounded-xl border border-blue-300 bg-white outline-none">
            <button type="button" onclick="addNewZone()" class="h-9 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl transition cursor-pointer shadow-sm">+ เพิ่ม</button>
        </div>
        <!-- END BLOCK 1.2 -->

        <!-- ----------------------------------------------------------
             BLOCK 1.3: LOCATION AND ZONE SELECTION GRID
             ---------------------------------------------------------- -->
        <div id="selectionGrid" class="grid grid-cols-2 gap-2.5 pt-1">
            <span class="text-slate-400 text-xs py-8 text-center col-span-2 block">⏳ กำลังโหลดข้อมูล...</span>
        </div>
        <!-- END BLOCK 1.3 -->

    </div>
    <!-- END BLOCK 1 -->

    <script>
        /* ==========================================================
           BLOCK 2: LOGIC & DATABASE OPERATIONS
           ========================================================== */
        let locationsData = [];
        let zonesData = [];
        let selectedLocationForZone = null;

        /* ----------------------------------------------------------
           BLOCK 2.1: PAGE INITIALIZATION
           ---------------------------------------------------------- */
        window.addEventListener('DOMContentLoaded', async () => {
            await fetchLocationsAndZonesFromSupabase();
            updateParentHeight();
        });
        /* END BLOCK 2.1 */

        /* ----------------------------------------------------------
           BLOCK 2.2: AUTOMATIC POPUP HEIGHT ADJUSTMENT
           ---------------------------------------------------------- */
        function updateParentHeight() {
            setTimeout(() => {
                if (window.self !== window.top) {
                    const totalHeight = document.body.scrollHeight + 20; // Add a small margin
                    window.top.postMessage({
                        type: 'RESIZE_POPUP',
                        height: totalHeight
                    }, '*');
                }
            }, 50);
        }
        /* END BLOCK 2.2 */

        /* ----------------------------------------------------------
           BLOCK 2.3: FETCH LOCATIONS AND ZONES FROM SUPABASE
           ---------------------------------------------------------- */
        async function fetchLocationsAndZonesFromSupabase() {
            try {
                if (typeof supabaseClient !== 'undefined') {
                    const [locRes, zoneRes] = await Promise.all([
                        supabaseClient.from('locations').select('*').order('location_name', { ascending: true }),
                        supabaseClient.from('location_zone').select('*').order('zone_name', { ascending: true })
                    ]);
                    
                    if (locRes.data) locationsData = locRes.data;
                    if (zoneRes.data) zonesData = zoneRes.data;
                    
                    renderLocationsView();
                } else {
                    document.getElementById('selectionGrid').innerHTML = '<span class="text-rose-500 text-xs py-8 text-center col-span-2 block">⚠️ ไม่พบการเชื่อมต่อ Supabase (ตรวจสอบ supabaseClient.js)</span>';
                    updateParentHeight();
                }
            } catch (err) {
                console.error("Error loading location/zone:", err);
                document.getElementById('selectionGrid').innerHTML = '<span class="text-rose-500 text-xs py-8 text-center col-span-2 block">❌ โหลดข้อมูลไม่สำเร็จ</span>';
                updateParentHeight();
            }
        }
        /* END BLOCK 2.3 */

        /* ----------------------------------------------------------
           BLOCK 2.4: RENDER LOCATION SELECTION VIEW
           ---------------------------------------------------------- */
        function renderLocationsView() {
            document.getElementById('addLocationSection').classList.remove('hidden');
            document.getElementById('addZoneSection').classList.add('hidden');
            const grid = document.getElementById('selectionGrid');
            
            grid.className = "grid grid-cols-2 gap-2.5 pt-1";
            grid.innerHTML = '';

            window.parent.postMessage({ type: 'UPDATE_POPUP_TITLE', title: '📍 เลือกสถานที่ / ที่พัก' }, '*');

            if (!locationsData || locationsData.length === 0) {
                grid.innerHTML = '<span class="text-slate-400 text-xs py-8 text-center col-span-2 block">ไม่พบข้อมูลสถานที่</span>';
                updateParentHeight();
                return;
            }

            locationsData.forEach(loc => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'py-3 px-3 bg-amber-50/60 hover:bg-amber-100 border border-amber-200/80 rounded-2xl text-center font-bold text-xs transition active:scale-95 cursor-pointer shadow-sm truncate';
                btn.innerHTML = `<div class="truncate">${loc.location_name}</div>`;
                btn.onclick = () => {
                    selectedLocationForZone = loc;
                    renderZonesView(loc);
                };
                grid.appendChild(btn);
            });

            updateParentHeight();
        }
        /* END BLOCK 2.4 */

        /* ----------------------------------------------------------
           BLOCK 2.5: RENDER ZONE SELECTION VIEW
           ---------------------------------------------------------- */
        function renderZonesView(loc) {
            window.parent.postMessage({ 
                type: 'UPDATE_POPUP_TITLE', 
                title: `🛋️ เลือกโซน <span class="text-amber-600 font-semibold text-xs block mt-0.5">สถานที่: ${loc.location_name}</span>` 
            }, '*');

            document.getElementById('addLocationSection').classList.add('hidden');
            document.getElementById('addZoneSection').classList.remove('hidden');
            const grid = document.getElementById('selectionGrid');
            
            grid.className = "grid grid-cols-3 gap-2.5 pt-1";
            grid.innerHTML = '';

            const filteredZones = zonesData.filter(z => String(z.location_id) === String(loc.location_id));
            if (filteredZones.length === 0) {
                selectLocationAndZone(loc.location_id, loc.location_name, null, '');
                return;
            }

            const backBtn = document.createElement('button');
            backBtn.type = 'button';
            backBtn.className = 'py-2.5 px-3 bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-2xl text-center font-bold text-xs transition active:scale-95 cursor-pointer col-span-3 text-slate-700 shadow-sm';
            backBtn.innerHTML = `⬅️ กลับไปเลือกสถานที่อื่น`;
            backBtn.onclick = () => renderLocationsView();
            grid.appendChild(backBtn);

            filteredZones.forEach(z => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'py-3 px-3 bg-blue-50/60 hover:bg-blue-100 border border-blue-200/80 rounded-2xl text-center font-bold text-xs transition active:scale-95 cursor-pointer shadow-sm truncate';
                btn.innerHTML = `<div class="truncate">${z.zone_name}</div>`;
                btn.onclick = () => selectLocationAndZone(loc.location_id, loc.location_name, z.zone_id, z.zone_name);
                grid.appendChild(btn);
            });

            updateParentHeight();
        }
        /* END BLOCK 2.5 */

        /* ----------------------------------------------------------
           BLOCK 2.6: ADD NEW LOCATION TO DATABASE
           ---------------------------------------------------------- */
        async function addNewLocation() {
            const input = document.getElementById('newLocationInput');
            const name = input.value.trim();
            if (!name) return;

            try {
                if (typeof supabaseClient !== 'undefined') {
                    const { data, error } = await supabaseClient.from('locations').insert([{ location_name: name, min_order_for_free_delivery: 300, delivery_fee: 20 }]).select().single();
                    if (!error && data) {
                        locationsData.push(data);
                        input.value = '';
                        renderLocationsView();
                    }
                }
            } catch (err) { console.error('Add location error:', err); }
        }
        /* END BLOCK 2.6 */

        /* ----------------------------------------------------------
           BLOCK 2.7: ADD NEW ZONE TO DATABASE
           ---------------------------------------------------------- */
        async function addNewZone() {
            const input = document.getElementById('newZoneInput');
            const name = input.value.trim();
            if (!name || !selectedLocationForZone) return;

            try {
                if (typeof supabaseClient !== 'undefined') {
                    const { data, error } = await supabaseClient.from('location_zone').insert([{ zone_name: name, location_id: selectedLocationForZone.location_id }]).select().single();
                    if (!error && data) {
                        zonesData.push(data);
                        input.value = '';
                        renderZonesView(selectedLocationForZone);
                    }
                }
            } catch (err) { console.error('Add zone error:', err); }
        }
        /* END BLOCK 2.7 */

        /* ----------------------------------------------------------
           BLOCK 2.8: SELECT LOCATION AND RETURN DATA TO PARENT WINDOW
           ---------------------------------------------------------- */
        function selectLocationAndZone(locId, locName, zoneId, zoneName) {
            window.parent.postMessage({
                type: 'SELECT_LOCATION',
                locationObj: {
                    location_id: locId,
                    location_name: locName,
                    zone_id: zoneId,
                    zone_name: zoneName
                }
            }, '*');
        }
        /* END BLOCK 2.8 */

        /* ==========================================================
           END BLOCK 2: LOGIC & DATABASE OPERATIONS
           ========================================================== */
    </script>
</body>
</html>
