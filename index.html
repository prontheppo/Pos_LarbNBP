<!--
  ========================================================================
  FILE NAME: index.html
  SUMMARY: จัดเรียงปุ่มใหม่เป็น 1 คอลัมน์เดี่ยวทั้งหมด (เรียงจากซ้ายไปขวาของแต่ละแถวเดิม)
   - [บล็อก 1] UI COMPONENTS & LAYOUT (ส่วนแสดงผลหน้าจอทั้งหมด)
     - [บล็อก 1.1] โครงสร้างหลัก Main Card (Main Card Layout)
     - [บล็อก 1.2] ส่วนหัว Header และชื่อร้าน (Header and Restaurant Name)
     - [บล็อก 1.3] รายการปุ่มเมนูทั้งหมด
     - [บล็อก 1.4] รูปแบบการแสดงผล CSS (CSS Styles)

   - [บล็อก 2] LOGIC & EVENT HANDLERS (ระบบการทำงานและจัดการเหตุการณ์)
     - [บล็อก 2.1] PREVENT GESTURE-BASED ZOOM (ป้องกันการซูมหน้าจอด้วย Gesture)
     - [บล็อก 2.2] PREVENT DOUBLE-TAP ZOOM AND MULTI-TOUCH (ป้องกัน Double Tap Zoom และการแตะหลายนิ้ว)
     - [บล็อก 2.3] NAVIGATE TO THE SPECIFIED PAGE (ฟังก์ชันเปลี่ยนหน้าเว็บ goToPage)
  ========================================================================
-->
<!DOCTYPE html>
<html lang="th">
<head>
    <script src="appInit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">

    <title>ลาบหนองบัวลำภู @เขื่อนขุนด่านปราการชล</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ----------------------------------------------------------
         BLOCK 1.4: CSS STYLES
         ---------------------------------------------------------- -->
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: auto;
            font-family: 'Sarabun', system-ui, -apple-system,
                BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f3f4f6;
            touch-action: pan-y;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .app-layout {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            min-height: 100dvh;
            width: 100vw;
            box-sizing: border-box;
            padding: 15px 12px 10px 12px;
        }

        .main-card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 16px 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            text-align: center;
        }

        .header-section {
            position: sticky;
            top: 0;
            background: #ffffff;
            z-index: 10;
            width: 100%;
            flex-shrink: 0;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #f1f5f9;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            flex: 1;
            padding: 2px 0;
            box-sizing: border-box;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 52px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            border-radius: 12px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06);
            transition: transform 0.1s ease;
            box-sizing: border-box;
            width: 100%;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-decoration: none;
            padding: 0 8px;
        }

        .menu-btn:active {
            transform: scale(0.98);
        }

        .btn-blue { background-color: #2563eb; }
        .btn-emerald { background-color: #059669; }
        .btn-amber-600 { background-color: #d97706; }
        .btn-teal { background-color: #0d9488; }
        .btn-cyan { background-color: #0891b2; }
        .btn-indigo { background-color: #4f46e5; }
        .btn-purple { background-color: #7c3aed; }
        .btn-slate { background-color: #334155; }
        .btn-rose { background-color: #e11d48; }
    </style>
    <!-- END BLOCK 1.4 -->
</head>

<body>
<div class="app-layout">

    <!-- ==========================================================
         BLOCK 1: UI COMPONENTS & LAYOUT
         ========================================================== -->

    <!-- ----------------------------------------------------------
         BLOCK 1.1: MAIN CARD LAYOUT
         ---------------------------------------------------------- -->
    <div id="homeView" class="main-card">

        <!-- ----------------------------------------------------------
             BLOCK 1.2: HEADER AND RESTAURANT NAME
             ---------------------------------------------------------- -->
        <div class="header-section">
            <h1 class="font-extrabold text-lg text-slate-800 leading-snug">
                ลาบหนองบัวลำภู
            </h1>
            <h2 class="font-bold text-sm text-slate-600 mt-0.5">
                @เขื่อนขุนด่านปราการชล
            </h2>
            <p class="text-[11px] text-gray-400 mt-0.5">
                ระบบจัดการร้านอาหารและสั่งอาหาร
            </p>
        </div>
        <!-- END BLOCK 1.2 -->

        <!-- ----------------------------------------------------------
             BLOCK 1.3: ALL MENU BUTTONS
             ---------------------------------------------------------- -->
        <div class="menu-list">

            <!-- 1. หน้าสั่งอาหาร (จากซ้าย แถวที่ 1) -->
            <button type="button"
                onclick="goToPage('ordersystem.html?tab=1')"
                class="menu-btn btn-blue">
                <span>📝 หน้าสั่งอาหาร</span>
            </button>

            <!-- 2. สั่งด่วน (จากขวา แถวที่ 1) -->
            <button type="button"
                onclick="goToPage('QuickOrder.html')"
                class="menu-btn btn-emerald">
                <span>⚡ สั่งด่วน</span>
            </button>

            <!-- 3. รายงานการขาย (จากซ้าย แถวที่ 2) -->
            <button type="button"
                onclick="goToPage('salesreport.html')"
                class="menu-btn btn-amber-600">
                <span>📊 รายงานการขาย</span>
            </button>

            <!-- 4. Line Report (จากขวา แถวที่ 2) -->
            <button type="button"
                onclick="goToPage('linereport.html')"
                class="menu-btn btn-teal">
                <span>💬 Line Report</span>
            </button>

            <!-- 5. ตั้งค่าราคาตามพื้นที่ (จากซ้าย แถวที่ 3) -->
            <button type="button"
                onclick="goToPage('set_location_pricing.html')"
                class="menu-btn btn-teal">
                <span>📍 ตั้งค่าราคาตามพื้นที่</span>
            </button>

            <!-- 6. ตั้งค่าการจัดส่ง (จากขวา แถวที่ 3) -->
            <button type="button"
                onclick="goToPage('settings_delivery.html')"
                class="menu-btn btn-cyan">
                <span>🚚 ตั้งค่าการจัดส่ง</span>
            </button>

            <!-- 7. จัดการรายการอาหาร & ราคา (แถวเดิมที่เป็น 1 คอลัมน์) -->
            <button type="button"
                onclick="goToPage('managemenu.html')"
                class="menu-btn btn-amber-600">
                <span>📋 จัดการรายการอาหาร & ราคา</span>
            </button>

            <!-- 8. จัดการสต็อกวัตถุดิบ (แถวเดิมที่เป็น 1 คอลัมน์) -->
            <button type="button"
                onclick="goToPage('stock_dashboard.html')"
                class="menu-btn btn-purple">
                <span>📦 จัดการสต็อกวัตถุดิบ</span>
            </button>

        </div>
        <!-- END BLOCK 1.3 -->

    </div>
    <!-- END BLOCK 1.1 -->

    <!-- END BLOCK 1 -->

</div>

<script>
    /* ==========================================================
       BLOCK 2: LOGIC & EVENT HANDLERS
       ========================================================== */

    /* ----------------------------------------------------------
       BLOCK 2.1: PREVENT GESTURE-BASED ZOOM
       ---------------------------------------------------------- */
    document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
    }, { passive: false });

    document.addEventListener('gesturechange', function (e) {
        e.preventDefault();
    }, { passive: false });

    document.addEventListener('gestureend', function (e) {
        e.preventDefault();
    }, { passive: false });
    /* END BLOCK 2.1 */

    let lastTouchEnd = 0;

    /* ----------------------------------------------------------
       BLOCK 2.2: PREVENT DOUBLE-TAP ZOOM AND MULTI-TOUCH
       ---------------------------------------------------------- */
    document.addEventListener('touchend', function (event) {
        const now = new Date().getTime();

        if (now - lastTouchEnd <= 300) {
            event.preventDefault();
        }

        lastTouchEnd = now;
    }, { passive: false });

    document.addEventListener('touchstart', function (event) {
        if (event.touches.length > 1) {
            event.preventDefault();
        }
    }, { passive: false });
    /* END BLOCK 2.2 */

    /* ----------------------------------------------------------
       BLOCK 2.3: NAVIGATE TO THE SPECIFIED PAGE
       ---------------------------------------------------------- */
    function goToPage(url) {
        window.location.href = url;
    }
    /* END BLOCK 2.3 */

    /* ==========================================================
       END BLOCK 2: LOGIC & EVENT HANDLERS
       ========================================================== */
</script>
</body>
</html>
