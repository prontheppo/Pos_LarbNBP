
<!DOCTYPE html>
<html lang="th">
<head>
    <script src="appInit.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">

    <title>ลาบหนองบัวลำภู @เขื่อนขุนด่านปราการชล</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="supabaseClient.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: auto;
            font-family: 'Sarabun', system-ui, -apple-system,
                BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f3f4f6;
            touch-action: pan-y;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .app-layout {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            min-height: 100dvh;
            width: 100vw;
            box-sizing: border-box;
            padding: 15px 12px 10px 12px;
        }

        .main-card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 16px 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            text-align: center;
        }

        .header-section {
            position: sticky;
            top: 0;
            background: #ffffff;
            z-index: 10;
            width: 100%;
            flex-shrink: 0;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #f1f5f9;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            flex: 1;
            padding: 2px 0;
            box-sizing: border-box;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 52px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border-radius: 12px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06);
            transition: transform 0.1s ease;
            box-sizing: border-box;
            width: 100%;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-decoration: none;
        }

        .menu-btn:active {
            transform: scale(0.98);
        }

        .btn-blue { background-color: #2563eb; }
        .btn-emerald { background-color: #059669; }
        .btn-amber-600 { background-color: #d97706; }
        .btn-teal { background-color: #0d9488; }
        .btn-cyan { background-color: #0891b2; }
        .btn-indigo { background-color: #4f46e5; }
        .btn-purple { background-color: #7c3aed; }
        .btn-slate { background-color: #334155; }
        .btn-rose { background-color: #e11d48; }
    </style>
</head>

<body>
<div class="app-layout">

    <!-- หน้าหลัก -->
    <div id="homeView" class="main-card">

        <div class="header-section">
            <h1 class="font-extrabold text-lg text-slate-800 leading-snug">
                ลาบหนองบัวลำภู
            </h1>
            <h2 class="font-bold text-sm text-slate-600 mt-0.5">
                @เขื่อนขุนด่านปราการชล
            </h2>
            <p class="text-[11px] text-gray-400 mt-0.5">
                ระบบจัดการร้านอาหารและสั่งอาหาร
            </p>
        </div>

        <div class="menu-list">

            <button type="button"
                onclick="goToPage('ordersystem.html?tab=1')"
                class="menu-btn btn-blue">
                <span>📝 หน้าสั่งอาหาร</span>
            </button>

            <button type="button"
                onclick="goToPage('QuickOrder.html')"
                class="menu-btn btn-emerald">
                <span>⚡ สั่งด่วน</span>
            </button>

            <button type="button"
                onclick="goToPage('managemenu.html')"
                class="menu-btn btn-amber-600">
                <span>📋 จัดการรายการอาหาร & ราคา</span>
            </button>

            <button type="button"
                onclick="goToPage('salesreport.html')"
                class="menu-btn btn-amber-600">
                <span>📊 รายงานการขาย</span>
            </button>

            <button type="button"
                onclick="goToPage('linereport.html')"
                class="menu-btn btn-teal">
                <span>💬 Line Report</span>
            </button>

            <!-- เปิดหน้าผู้ดูแลระบบที่แยกเป็นอีกไฟล์ -->
            <button type="button"
                onclick="goToPage('index_admin.html')"
                class="menu-btn btn-slate">
                <span>🔒 ผู้ดูแลระบบ</span>
            </button>

        </div>
    </div>

</div>

<script>
    // ป้องกัน Gesture Zoom
    document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
    }, { passive: false });

    document.addEventListener('gesturechange', function (e) {
        e.preventDefault();
    }, { passive: false });

    document.addEventListener('gestureend', function (e) {
        e.preventDefault();
    }, { passive: false });

    let lastTouchEnd = 0;

    document.addEventListener('touchend', function (event) {
        const now = new Date().getTime();

        if (now - lastTouchEnd <= 300) {
            event.preventDefault();
        }

        lastTouchEnd = now;
    }, { passive: false });

    document.addEventListener('touchstart', function (event) {
        if (event.touches.length > 1) {
            event.preventDefault();
        }
    }, { passive: false });

    function goToPage(url) {
        window.location.href = url;
    }
</script>
</body>
</html>
