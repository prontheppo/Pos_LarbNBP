<!-- ไฟล์: printorder.html -->
<!DOCTYPE html>
<html lang="th">
<head>
    <script src="appInit.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>พิมพ์ออร์เดอร์ - ลาบหนองบัวลำภู</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="supabaseClient.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 0; }
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; background: white; padding: 10px; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start min-h-screen p-3">

    <div id="printArea" class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-4 flex flex-col mb-4">
        <div class="text-center mb-2 pb-1 flex-shrink-0">
            <h2 class="font-extrabold text-slate-800 text-base leading-tight">ลาบหนองบัวลำภู @เขื่อนขุนด่าน</h2>
            <p class="text-[11px] text-slate-500 font-semibold">064-565-4951</p>
            <p class="text-xs text-slate-700 font-bold mt-0.5">รายการอาหาร<span id="customerGroupWrapper" class="hidden"> ( <span id="customerGroupLabel">-</span> )</span></p>
        </div>
        <div class="flex-1 flex flex-col min-h-0 overflow-hidden">
            <div class="border-2 border-slate-800 rounded-xl p-3 flex-1 flex flex-col min-h-0 mb-2">
                <div class="flex-1 overflow-y-auto pr-1">
                    <div id="itemListContainer" class="w-full space-y-1">
                        <p class="text-slate-300 font-bold text-center text-xs my-auto py-4">กำลังโหลดข้อมูล...</p>
                    </div>
                </div>
            </div>
            <div class="flex items-center justify-between border-b-2 border-dashed border-slate-200 pb-2 mb-2 flex-shrink-0">
                <div class="border border-slate-800 rounded-lg px-2 py-0.5">
                    <span id="summaryQty" class="font-extrabold text-xs text-slate-800">0 รายการ - 0 ชิ้น</span>
                </div>
                <div class="text-right">
                    <span class="font-extrabold text-sm text-slate-900">รวม <span id="summaryTotal">0</span> บาท</span>
                </div>
            </div>
            <div id="touristOnlySection" class="hidden text-center flex-shrink-0 my-0.5">
                <p class="text-[11px] font-bold text-slate-700">⭐ ขอบพระคุณที่อุดหนุนค่ะ ⭐</p>
                <div class="flex justify-center my-1">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=ลาบหนองบัวลำภู" alt="QR Code" class="w-16 h-16 object-contain">
                </div>
            </div>
        </div>
        <div class="pt-2 border-t border-slate-100 flex gap-2 flex-shrink-0 no-print mt-3">
            <button type="button" onclick="window.location.href='ordersystem.html?tab=2'" class="w-full py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-extrabold text-xs rounded-xl transition cursor-pointer">⬅ กลับไปแก้ไข</button>
            <button type="button" onclick="handleSaveOrder(false)" id="saveOnlyBtn" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs rounded-xl shadow transition cursor-pointer">💾 บันทึก</button>
            <button type="button" onclick="handleSaveOrder(true)" id="saveAndPrintBtn" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-xs rounded-xl shadow transition cursor-pointer">🖨️ บันทึก / พิมพ์</button>
        </div>
    </div>

    <script>
        let orderData = null;

        window.addEventListener('DOMContentLoaded', () => {
            const rawData = sessionStorage.getItem('printOrderData');
            if (!rawData) {
                Swal.fire('แจ้งเตือน', 'ไม่พบข้อมูลออร์เดอร์ กรุณาเลือกรายการใหม่', 'warning').then(() => {
                    window.location.href = 'ordersystem.html';
                });
                return;
            }
            orderData = JSON.parse(rawData);
            renderPrintPreview();
        });

        function renderPrintPreview() {
            const { locationData, customerDisplayName, orderSummary } = orderData;
            const container = document.getElementById('itemListContainer');
            const groupWrapper = document.getElementById('customerGroupWrapper');
            const groupLabel = document.getElementById('customerGroupLabel');
            const touristSection = document.getElementById('touristOnlySection');

            if (locationData.groupId === 2) {
                touristSection.classList.remove('hidden');
                let display = [locationData.locationName, locationData.zoneName].filter(Boolean).join(' - ') || 'นักท่องเที่ยว';
                if (customerDisplayName) display += ` (${customerDisplayName})`;
                groupLabel.textContent = display;
                groupWrapper.classList.remove('hidden');
            } else {
                touristSection.classList.add('hidden');
                groupWrapper.classList.add('hidden');
            }

            let html = '';
            orderSummary.processedCart.forEach(item => {
                // รวบรวมรายละเอียดเสริม (ราคาพิเศษ, ไข่ดาว, ไข่เจียว, โน้ต) มาต่อท้ายในวงเล็บ
                let details = [];
                const hasCustomPrice = item.isCustomPrice || item.is_custom_price || item.is_custom || item.isCustom || item.custom_price !== undefined;
                if (hasCustomPrice && item.price > 0) details.push(`⭐ ราคาพิเศษ ${item.price}.-`);
                
                const daoQty = Number(item.friedEggQty || item.khaiDaoQty || 0);
                if (daoQty > 0) details.push(`ไข่ดาว ${daoQty}`);
                
                const jiaoQty = Number(item.omeletQty || item.khaiJiaoQty || 0);
                if (jiaoQty > 0) details.push(`ไข่เจียว ${jiaoQty}`);
                
                if (item.note) details.push(item.note);

                let detailStr = details.length > 0 ? ` <span class="text-amber-700 font-normal">(${details.join(', ')})</span>` : '';

                html += `
                    <div class="flex justify-between items-start text-xs font-bold text-slate-800 py-1 border-b border-slate-100 last:border-none">
                        <div class="flex-1 pr-1 flex items-start gap-1">
                            <span class="text-slate-600 shrink-0">x${item.qty}</span>
                            <div><span>${item.name}</span>${detailStr}</div>
                        </div>
                        <span class="font-extrabold text-slate-900 ml-2 shrink-0">${item.total_price}.-</span>
                    </div>
                `;
            });

            if (orderSummary.deliveryFee > 0) {
                html += `
                    <div class="flex justify-between items-center text-xs font-bold text-slate-700 pt-1.5 border-t border-slate-200 mt-1">
                        <span>🛵 ค่าบริการจัดส่ง</span>
                        <span>${orderSummary.deliveryFee}.-</span>
                    </div>
                `;
            }

            container.innerHTML = html;
            document.getElementById('summaryQty').textContent = `${orderSummary.itemsCount} รายการ - ${orderSummary.totalQty} ชิ้น`;
            document.getElementById('summaryTotal').textContent = orderSummary.grandTotal.toLocaleString();
        }

        async function handleSaveOrder(shouldPrint = false) {
            try {
                const saveBtn1 = document.getElementById('saveOnlyBtn');
                const saveBtn2 = document.getElementById('saveAndPrintBtn');
                if (saveBtn1) saveBtn1.disabled = true;
                if (saveBtn2) saveBtn2.disabled = true;

                const { locationData, customerDisplayName, customerId, orderSummary } = orderData;

                let finalNickname = customerDisplayName;
                if (!finalNickname) {
                    finalNickname = locationData.locationName || 'ลูกค้าทั่วไป';
                    if (locationData.zoneName && locationData.zoneName !== locationData.locationName) {
                        finalNickname += ` (${locationData.zoneName})`;
                    }
                }

                const now = new Date();
                const thaiTime = new Date(now.getTime() + (7 * 60 * 60 * 1000)).toISOString().replace('Z', '+07:00');

                const { error } = await supabaseClient.from('orders').insert([{
                    created_at: thaiTime,
                    customer_type_id: Number(locationData.groupId),
                    customer_name: finalNickname,
                    customer_id: customerId ? String(customerId) : null,
                    location_id: locationData.locationId ? Number(locationData.locationId) : null,
                    zone_id: locationData.zoneId ? Number(locationData.zoneId) : null,
                    subtotal: orderSummary.subtotal,
                    delivery_fee: orderSummary.deliveryFee,
                    total_price: orderSummary.grandTotal,
                    total_qty: orderSummary.totalQty,
                    items: orderSummary.processedCart,
                    note: ''
                }]).select();

                if (error) throw error;
                if (shouldPrint) window.print();

                localStorage.removeItem('cart');
                sessionStorage.removeItem('printOrderData');
                window.location.href = 'ordersystem.html?tab=1';

            } catch (err) {
                Swal.fire('เกิดข้อผิดพลาด', err.message, 'error');
                const saveBtn1 = document.getElementById('saveOnlyBtn');
                const saveBtn2 = document.getElementById('saveAndPrintBtn');
                if (saveBtn1) saveBtn1.disabled = false;
                if (saveBtn2) saveBtn2.disabled = false;
            }
        }
    </script>
</body>
</html>
