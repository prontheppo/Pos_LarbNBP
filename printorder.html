<!DOCTYPE html>
<html lang="th">
<head>
    <!-- [Start Block 1.1] HEAD CONFIGURATION & DEPENDENCIES -->
    <script src="appInit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>พิมพ์ออร์เดอร์ - ลาบหนองบัวลำภู</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- [End Block 1.1] HEAD CONFIGURATION & DEPENDENCIES -->

    <!-- [Start Block 1.2] GLOBAL STYLES -->
    <style>
        /* ✅ เพิ่ม override ให้ printorder scroll ได้ (top window) */
        html, body {
            height: auto !important;
            min-height: 100vh !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
        }

        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 0; }
        input, select, textarea, button { font-size: 16px; }

        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; background: white; padding: 10px; }
            .no-print { display: none !important; }
        }
    </style>
    <!-- [End Block 1.2] GLOBAL STYLES -->
</head>
<body class="flex flex-col items-center justify-start min-h-screen p-3">

    <!-- ==========================================================
         [Start Block 2] USER INTERFACE & LAYOUT COMPONENTS
         ========================================================== -->
    <div id="printArea" class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-4 flex flex-col mb-4">
        <div class="text-center mb-2 pb-1 flex-shrink-0">
            <h2 class="font-extrabold text-slate-800 text-base leading-tight">ลาบหนองบัวลำภู @เขื่อนขุนด่าน</h2>
            <p class="text-[11px] text-slate-500 font-semibold">064-565-4951</p>
            <p class="text-xs text-slate-700 font-bold mt-0.5">รายการอาหาร<span id="customerGroupWrapper" class="hidden"> ( <span id="customerGroupLabel">-</span> )</span></p>
        </div>
        <div class="flex-1 flex flex-col min-h-0 overflow-hidden">
            <div class="border-2 border-slate-800 rounded-xl p-3 flex-1 flex flex-col min-h-0 mb-2">
                <div class="flex-1 overflow-y-auto pr-1">
                    <div id="itemListContainer" class="w-full space-y-1">
                        <p class="text-slate-300 font-bold text-center text-xs my-auto py-4">⏳ กำลังโหลดข้อมูล...</p>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between border-b-2 border-dashed border-slate-200 pb-2 mb-2 flex-shrink-0">
                <div class="border border-slate-800 rounded-lg px-2 py-0.5">
                    <span id="summaryQty" class="font-extrabold text-xs text-slate-800">0 รายการ - 0 ชิ้น</span>
                </div>
                <div class="text-right">
                    <span class="font-extrabold text-sm text-slate-900">รวม <span id="summaryTotal">0</span> บาท</span>
                </div>
            </div>

            <div id="touristOnlySection" class="hidden text-center flex-shrink-0 my-0.5">
                <p class="text-[11px] font-bold text-slate-700">⭐ ขอบพระคุณที่อุดหนุนค่ะ ⭐</p>
                <div class="flex justify-center my-1">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=ลาบหนองบัวลำภู" alt="QR Code" class="w-16 h-16 object-contain">
                </div>
            </div>
        </div>

        <div class="pt-2 border-t border-slate-100 flex gap-2 flex-shrink-0 no-print mt-3">
            <button type="button" onclick="window.location.href='index.html?tab=2'" class="w-full py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-extrabold text-xs rounded-xl transition cursor-pointer">⬅ กลับไปแก้ไข</button>
            <button type="button" onclick="handleSaveOrder(false)" id="saveOnlyBtn" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs rounded-xl shadow transition cursor-pointer">💾 บันทึก</button>
            <button type="button" onclick="handleSaveOrder(true)" id="saveAndPrintBtn" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-xs rounded-xl shadow transition cursor-pointer">🖨️ บันทึก / พิมพ์</button>
        </div>
    </div>

    <!-- ==========================================================
         [Start Block 3] JAVASCRIPT CORE LOGIC & EVENT HANDLERS
         ========================================================== -->
    <script>
        /* --- [Start Block 3.1] STATE VARIABLES & INITIALIZATION --- */
        let orderData = null;

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const rawData = sessionStorage.getItem('printOrderData');
            if (!rawData) {
                Swal.fire('แจ้งเตือน', 'ไม่พบข้อมูลออร์เดอร์ กรุณาเลือกรายการใหม่', 'warning').then(() => {
                    window.location.href = 'index.html';
                });
                return;
            }
            try {
                orderData = JSON.parse(rawData);
                if (!orderData || !orderData.locationData || !orderData.orderSummary || !Array.isArray(orderData.orderSummary.processedCart)) {
                    throw new Error('โครงสร้างข้อมูลออร์เดอร์ไม่ถูกต้อง');
                }
                if (!orderData.orderSessionId) {
                    orderData.orderSessionId = `ord_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
                }
                renderPrintPreview();
            } catch (error) {
                console.error('Invalid printOrderData:', error);
                sessionStorage.removeItem('printOrderData');
                Swal.fire('แจ้งเตือน', 'ข้อมูลออร์เดอร์ไม่สมบูรณ์ กรุณาเลือกรายการใหม่', 'warning').then(() => {
                    window.location.href = 'index.html';
                });
            }
        });
        /* --- [End Block 3.1] STATE VARIABLES & INITIALIZATION --- */

        /* --- [Start Block 3.2] RENDER RECEIPT & PREVIEW --- */
        function renderPrintPreview() {
            const { locationData, customerDisplayName, orderSummary } = orderData;
            const container = document.getElementById('itemListContainer');
            const groupWrapper = document.getElementById('customerGroupWrapper');
            const groupLabel = document.getElementById('customerGroupLabel');
            const touristSection = document.getElementById('touristOnlySection');

            if (locationData.groupId === 2) {
                touristSection.classList.remove('hidden');

                let display = [locationData.locationName, locationData.zoneName].filter(Boolean).join(' - ') || 'นักท่องเที่ยว';

                const cleanPhone = (customerDisplayName || '').replace(/\D/g, '');
                if (cleanPhone.length === 10 && cleanPhone.startsWith('0')) {
                    const formattedPhone = `${cleanPhone.slice(0, 3)}-${cleanPhone.slice(3, 6)}-${cleanPhone.slice(6)}`;
                    display += ` {${formattedPhone}}`;
                }

                groupLabel.textContent = display;
                groupWrapper.classList.remove('hidden');
            } else {
                touristSection.classList.add('hidden');
                groupWrapper.classList.add('hidden');
            }

            let html = '';
            orderSummary.processedCart.forEach(item => {
                let cleanName = (item.name || '').replace(/\s*\(สินค้าฝากซื้อ.*?\)/g, '').trim();

                let details = [];
                const hasCustomPrice = item.isCustomPrice || item.is_custom_price || item.is_custom || item.isCustom || item.custom_price !== undefined;
                if (hasCustomPrice && item.price > 0) details.push(`⭐ ราคาพิเศษ ${escapeHtml(item.price)}.-`);

                const daoQty = Number(item.friedEggQty || item.khaiDaoQty || 0);
                if (daoQty > 0) details.push(`ไข่ดาว ${daoQty}`);

                const jiaoQty = Number(item.omeletQty || item.khaiJiaoQty || 0);
                if (jiaoQty > 0) details.push(`ไข่เจียว ${jiaoQty}`);

                if (item.note) {
                    let cleanNote = String(item.note).replace(/สินค้าฝากซื้อ/g, '').replace(/[()]/g, '').trim();
                    if (cleanNote) details.push(escapeHtml(cleanNote));
                }

                let detailStr = details.length > 0 ? ` <span class="text-amber-700 font-normal">(${details.join(', ')})</span>` : '';
                const safeQty = Math.max(1, Number(item.qty) || 1);
                const safeTotalPrice = escapeHtml(item.total_price ?? 0);

                html += `
                    <div class="flex justify-between items-start text-xs font-bold text-slate-800 py-1 border-b border-slate-100 last:border-none">
                        <div class="flex-1 pr-1 flex items-start gap-1">
                            <span class="text-slate-600 shrink-0">x${safeQty}</span>
                            <div><span>${escapeHtml(cleanName)}</span>${detailStr}</div>
                        </div>
                        <span class="font-extrabold text-slate-900 ml-2 shrink-0">${safeTotalPrice}.-</span>
                    </div>
                `;
            });

            if (orderSummary.deliveryFee > 0) {
                html += `
                    <div class="flex justify-between items-center text-xs font-bold text-slate-700 pt-1.5 border-t border-slate-200 mt-1">
                        <span>🛵 ค่าบริการจัดส่ง</span>
                        <span>${escapeHtml(orderSummary.deliveryFee)}.-</span>
                    </div>
                `;
            }

            container.innerHTML = html;
            document.getElementById('summaryQty').textContent = `${orderSummary.itemsCount} รายการ - ${orderSummary.totalQty} ชิ้น`;
            document.getElementById('summaryTotal').textContent = Number(orderSummary.grandTotal || 0).toLocaleString();
        }
        /* --- [End Block 3.2] RENDER RECEIPT & PREVIEW --- */

        /* --- [Start Block 3.3] STOCK DEDUCTION ON SAVE / PRINT --- */
        /* หักยอดสต็อกในตาราง food_stock เฉพาะตอนกดบันทึกหรือบันทึก/พิมพ์ โดยไม่บล็อกแม้เหลือ 0 และกันหักซ้ำ */
        async function deductStockOnce(payload) {
            if (!payload || typeof supabaseClient === 'undefined') return;

            const sessionKey = payload.orderSessionId
                ? `stock_deducted_${payload.orderSessionId}`
                : null;

            if (payload.stockDeducted || (sessionKey && sessionStorage.getItem(sessionKey) === '1')) {
                return;
            }

            const items = payload.orderSummary?.processedCart || [];
            if (!Array.isArray(items) || items.length === 0) return;

            const qtyByFoodId = {};
            for (const item of items) {
                const foodId = Number(item.food_id || item.id);
                const orderQty = Math.max(1, Number(item.qty) || 1);
                if (!Number.isFinite(foodId)) continue;
                qtyByFoodId[foodId] = (qtyByFoodId[foodId] || 0) + orderQty;
            }

            const foodIds = Object.keys(qtyByFoodId).map(Number);
            if (foodIds.length === 0) return;

            const { data: relations, error: relError } = await supabaseClient
                .from('menu_food_stock')
                .select('food_id, food_stock_id')
                .in('food_id', foodIds);

            if (relError) {
                throw new Error(relError.message || 'ไม่สามารถดึงข้อมูลความสัมพันธ์สต็อกได้');
            }

            const usageByStockId = {};
            for (const rel of (relations || [])) {
                const foodId = Number(rel.food_id);
                const stockId = Number(rel.food_stock_id);
                if (!Number.isFinite(foodId) || !Number.isFinite(stockId)) continue;
                usageByStockId[stockId] = (usageByStockId[stockId] || 0) + (qtyByFoodId[foodId] || 0);
            }

            const stockIds = Object.keys(usageByStockId).map(Number);
            if (stockIds.length === 0) {
                payload.stockDeducted = true;
                sessionStorage.setItem('printOrderData', JSON.stringify(payload));
                if (sessionKey) sessionStorage.setItem(sessionKey, '1');
                return;
            }

            const { data: stockRows, error: fetchError } = await supabaseClient
                .from('food_stock')
                .select('food_stock_id, quantity')
                .in('food_stock_id', stockIds);

            if (fetchError || !stockRows) {
                throw new Error(fetchError?.message || 'ไม่สามารถดึงข้อมูลสต็อกได้');
            }

            for (const row of stockRows) {
                const stockId = Number(row.food_stock_id);
                const currentQty = Number(row.quantity) || 0;
                const usedQty = Number(usageByStockId[stockId]) || 0;
                const nextQty = Math.max(0, currentQty - usedQty);

                const { error: updateError } = await supabaseClient
                    .from('food_stock')
                    .update({ quantity: nextQty })
                    .eq('food_stock_id', stockId);

                if (updateError) {
                    throw new Error(`ตัดสต็อก food_stock_id=${stockId} ไม่สำเร็จ: ${updateError.message}`);
                }
            }

            payload.stockDeducted = true;
            sessionStorage.setItem('printOrderData', JSON.stringify(payload));
            if (sessionKey) sessionStorage.setItem(sessionKey, '1');
        }
        /* --- [End Block 3.3] STOCK DEDUCTION ON SAVE / PRINT --- */

        /* --- [Start Block 3.4] SAVE ORDER & PRINT HANDLER --- */
        async function handleSaveOrder(shouldPrint = false) {
            try {
                const saveBtn1 = document.getElementById('saveOnlyBtn');
                const saveBtn2 = document.getElementById('saveAndPrintBtn');
                if (saveBtn1) saveBtn1.disabled = true;
                if (saveBtn2) saveBtn2.disabled = true;

                await deductStockOnce(orderData);

                const { locationData, customerDisplayName, customerId, orderSummary } = orderData;

                let finalNickname = customerDisplayName;
                if (!finalNickname) {
                    finalNickname = locationData.locationName || 'ลูกค้าทั่วไป';
                    if (locationData.zoneName && locationData.zoneName !== locationData.locationName) {
                        finalNickname += ` (${locationData.zoneName})`;
                    }
                }

                const createdAt = new Date().toISOString();

                const { error } = await supabaseClient.from('orders').insert([{
                    created_at: createdAt,
                    customer_type_id: Number(locationData.groupId),
                    customer_name: finalNickname,
                    customer_id: customerId ? String(customerId) : null,
                    location_id: locationData.locationId ? Number(locationData.locationId) : null,
                    zone_id: locationData.zoneId ? Number(locationData.zoneId) : null,
                    subtotal: orderSummary.subtotal,
                    delivery_fee: orderSummary.deliveryFee,
                    total_price: orderSummary.grandTotal,
                    total_qty: orderSummary.totalQty,
                    items: orderSummary.processedCart,
                    note: ''
                }]).select();

                if (error) throw error;
                if (shouldPrint) window.print();

                localStorage.removeItem('cart');
                localStorage.removeItem('orderLocationState');
                sessionStorage.removeItem('printOrderData');
                window.location.href = 'index.html?tab=1';

            } catch (err) {
                Swal.fire('เกิดข้อผิดพลาด', err.message, 'error');
                const saveBtn1 = document.getElementById('saveOnlyBtn');
                const saveBtn2 = document.getElementById('saveAndPrintBtn');
                if (saveBtn1) saveBtn1.disabled = false;
                if (saveBtn2) saveBtn2.disabled = false;
            }
        }
        /* --- [End Block 3.4] SAVE ORDER & PRINT HANDLER --- */
    </script>
    <!-- [End Block 3] JAVASCRIPT CORE LOGIC & EVENT HANDLERS -->
</body>
</html>
