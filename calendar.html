<!DOCTYPE html>
<html lang="th">
<head>
    <!-- Initialize Application -->
    <script src="appInit.js"></script>

    <!-- Load Supabase SDK Before Client Initialization -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Initialize Supabase Client -->
    <script src="supabaseClient.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เลือกวันที่ออเดอร์</title>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: transparent; 
            margin: 0; 
            padding: 0; 
        }

        input, select, textarea, button {
            font-size: 16px;
        }
    </style>
</head>
<body class="flex items-center justify-center p-1">

    <!-- ==========================================================
         [Start Block 1] USER INTERFACE & LAYOUT COMPONENTS
         ส่วนติดต่อผู้ใช้และองค์ประกอบหน้าจอ
         ========================================================== -->
    <div class="bg-white rounded-2xl max-w-sm w-full p-4 shadow-sm flex flex-col space-y-4">

        <!-- [Start Block 1.1] MONTH & YEAR HEADER -->
        <!-- ส่วนหัวแสดงเดือนและปี -->
        <div class="flex justify-between items-center px-2">
            <button type="button" onclick="CalendarSystem.changeMonth(-1)" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 font-bold flex items-center justify-center text-xs cursor-pointer">❮</button>
            <h2 id="calMonthYearTitle" class="font-bold text-sm text-slate-800">เดือน ปี</h2>
            <button type="button" onclick="CalendarSystem.changeMonth(1)" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 font-bold flex items-center justify-center text-xs cursor-pointer">❯</button>
        </div>
        <!-- [End Block 1.1] MONTH & YEAR HEADER -->

        <!-- [Start Block 1.2] WEEKDAY HEADER -->
        <!-- ส่วนหัวแสดงชื่อวันในสัปดาห์ -->
        <div class="grid grid-cols-7 text-center text-[11px] font-bold text-slate-400">
            <div>อา</div><div>จ</div><div>อ</div><div>พ</div><div>พฤ</div><div>ศ</div><div>ส</div>
        </div>
        <!-- [End Block 1.2] WEEKDAY HEADER -->

        <!-- [Start Block 1.3] CALENDAR DAYS GRID -->
        <!-- ส่วนตารางแสดงวันและจำนวนออเดอร์ -->
        <div id="calDaysGrid" class="grid grid-cols-7 gap-1 text-center text-xs">
            <div class="col-span-7 text-slate-400 py-6 text-xs font-medium">⏳ กำลังโหลดปฏิทิน...</div>
        </div>
        <!-- [End Block 1.3] CALENDAR DAYS GRID -->

        <!-- [Start Block 1.4] BOTTOM CONTROL BUTTONS -->
        <!-- ส่วนปุ่มควบคุมด้านล่าง -->
        <div class="flex gap-2 pt-2 border-t">
            <button type="button" onclick="CalendarSystem.selectToday()" class="flex-1 bg-emerald-50 text-emerald-700 font-bold py-2 rounded-xl text-xs hover:bg-emerald-100 border border-emerald-200 cursor-pointer">📅 วันนี้</button>
            <button type="button" onclick="CalendarSystem.close()" class="flex-1 bg-slate-100 text-slate-700 font-bold py-2 rounded-xl text-xs hover:bg-slate-200 cursor-pointer">ปิด</button>
        </div>
        <!-- [End Block 1.4] BOTTOM CONTROL BUTTONS -->

    </div>
    <!-- [End Block 1] USER INTERFACE & LAYOUT COMPONENTS -->

    <!-- ==========================================================
         [Start Block 2] JAVASCRIPT CORE LOGIC & EVENT HANDLERS
         การทำงานส่วนตรรกะและฟังก์ชันของระบบ
         ========================================================== -->
    <script>
        let db = null;

        /* --- [Start Block 2.1] INITIALIZATION & DATE HELPERS --- */
        /* ฟังก์ชันตั้งค่าเริ่มต้นและตัวช่วยจัดการวันที่ตาม Timezone กรุงเทพฯ */
        function getBangkokDateParts(value = new Date()) {
            const date = value instanceof Date ? value : new Date(value);

            if (Number.isNaN(date.getTime())) {
                return null;
            }

            const parts = new Intl.DateTimeFormat('en-GB', {
                timeZone: 'Asia/Bangkok',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).formatToParts(date);

            const result = {};

            parts.forEach(part => {
                if (part.type !== 'literal') {
                    result[part.type] = part.value;
                }
            });

            return result;
        }

        function getBangkokDateString(value) {
            if (value === null || value === undefined || value === '') {
                return null;
            }

            const rawValue = String(value).trim();

            if (/^\d{4}-\d{2}-\d{2}$/.test(rawValue)) {
                return rawValue;
            }

            const parts = getBangkokDateParts(rawValue);

            if (!parts) {
                return null;
            }

            return `${parts.year}-${parts.month}-${parts.day}`;
        }

        const initialBangkokDate = getBangkokDateParts();

        const CalendarSystem = {
            activeYear: Number(initialBangkokDate.year),
            activeMonth: Number(initialBangkokDate.month) - 1,
            eventsData: {},

            async init() {
                if (typeof window.supabaseClient !== 'undefined') {
                    db = window.supabaseClient;
                } else if (typeof supabaseClient !== 'undefined') {
                    db = supabaseClient;
                }

                await this.fetchOrderCounts();
                this.render();
            },
        /* --- [End Block 2.1] INITIALIZATION & DATE HELPERS --- */


        /* --- [Start Block 2.2] FETCH ORDER COUNTS --- */
        /* ฟังก์ชันดึงจำนวนออเดอร์จากฐานข้อมูล Supabase ตามวันที่ */
            async fetchOrderCounts() {
                if (!db) {
                    console.error("Supabase client not found in calendar!");
                    return;
                }

                try {
                    const { data, error } = await db.from('orders').select('created_at');

                    if (error) {
                        console.error("Error fetching order counts for calendar:", error);
                        return;
                    }

                    this.eventsData = {};

                    if (data && data.length > 0) {
                        data.forEach(order => {
                            const rawDate = order.created_at;

                            if (rawDate) {
                                const dateStr = getBangkokDateString(rawDate);

                                if (dateStr) {
                                    this.eventsData[dateStr] = (this.eventsData[dateStr] || 0) + 1;
                                }
                            }
                        });
                    }
                } catch (err) {
                    console.error("Exception fetching order counts:", err);
                }
            },
        /* --- [End Block 2.2] FETCH ORDER COUNTS --- */


        /* --- [Start Block 2.3] CHANGE MONTH --- */
        /* ฟังก์ชันสำหรับเปลี่ยนเดือนก่อนหน้าหรือถัดไป */
            async changeMonth(dir) {
                this.activeMonth += dir;

                if (this.activeMonth > 11) {
                    this.activeMonth = 0;
                    this.activeYear++;
                } else if (this.activeMonth < 0) {
                    this.activeMonth = 11;
                    this.activeYear--;
                }

                this.render();
            },
        /* --- [End Block 2.3] CHANGE MONTH --- */


        /* --- [Start Block 2.4] SELECT TODAY --- */
        /* ฟังก์ชันเลือกวันที่ปัจจุบันตาม Timezone กรุงเทพฯ */
            selectToday() {
                const dStr = getBangkokDateString(new Date());

                if (dStr) {
                    this.sendDateToParent(dStr);
                }
            },
        /* --- [End Block 2.4] SELECT TODAY --- */


        /* --- [Start Block 2.5] SEND DATE TO PARENT --- */
        /* ฟังก์ชันส่งค่าวันที่ที่เลือกไปยังหน้าต่างหลักผ่าน postMessage */
            sendDateToParent(dStr) {
                if (window.parent !== window) {
                    window.parent.postMessage({
                        action: 'SELECT_DATE',
                        selectedDate: dStr
                    }, window.location.origin);
                }
            },
        /* --- [End Block 2.5] SEND DATE TO PARENT --- */


        /* --- [Start Block 2.6] CLOSE CALENDAR --- */
        /* ฟังก์ชันส่งคำสั่งปิดหน้าต่างปฏิทิน */
            close() {
                if (window.parent !== window) {
                    window.parent.postMessage({ action: 'CLOSE_MODAL' }, window.location.origin);
                }
            },
        /* --- [End Block 2.6] CLOSE CALENDAR --- */


        /* --- [Start Block 2.7] RENDER CALENDAR --- */
        /* ฟังก์ชันเรนเดอร์โครงสร้างปฏิทินและแสดงผลจำนวนออเดอร์ */
            render() {
                const thaiMonths = [
                    "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน",
                    "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม",
                    "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
                ];

                document.getElementById('calMonthYearTitle').textContent =
                    `${thaiMonths[this.activeMonth]} ${this.activeYear + 543}`;

                const grid = document.getElementById('calDaysGrid');
                grid.innerHTML = '';

                const firstDay = new Date(
                    Date.UTC(this.activeYear, this.activeMonth, 1)
                ).getUTCDay();

                const totalDays = new Date(
                    Date.UTC(this.activeYear, this.activeMonth + 1, 0)
                ).getUTCDate();

                const todayStr = getBangkokDateString(new Date());

                for (let i = 0; i < firstDay; i++) {
                    grid.appendChild(document.createElement('div'));
                }

                for (let d = 1; d <= totalDays; d++) {
                    const dStr =
                        `${this.activeYear}-${String(this.activeMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'relative h-9 w-9 mx-auto rounded-full font-bold text-xs flex items-center justify-center transition cursor-pointer ';

                    const isToday = (dStr === todayStr);

                    if (isToday) {
                        btn.className += ' border-2 border-rose-500 text-rose-600 bg-rose-50 ';
                    } else {
                        btn.className += ' text-slate-700 hover:bg-slate-100';
                    }

                    const eventCount = this.eventsData[dStr] || 0;
                    let badgeHtml = '';

                    if (eventCount > 0) {
                        badgeHtml = `<span class="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full min-w-[16px] flex items-center justify-center shadow-sm border border-white leading-none">${eventCount}</span>`;
                    }

                    btn.innerHTML = `<span>${d}</span>${badgeHtml}`;
                    btn.onclick = () => {
                        this.sendDateToParent(dStr);
                    };

                    grid.appendChild(btn);
                }
            }
        /* --- [End Block 2.7] RENDER CALENDAR --- */
        };

        window.addEventListener('DOMContentLoaded', () => {
            CalendarSystem.init();
        });
    </script>
    <!-- [End Block 2] JAVASCRIPT CORE LOGIC & EVENT HANDLERS -->
</body>
</html>
