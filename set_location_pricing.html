<!DOCTYPE html>
<html lang="th">
<head>
    <script src="appInit.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>จัดการราคาพิเศษตามสถานที่ - ลาบหนองบัวลำภู</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- เรียกไฟล์ Initialization ของ Supabase -->
    <script src="supabaseClient.js"></script>
    
    <style>
      :root { --bg-color: #f8fafc; }
      html, body { 
          height: 100%; margin: 0; padding: 0; overflow: hidden; 
          font-family: 'Sarabun', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
          background-color: var(--bg-color); touch-action: manipulation; 
          -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; user-select: none;
      }
      .app-container { 
          max-width: 500px; margin: 0 auto; height: 100dvh; background: #ffffff; 
          display: grid; grid-template-rows: auto auto 1fr auto; box-sizing: border-box; overflow: hidden;
      }
      ::-webkit-scrollbar { display: none; }
      .popup-scrollbar::-webkit-scrollbar { width: 4px; display: block; }
      .popup-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
      .popup-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }

      .custom-modal-overlay {
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          background: rgba(15, 23, 42, 0.6);
          backdrop-filter: blur(3px);
          display: none;
          align-items: center;
          justify-content: center;
          z-index: 9999;
      }
      .custom-modal-overlay.active {
          display: flex !important;
      }
      .custom-modal-box {
          background: white;
          border-radius: 20px;
          padding: 20px;
          width: 92%;
          max-width: 440px;
          max-height: 85vh;
          display: flex;
          flex-direction: column;
          box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
          touch-action: pan-y;
      }

      /* สไตล์ตารางแบบ Excel: เส้นตารางติดกัน */
      .excel-table {
          border-collapse: collapse;
          width: 100%;
          background-color: #ffffff;
          table-layout: fixed;
      }
      .excel-table th, .excel-table td {
          border: 1px solid #cbd5e1;
          padding: 4px 6px;
          height: 36px;
          overflow: hidden;
          white-space: nowrap;
          text-overflow: ellipsis;
      }
      .excel-table th {
          background-color: #f8fafc;
          font-weight: 700;
          position: sticky;
          top: 0;
          z-index: 10;
          font-size: 11px;
      }
      .excel-input {
          border: none;
          background: transparent;
          width: 100%;
          text-align: center;
          font-size: 13px;
          font-weight: 700;
          outline: none;
          padding: 2px 0;
          color: #2563eb;
      }
      .excel-input:focus {
          background-color: #ffffff;
          border: 1px solid #3b82f6;
          border-radius: 2px;
      }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center antialiased">

    <div class="app-container shadow-2xl w-full border border-slate-100">
        
        <!-- Header Section -->
        <div class="py-3 px-4 bg-white border-b border-slate-100 text-center shrink-0 shadow-2xs">
            <h1 class="font-black text-lg text-slate-800 tracking-tight flex items-center justify-center gap-1.5">
                🏷️ จัดการราคาพิเศษตามสถานที่
            </h1>
            <p class="text-[11px] text-slate-400 font-medium mt-0.5">เลือกสถานที่ด้านบน แล้วเลือกกลุ่มอาหารเพื่อกำหนดราคาเฉพาะจุดที่ต่างจากปกติ</p>
        </div>

        <!-- Location Selector Section -->
        <div class="p-3 bg-slate-50 border-b border-slate-200 shrink-0">
            <div class="bg-amber-50/50 border border-amber-200/80 rounded-2xl p-3 shadow-sm">
                <button type="button" onclick="openLocationModal()" class="w-full h-[46px] bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-bold px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-sm transition cursor-pointer">
                    <span class="text-sm">📍</span>
                    <span id="locationBtnText" class="truncate">-- กรุณาเลือกสถานที่ / รีสอร์ต --</span>
                </button>
            </div>
        </div>

        <!-- Content Section (Iframe for foodgroup.html) -->
        <div class="p-3 overflow-hidden bg-slate-100 flex flex-col">
            <div class="w-full h-full bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex-1">
                <iframe id="foodGroupFrame" src="foodgroup.html" class="w-full h-full border-0"></iframe>
            </div>
        </div>

        <!-- Footer Navigation Section -->
        <div class="p-3 bg-white border-t border-slate-100 shrink-0 grid grid-cols-2 gap-2">
            <button type="button" onclick="resetToHome()" 
               class="bg-slate-700 hover:bg-slate-800 active:scale-95 text-white font-bold py-3 px-2 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-md transition cursor-pointer">
                🏠 หน้าแรกเพจนี้
            </button>
            <a href="index.html" 
               class="bg-rose-500 hover:bg-rose-600 active:scale-95 text-white font-bold py-3 px-2 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-md no-underline text-center transition">
                🚪 หน้าหลัก (Index)
            </a>
        </div>

    </div>

    <!-- Modal: Location Selection Popup -->
    <div id="locationModal" class="custom-modal-overlay" onclick="handleOutsideClick(event, 'locationModal')">
        <div class="custom-modal-box border-t-4 border-amber-500" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-3 pb-2 border-b">
                <h3 class="font-bold text-base text-slate-800 flex items-center gap-1.5">📍 เลือกสถานที่ / รีสอร์ต</h3>
                <button onclick="closeModal('locationModal')" class="text-gray-400 hover:text-gray-600 font-bold text-lg px-1 cursor-pointer">✕</button>
            </div>
            <div id="locationGrid" class="grid grid-cols-2 gap-2 overflow-y-auto py-1 pr-1 max-h-[60vh]"></div>
        </div>
    </div>

    <!-- Modal: Category Price Editor Popup -->
    <div id="popupModalWrapper" class="custom-modal-overlay" onclick="handleOutsideClick(event, 'popupModalWrapper')">
        <div class="custom-modal-box border-t-4 border-blue-600 max-w-lg p-0 overflow-hidden" onclick="event.stopPropagation()">
            
            <div class="bg-slate-800 text-white px-3 py-2.5 flex items-center justify-between shrink-0">
                <div class="flex items-center gap-2 overflow-hidden">
                    <span class="text-base shrink-0">📍</span>
                    <div class="flex items-center gap-2 truncate">
                        <h3 id="groupNameTitle" class="font-bold text-xs text-amber-300 truncate">กำลังโหลด...</h3>
                        <span id="locationBadge" class="text-[10px] font-medium text-slate-300 shrink-0 bg-slate-700/80 px-2 py-0.5 rounded-md border border-slate-600">สถานที่: -</span>
                    </div>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                    <button onclick="closeModal('popupModalWrapper')" class="text-slate-300 hover:text-white font-bold text-xs px-2 py-1 cursor-pointer">✕ ปิด</button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto relative bg-slate-50 popup-scrollbar max-h-[60vh]">
                <table class="excel-table text-xs">
                    <thead>
                        <tr class="text-slate-700 text-center">
                            <th class="text-left px-2">รายการอาหาร</th>
                            <th class="w-12 text-[10px]">ชาวบ้าน</th>
                            <th class="w-12 text-[10px]">ท่องเที่ยว</th>
                            <th class="w-12 text-[10px]">สบายดี</th>
                            <th class="w-16 text-amber-900 bg-amber-50">ราคาพิเศษ</th>
                        </tr>
                    </thead>
                    <tbody id="foodListContainer">
                        <tr>
                            <td colspan="5" class="text-center py-8 text-slate-400 text-xs">⏳ กำลังโหลดรายการอาหาร...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div id="customAlertModal" class="custom-modal-overlay" onclick="handleOutsideClick(event, 'customAlertModal')">
        <div class="custom-modal-box max-w-xs text-center space-y-3" onclick="event.stopPropagation()">
            <div id="alertIconContainer" class="w-12 h-12 rounded-full flex items-center justify-center mx-auto text-2xl">⚠️</div>
            <div>
                <h3 id="alertTitle" class="font-bold text-sm text-slate-800">แจ้งเตือน</h3>
                <p id="alertMessageText" class="text-xs text-slate-600 mt-1 font-medium leading-relaxed"></p>
            </div>
            <div class="pt-1">
                <button onclick="closeModal('customAlertModal')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs transition cursor-pointer">
                    ตกลง
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Core Logic -->
    <script>
        let db;
        let foodGroups = [];
        let locationsData = [];
        let selectedLocationId = null;
        let selectedLocationName = '';
        let currentGroupName = '';
        let currentCustomPrices = {};
        let rawFoodGroupsData = [];
        let cachedCategories = [];
        let cachedFoods = [];

        function getDbClient() {
            if (db) return db;
            if (typeof window.supabaseClient !== 'undefined') db = window.supabaseClient;
            else if (typeof supabaseClient !== 'undefined') db = supabaseClient;
            return db;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            db = getDbClient();
            if (db) {
                await loadLocations();
                await loadFoodGroups();
            } else {
                console.error("❌ ไม่สามารถเชื่อมต่อฐานข้อมูลได้");
            }
        });

        // รับค่าสั่งการคลิกหมวดหมู่จาก Iframe (foodgroup.html)
        window.addEventListener('message', (event) => {
            const { type, catName } = event.data || {};
            if (type === 'SELECT_CATEGORY') {
                if (!selectedLocationId) {
                    showAlertModal('กรุณาเลือกสถานที่/รีสอร์ต ด้านบนก่อนเลือกหมวดหมู่อหารครับ', 'warning');
                    return;
                }
                openCategoryModal(catName);
            }
        });

        function sendDataToFoodGroupFrame() {
            const frame = document.getElementById('foodGroupFrame');
            if (frame && frame.contentWindow) {
                frame.contentWindow.postMessage({
                    type: 'RENDER_CATEGORIES',
                    categories: cachedCategories,
                    foods: cachedFoods,
                    cart: []
                }, '*');
            }
        }

        function openModal(id) { document.getElementById(id)?.classList.add('active'); }
        function closeModal(id) { document.getElementById(id)?.classList.remove('active'); }
        function handleOutsideClick(e, id) { if (e.target.id === id) closeModal(id); }

        function showAlertModal(message, type = 'warning') {
            const iconContainer = document.getElementById('alertIconContainer');
            const titleEl = document.getElementById('alertTitle');
            const textEl = document.getElementById('alertMessageText');
            textEl.textContent = message;

            if (type === 'error') {
                iconContainer.className = 'w-12 h-12 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto text-2xl';
                iconContainer.textContent = '❌'; titleEl.textContent = 'เกิดข้อผิดพลาด';
            } else if (type === 'success') {
                iconContainer.className = 'w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl';
                iconContainer.textContent = '✅'; titleEl.textContent = 'สำเร็จ';
            } else {
                iconContainer.className = 'w-12 h-12 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto text-2xl';
                iconContainer.textContent = '⚠️'; titleEl.textContent = 'แจ้งเตือน';
            }
            openModal('customAlertModal');
        }

        async function loadLocations() {
            try {
                const { data, error } = await db.from('locations').select('*');
                if (error) throw error;
                locationsData = data || [];
            } catch (err) {
                console.error("Error loading locations:", err);
            }
        }

        function openLocationModal() {
            const grid = document.getElementById('locationGrid');
            if (!grid) return;
            grid.innerHTML = '';

            if (locationsData.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center text-slate-400 text-xs py-4">ไม่พบข้อมูลสถานที่</div>`;
                openModal('locationModal');
                return;
            }

            locationsData.forEach(loc => {
                const locName = loc.location_name || 'ไม่ระบุชื่อ';
                let icon = '🏨';
                if (locName.includes('บาหลี')) icon = '🏝️';
                else if (locName.includes('บ้านเขา')) icon = '🏡';
                else if (locName.includes('ชิลล์')) icon = '☕';
                else if (locName.includes('หน้าร้าน')) icon = '🏪';

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'flex flex-col items-center justify-center p-2.5 bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-xl transition cursor-pointer shadow-sm active:scale-95';
                btn.innerHTML = `
                    <span class="text-xl mb-1">${icon}</span>
                    <span class="text-sm font-bold text-slate-800 text-center leading-tight truncate w-full">${locName}</span>
                `;
                btn.onclick = () => selectLocation(loc);
                grid.appendChild(btn);
            });

            openModal('locationModal');
        }

        function resetToHome() {
            selectedLocationId = null;
            selectedLocationName = '';
            document.getElementById('locationBtnText').innerText = '-- กรุณาเลือกสถานที่ / รีสอร์ต --';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function selectLocation(loc) {
            selectedLocationId = loc.location_id;
            selectedLocationName = loc.location_name;

            document.getElementById('locationBtnText').innerText = selectedLocationName;
            closeModal('locationModal');

            await loadCustomPricesForLocation(selectedLocationId);
        }

        async function loadFoodGroups() {
            try {
                const [catRes, foodRes] = await Promise.all([
                    db.from('food_groups').select('*').order('food_group_id', { ascending: true }),
                    db.from('foods').select('*').order('food_id', { ascending: true })
                ]);

                if (catRes.data) {
                    cachedCategories = catRes.data.filter(cat => cat.food_group_name !== 'importmain')
                        .sort((a, b) => Number(a.food_group_id) - Number(b.food_group_id));
                    rawFoodGroupsData = catRes.data;
                }
                if (foodRes.data) {
                    cachedFoods = foodRes.data;
                }
                sendDataToFoodGroupFrame();
            } catch (err) {
                console.error("Error loading groups:", err);
            }
        }

        async function loadCustomPricesForLocation(locationId) {
            try {
                const { data, error } = await db
                    .from('location_food_prices')
                    .select('food_id, custom_price')
                    .eq('location_id', locationId);

                if (error) throw error;

                currentCustomPrices = {};
                (data || []).reverse().forEach(p => {
                    currentCustomPrices[p.food_id] = p.custom_price;
                });
            } catch (err) {
                console.error("Error loading custom prices:", err);
            }
        }

        async function openCategoryModal(groupName) {
            currentGroupName = groupName;
            document.getElementById('groupNameTitle').textContent = currentGroupName;
            document.getElementById('locationBadge').textContent = `สถานที่: ${selectedLocationName}`;
            
            openModal('popupModalWrapper');
            await loadCategoryFoodsAndPrices(selectedLocationId, groupName);
        }

        async function loadCategoryFoodsAndPrices(locationId, groupName) {
            const container = document.getElementById('foodListContainer');
            container.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-400 text-xs">⏳ กำลังโหลดรายการอาหาร...</td></tr>`;

            try {
                await loadCustomPricesForLocation(locationId);

                let foods = [];
                const matchedGroup = rawFoodGroupsData.find(g => g.food_group_name === groupName);
                if (matchedGroup) {
                    const { data: f1 } = await db.from('foods').select('*').eq('food_group_id', matchedGroup.food_group_id);
                    if (f1 && f1.length > 0) foods = f1;
                }

                if (foods.length === 0) {
                    const { data: allFoods } = await db.from('foods').select('*');
                    if (allFoods) foods = allFoods;
                }

                renderFoodRows(foods);

            } catch (err) {
                console.error("Error loading category foods:", err);
                container.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-rose-500 text-xs">เกิดข้อผิดพลาด: ${err.message}</td></tr>`;
            }
        }

        function renderFoodRows(foods) {
            const container = document.getElementById('foodListContainer');
            container.innerHTML = '';

            if (!foods || foods.length === 0) {
                container.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-400 text-xs">❌ ไม่พบรายการอาหารในหมวดหมู่นี้</td></tr>`;
                return;
            }

            foods.sort((a, b) => (a.food_name || '').localeCompare(b.food_name || '', ['th', 'en']));

            foods.forEach(food => {
                const foodId = food.food_id; 
                const foodName = food.food_name || 'ไม่ระบุชื่อ';
                const customPrice = currentCustomPrices[foodId];
                const displayVal = (customPrice !== undefined && customPrice !== null) ? customPrice : '';

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-100 transition";
                
                tr.innerHTML = `
                    <td class="font-bold text-slate-800 px-2 truncate" style="font-size: 14px;" title="${foodName}">
                        🏨 <span class="truncate">${foodName}</span>
                    </td>
                    <td class="text-center text-slate-500 text-[11px] font-medium p-0">
                        ${food.price_1 || 0}
                    </td>
                    <td class="text-center text-slate-500 text-[11px] font-medium p-0">
                        ${food.price_2 || 0}
                    </td>
                    <td class="text-center text-slate-500 text-[11px] font-medium p-0">
                        ${food.price_3 || 0}
                    </td>
                    <td class="text-center align-middle p-0 bg-amber-50/40">
                        <input type="text" placeholder="ตาม Std" 
                            value="${displayVal}" 
                            onfocus="this.select()" 
                            onblur="saveCustomPrice(${foodId}, this.value)" 
                            class="excel-input"
                            title="กรอกเฉพาะราคาที่สถานที่นี้ไม่เหมือนราคาปกติ">
                    </td>
                `;
                container.appendChild(tr);
            });
        }

        async function saveCustomPrice(foodId, value) {
            if (!selectedLocationId || !foodId) return;

            const valTrim = value.trim();

            try {
                if (valTrim === '') {
                    await db.from('location_food_prices')
                        .delete()
                        .match({ location_id: parseInt(selectedLocationId), food_id: parseInt(foodId) });
                    
                    delete currentCustomPrices[foodId];
                } else {
                    const newPrice = parseFloat(valTrim) || 0;
                    
                    const { error } = await db.from('location_food_prices').upsert({
                        location_id: parseInt(selectedLocationId),
                        food_id: parseInt(foodId),
                        custom_price: newPrice
                    }, { onConflict: 'location_id, food_id' });

                    if (error) throw error;
                    currentCustomPrices[foodId] = newPrice;
                }
            } catch (err) {
                console.error("Save price error:", err);
                showAlertModal('บันทึกราคาไม่สำเร็จ: ' + err.message, 'error');
            }
        }
    </script>
</body>
</html>
