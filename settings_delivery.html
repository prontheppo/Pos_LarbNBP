<!--
  ========================================================================
  FILE NAME: settings_delivery.html
  SUMMARY: แบ่งโครงสร้างออกเป็น 2 บล็อกหลัก และ 5 บล็อกย่อย ดังนี้

   - [บล็อก 1] UI Components & Layout (ส่วนแสดงผลหน้าจอผู้ใช้)
     (ประกอบด้วย 4 หัวข้อ)
       - [บล็อก 1.1] HEADER AND ADMIN NAVIGATION (ส่วนหัว ชื่อหน้า และปุ่มกลับหน้าผู้ดูแลระบบ)
       - [บล็อก 1.2] LOADING STATUS (ข้อความแสดงสถานะระหว่างโหลดข้อมูล)
       - [บล็อก 1.3] LOCATION DELIVERY SETTINGS TABLE (ตารางตั้งค่ายอดขั้นต่ำ, ค่าส่ง และเปอร์เซ็นต์รีสอร์ต)
       - [บล็อก 1.4] CSS STYLES (รูปแบบ CSS รวมถึงไฮไลต์เมื่อเลือกช่อง)

   - [บล็อก 2] Database & Delivery Settings Logic (ระบบการทำงานและการจัดการฐานข้อมูล)
     (ประกอบด้วย 3 หัวข้อ)
       - [บล็อก 2.1] INITIALIZATION AND SUPABASE CLIENT CONNECTION (เริ่มต้นระบบและตรวจสอบการเชื่อมต่อ Supabase)
       - [บล็อก 2.2] FETCH AND RENDER LOCATION DATA (โหลดข้อมูลสถานที่และแสดงผลในตารางพร้อมช่อง Auto-save)
       - [บล็อก 2.3] AUTO-SAVE LOCATION SETTINGS (บันทึกข้อมูลอัตโนมัติเมื่อย้ายช่องหรือเปลี่ยนค่า)
  ========================================================================
-->
<!DOCTYPE html>
<html lang="th">
<head>
    <script src="appInit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ตั้งค่าเรทค่าส่งตามสถานที่ - ลาบหนองบัวลำภู</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ----------------------------------------------------------
         BLOCK 1.4: CSS STYLES
         ---------------------------------------------------------- -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap');
        html, body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            margin: 0; padding: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* Excel-style table with collapsed grid borders */
        .excel-table {
            border-collapse: collapse;
            width: 100%;
            background-color: #ffffff;
            table-layout: fixed;
        }
        .excel-table th, .excel-table td {
            border: 1px solid #cbd5e1;
            padding: 2px 3px;
            height: 32px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .excel-table th {
            background-color: #f8fafc;
            font-weight: 700;
            font-size: 11px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Excel-style input fields with highlight focus */
        .excel-input {
            border: none;
            background: transparent;
            width: 100%;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            outline: none;
            padding: 2px 0;
        }
        /* เมื่อคลิกเลือกช่อง จะทำแถบสีครอบ (Highlight) ทันที */
        .excel-input:focus {
            background-color: #eff6ff;
            border: 2px solid #2563eb;
            border-radius: 2px;
        }
    </style>
    <!-- END BLOCK 1.4 -->
</head>
<body class="p-2 max-w-2xl mx-auto h-full flex flex-col">

    <!-- ==========================================================
         BLOCK 1: UI COMPONENTS & LAYOUT
         ========================================================== -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3 flex flex-col h-full overflow-hidden">

        <!-- ----------------------------------------------------------
             BLOCK 1.1: HEADER AND ADMIN NAVIGATION
             ---------------------------------------------------------- -->
        <div class="flex justify-between items-center mb-2 pb-2 border-b shrink-0">
            <div>
                <h1 class="font-extrabold text-sm text-slate-800 flex items-center gap-1.5">⚙️ ตั้งค่าเรทค่าส่ง & เปอร์เซ็นต์รีสอร์ต</h1>
                <p class="text-[11px] text-slate-500">กำหนดเงื่อนไขค่าจัดส่งและเปอร์เซ็นต์ส่วนแบ่งสำหรับแต่ละสถานที่</p>
            </div>
            <a href="index_admin.html" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold transition">
                ⬅️ กลับหน้าผู้ดูแลระบบ
            </a>
        </div>
        <!-- END BLOCK 1.1 -->

        <!-- ----------------------------------------------------------
             BLOCK 1.2: LOADING STATUS
             ---------------------------------------------------------- -->
        <div id="loadingText" class="text-center text-xs text-slate-400 py-6">⏳ กำลังโหลดข้อมูล...</div>
        <!-- END BLOCK 1.2 -->

        <!-- ----------------------------------------------------------
             BLOCK 1.3: LOCATION DELIVERY SETTINGS TABLE
             ---------------------------------------------------------- -->
        <div class="flex-1 overflow-y-auto relative rounded border border-slate-200">
            <table id="locationTable" class="excel-table text-xs hidden">
                <thead>
                    <tr class="text-slate-700 text-center">
                        <th class="text-left px-2 shadow-xs">สถานที่</th>
                        <th class="w-[62px] shadow-xs">ยอดขั้นต่ำ</th>
                        <th class="w-[50px] shadow-xs">ค่าส่ง</th>
                        <th class="w-[66px] shadow-xs">% รีสอร์ต</th>
                    </tr>
                </thead>
                <tbody id="locationTableBody" class="text-xs">
                    <!-- Location rows are inserted by JavaScript -->
                </tbody>
            </table>
        </div>
        <!-- END BLOCK 1.3 -->

    </div>
    <!-- END BLOCK 1 -->

    <script>
        /* ==========================================================
           BLOCK 2: DATABASE & DELIVERY SETTINGS LOGIC
           ========================================================== */

        /* ----------------------------------------------------------
           BLOCK 2.1: INITIALIZATION AND SUPABASE CLIENT CONNECTION
           ---------------------------------------------------------- */
        window.addEventListener('DOMContentLoaded', async () => {
            await fetchAndRenderLocations();
        });

        function getSupabaseClient() {
            if (typeof window.supabaseClient?.from === 'function') return window.supabaseClient;
            if (typeof supabase?.from === 'function') return supabase;
            return null;
        }
        /* END BLOCK 2.1 */

        /* ----------------------------------------------------------
           BLOCK 2.2: FETCH AND RENDER LOCATION DATA
           ---------------------------------------------------------- */
        async function fetchAndRenderLocations() {
            const _db = getSupabaseClient();
            const loadingText = document.getElementById('loadingText');
            const table = document.getElementById('locationTable');
            const tbody = document.getElementById('locationTableBody');

            if (!_db) {
                loadingText.textContent = '❌ ไม่พบการเชื่อมต่อ Supabase';
                return;
            }

            try {
                const { data, error } = await _db
                    .from('locations')
                    .select('*')
                    .order('location_name', { ascending: true });

                if (error) throw error;

                loadingText.style.display = 'none';
                table.classList.remove('hidden');
                tbody.innerHTML = '';

                data.forEach(loc => {
                    const locId = loc.location_id || loc.id;
                    const locName = loc.location_name || 'ไม่ระบุชื่อ';
                    const minOrder = loc.min_order_for_free_delivery ?? 300;
                    const deliveryFee = loc.delivery_fee ?? 20;
                    const commissionPercent = loc.commission_percent ?? 0;

                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-50 transition';
                    tr.innerHTML = `
                        <td class="font-bold text-slate-800 px-2 truncate" style="font-size: 14px;" title="${locName}">
                            🏨 <span class="truncate">${locName}</span>
                        </td>
                        <td class="text-center align-middle p-0">
                            <input type="number" id="min_${locId}" value="${minOrder}" class="excel-input" onfocus="this.select()" onchange="autoSaveLocationRule(${locId})">
                        </td>
                        <td class="text-center align-middle p-0">
                            <input type="number" id="fee_${locId}" value="${deliveryFee}" class="excel-input" onfocus="this.select()" onchange="autoSaveLocationRule(${locId})">
                        </td>
                        <td class="text-center align-middle p-0">
                            <input type="number" id="pct_${locId}" value="${commissionPercent}" class="excel-input" onfocus="this.select()" onchange="autoSaveLocationRule(${locId})" placeholder="0">
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (err) {
                console.error(err);
                loadingText.textContent = '❌ เกิดข้อผิดพลาดในการโหลดข้อมูล: ' + err.message;
            }
        }
        /* END BLOCK 2.2 */

        /* ----------------------------------------------------------
           BLOCK 2.3: AUTO-SAVE LOCATION SETTINGS
           ---------------------------------------------------------- */
        async function autoSaveLocationRule(locId) {
            const _db = getSupabaseClient();
            if (!_db) return;

            const minOrderInput = document.getElementById(`min_${locId}`);
            const feeInput = document.getElementById(`fee_${locId}`);
            const pctInput = document.getElementById(`pct_${locId}`);

            const minOrder = Number(minOrderInput.value) || 0;
            const deliveryFee = Number(feeInput.value) || 0;
            const commissionPercent = Number(pctInput.value) || 0;

            try {
                const { error } = await _db
                    .from('locations')
                    .update({
                        min_order_for_free_delivery: minOrder,
                        delivery_fee: deliveryFee,
                        commission_percent: commissionPercent
                    })
                    .eq('location_id', locId);

                if (error) {
                    const fallbackRes = await _db
                        .from('locations')
                        .update({
                            min_order_for_free_delivery: minOrder,
                            delivery_fee: deliveryFee,
                            commission_percent: commissionPercent
                        })
                        .eq('id', locId);
                    if (fallbackRes.error) throw fallbackRes.error;
                }

                console.log(`✅ บันทึกข้อมูลสถานที่ ID: ${locId} สำเร็จ`);
            } catch (err) {
                console.error(err);
                alert('❌ บันทึกไม่สำเร็จ: ' + err.message);
            }
        }
        /* END BLOCK 2.3 */

        /* ==========================================================
           END BLOCK 2: DATABASE & DELIVERY SETTINGS LOGIC
           ========================================================== */
    </script>
</body>
</html>
