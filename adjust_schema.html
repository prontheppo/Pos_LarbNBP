
<!--
  ========================================================================
  FILE NAME: adjus_schema.html
  SUMMARY: แบ่งโครงสร้างออกเป็น 5 บล็อกหลัก และ 12 หัวข้อย่อย ดังนี้

   - [บล็อก 1] UI LAYOUT & COMPONENTS
     (ส่วนประกอบหน้าจอ ประกอบด้วย 2 หัวข้อ)
       - [บล็อก 1.1] STICKY HEADER & NAVIGATION (ส่วนหัวและเมนูนำทาง)
       - [บล็อก 1.2] TABLES DISPLAY CONTAINER (พื้นที่แสดงข้อมูลตาราง)

   - [บล็อก 2] GLOBAL VARIABLES & CONFIGS
     (ตัวแปรและการตั้งค่าระบบ ประกอบด้วย 3 หัวข้อ)
       - [บล็อก 2.1] GLOBAL DATA CACHE VARIABLES (ตัวแปรเก็บข้อมูลส่วนกลาง)
       - [บล็อก 2.2] PRIMARY KEY MAPPING CONFIGURATION (การกำหนด Primary Key)
       - [บล็อก 2.3] PRIMARY KEY RESOLVER FUNCTION (ฟังก์ชันค้นหา Primary Key)

   - [บล็อก 3] DATABASE FETCH OPERATIONS
     (ระบบดึงข้อมูลจากฐานข้อมูล ประกอบด้วย 2 หัวข้อ)
       - [บล็อก 3.1] FETCH TABLE COMMENTS (ดึง Comment ของตาราง)
       - [บล็อก 3.2] FETCH ALL TABLE DATA (ดึงข้อมูลจากทุกตาราง)

   - [บล็อก 4] UI RENDERING FUNCTIONS
     (ฟังก์ชันแสดงผลหน้าจอ ประกอบด้วย 1 หัวข้อ)
       - [บล็อก 4.1] RENDER TABLE CARDS (สร้างการ์ดแสดงข้อมูลตาราง)

   - [บล็อก 5] SQL EXPORTER FUNCTIONS
     (ระบบสร้างและส่งออก SQL ประกอบด้วย 4 หัวข้อ)
       - [บล็อก 5.1] SQL DATA TYPE CONVERSION (แปลงชนิดข้อมูล SQL)
       - [บล็อก 5.2] BUILD TABLE SQL STATEMENTS (สร้างคำสั่ง SQL ของตาราง)
       - [บล็อก 5.3] EXPORT SINGLE TABLE SQL (ส่งออก SQL รายตาราง)
       - [บล็อก 5.4] EXPORT COMPLETE SCHEMA SQL (ส่งออกโครงสร้าง Schema ทั้งหมด)
  ========================================================================
-->
<!DOCTYPE html>
<html lang="th">
<head>
  <!-- Initialize Application -->
  <script src="appInit.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>Supabase - Data Explorer & SQL Exporter</title>

  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Load Supabase SDK Before Client Initialization -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Initialize Supabase Client -->
  <script src="supabaseClient.js"></script>

  <style>
    html, body {
      background-color: #000000;
      color: #ffffff;
      touch-action: manipulation;
      overflow-x: hidden;
      overflow-y: auto !important;
      height: auto;
      margin: 0;
      padding: 0;
    }

    /* Customize Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    ::-webkit-scrollbar-track {
      background: #18181b;
    }

    ::-webkit-scrollbar-thumb {
      background: #3f3f46;
      border-radius: 9999px;
    }
  </style>
</head>

<body class="min-h-screen pt-28 pb-16 px-3 relative">

  <!-- ==========================================================
       BLOCK 1: UI LAYOUT & COMPONENTS
       ========================================================== -->

  <!-- ----------------------------------------------------------
       BLOCK 1.1: STICKY HEADER & NAVIGATION
       ---------------------------------------------------------- -->
  <div class="fixed top-0 left-0 right-0 bg-zinc-950/95 backdrop-blur-md border-b border-zinc-800 p-3 z-40 shadow-xl">
    <div class="max-w-7xl mx-auto space-y-2">
      <div class="grid grid-cols-3 gap-2">

        <a href="index.html" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-2.5 px-1.5 rounded-xl text-xs transition active:scale-95 shadow flex flex-col items-center justify-center text-center leading-tight no-underline">
          <span>🔑</span>
          <span>หน้าหลัก</span>
        </a>

        <button onclick="fetchAllTablesData()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-1.5 rounded-xl text-xs transition active:scale-95 shadow flex flex-col items-center justify-center text-center leading-tight cursor-pointer">
          <span>🚀</span>
          <span>ดึงตาราง</span>
        </button>

        <button onclick="exportSchemaOnly()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 px-1.5 rounded-xl text-xs transition active:scale-95 shadow flex flex-col items-center justify-center text-center leading-tight cursor-pointer">
          <span>⚡</span>
          <span>คัดลอก schema.sql</span>
        </button>

      </div>

      <!-- Header Status Display -->
      <div id="statusText" class="text-[11px] font-semibold text-center text-zinc-400 truncate">
        พร้อมใช้งานระบบ (ดึงข้อมูล Comment จาก Supabase ของจริง)
      </div>
    </div>
  </div>
  <!-- END BLOCK 1.1 -->


  <!-- ----------------------------------------------------------
       BLOCK 1.2: TABLES DISPLAY CONTAINER
       ---------------------------------------------------------- -->
  <div class="max-w-7xl mx-auto space-y-6">
    <div id="tablesContainer" class="space-y-6"></div>
  </div>
  <!-- END BLOCK 1.2 -->

  <!-- END BLOCK 1 -->


  <script>

    /* ==========================================================
       BLOCK 2: GLOBAL VARIABLES & CONFIGS
       ========================================================== */

    /* ----------------------------------------------------------
       BLOCK 2.1: GLOBAL DATA CACHE VARIABLES
       ---------------------------------------------------------- */

    // Stores cached data for all database tables
    let tablesDataCache = {};

    // Stores actual database comments for each table
    let tableCommentsMap = {};

    /* END BLOCK 2.1 */


    /* ----------------------------------------------------------
       BLOCK 2.2: PRIMARY KEY MAPPING CONFIGURATION
       ---------------------------------------------------------- */

    // Defines the primary key column for known database tables
    const primaryKeyMap = {
      'customer_types': 'customer_type_id',
      'customers': 'customer_id',
      'food_groups': 'food_group_id',
      'foods': 'food_id',
      'locations': 'location_id',
      'orders': 'order_id',
      'zones': 'zone_id'
    };

    /* END BLOCK 2.2 */


    /* ----------------------------------------------------------
       BLOCK 2.3: PRIMARY KEY RESOLVER FUNCTION
       ---------------------------------------------------------- */

    // Resolves the primary key column for a specified table
    function getPrimaryKey(tableName, sampleRow) {
      if (primaryKeyMap[tableName]) {
        return primaryKeyMap[tableName];
      }

      if (sampleRow) {
        const keys = Object.keys(sampleRow);

        const found = keys.find(
          k => k.endsWith('_id') || k === 'id'
        );

        if (found) {
          return found;
        }

        return keys[0];
      }

      return 'id';
    }

    /* END BLOCK 2.3 */

    /* END BLOCK 2 */


    /* ==========================================================
       BLOCK 3: DATABASE FETCH OPERATIONS
       ========================================================== */

    /* ----------------------------------------------------------
       BLOCK 3.1: FETCH TABLE COMMENTS
       ---------------------------------------------------------- */

    // Retrieves table names and their comments from Supabase
    async function fetchTablesWithComments() {
      try {
        const {
          data,
          error
        } = await supabaseClient.rpc('get_tables_with_comments');

        if (error || !data) {
          console.error("RPC Error:", error);
          return [];
        }

        tableCommentsMap = {};

        data.forEach(item => {
          if (item.table_comment) {
            tableCommentsMap[item.table_name] =
              item.table_comment;
          }
        });

        return data.map(item => item.table_name);

      } catch (err) {
        console.error("Fetch Exception:", err);
        return [];
      }
    }

    /* END BLOCK 3.1 */


    /* ----------------------------------------------------------
       BLOCK 3.2: FETCH ALL TABLE DATA
       ---------------------------------------------------------- */

    // Fetches records from all available database tables
    async function fetchAllTablesData() {
      const status = document.getElementById('statusText');
      const container = document.getElementById('tablesContainer');

      status.innerHTML =
        "⏳ กำลังดึงตารางและ Comment ของจริงจาก Supabase...";

      const tableList = await fetchTablesWithComments();

      if (tableList.length === 0) {
        status.innerHTML =
          `<span class="text-rose-400">❌ ไม่พบตาราง หรือฟังก์ชัน get_tables_with_comments มีปัญหาการเข้าถึง</span>`;
        return;
      }

      status.innerHTML =
        `⏳ กำลังดึงข้อมูลจาก ${tableList.length} ตาราง...`;

      container.innerHTML = "";
      tablesDataCache = {};

      let totalCount = 0;

      for (const tableName of tableList) {
        try {
          let query = supabaseClient
            .from(tableName)
            .select('*');

          // Restricts order records to the latest 90 days and 500 rows
          if (tableName === 'orders') {
            const date90DaysAgo = new Date();

            date90DaysAgo.setDate(
              date90DaysAgo.getDate() - 90
            );

            query = query
              .gte('created_at', date90DaysAgo.toISOString())
              .order('created_at', {
                ascending: false
              })
              .limit(500);
          }

          const {
            data,
            error
          } = await query;

          if (error) {
            renderTableCard(
              tableName,
              null,
              error.message
            );

          } else {
            tablesDataCache[tableName] = data || [];

            renderTableCard(
              tableName,
              data,
              null
            );

            totalCount += data ? data.length : 0;
          }

        } catch (err) {
          renderTableCard(
            tableName,
            null,
            err.message
          );
        }
      }

      status.innerHTML =
        `<span class="text-emerald-400">✅ ดึงข้อมูลสำเร็จทั้งหมด ${tableList.length} ตาราง (รวม ${totalCount} รายการ)</span>`;
    }

    /* END BLOCK 3.2 */

    /* END BLOCK 3 */


    /* ==========================================================
       BLOCK 4: UI RENDERING FUNCTIONS
       ========================================================== */

    /* ----------------------------------------------------------
       BLOCK 4.1: RENDER TABLE CARDS
       ---------------------------------------------------------- */

    // Creates and displays a card containing the specified table data
    function renderTableCard(tableName, rows, errorMsg) {
      const container = document.getElementById('tablesContainer');

      const section = document.createElement('div');

      // Sets the table card layout
      section.className =
        `bg-zinc-900 border ${errorMsg ? 'border-rose-900/50' : 'border-zinc-800'} rounded-2xl p-4 sm:p-5 shadow-lg space-y-3`;

      // Appends actual database comments when available
      const dbComment = tableCommentsMap[tableName]
        ? ` (${tableCommentsMap[tableName]})`
        : '';

      let noteBadge = '';

      if (tableName === 'orders') {
        noteBadge =
          `<span class="bg-amber-500/20 text-amber-300 text-[10px] px-2 py-0.5 rounded-md border border-amber-500/30">⚡ ย้อนหลัง 90 วัน / สูงสุด 500 แถว</span>`;
      }

      let html = `
        <div class="flex flex-col gap-2.5 border-b ${errorMsg ? 'border-rose-900/40' : 'border-zinc-800'} pb-3">
            <div class="flex items-center justify-between gap-2 flex-wrap">
                <h2 class="text-base font-bold ${errorMsg ? 'text-rose-400' : 'text-amber-400'}">📌 ตาราง: <span class="text-white">${tableName}</span><span class="text-zinc-400 text-xs font-normal">${dbComment}</span></h2>

                <div class="flex items-center gap-2">
                    ${!errorMsg ? `<span class="bg-zinc-800 text-zinc-300 text-xs px-2.5 py-1 rounded-full border border-zinc-700">${rows ? rows.length : 0} รายการ</span>` : ''}
                    ${noteBadge}
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2 w-full pt-1">
                <button onclick="exportSingleTableSQL('${tableName}', false)" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2 px-3 rounded-lg transition active:scale-95 shadow text-center truncate cursor-pointer">
                    📋 Copy SQL
                </button>

                <button onclick="exportSingleTableSQL('${tableName}', true)" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 px-3 rounded-lg transition active:scale-95 shadow text-center truncate cursor-pointer">
                    📦 SQL + Data
                </button>
            </div>
        </div>
      `;

      if (errorMsg) {
        html +=
          `<p class="text-xs text-rose-300 bg-black/50 p-2.5 rounded-lg border border-rose-900/30">❌ เกิดข้อผิดพลาด: ${errorMsg}</p>`;

      } else if (!rows || rows.length === 0) {
        html +=
          `<p class="text-xs text-zinc-500 py-2 italic">-- ไม่มีข้อมูลในตารางนี้ --</p>`;

      } else {
        const headers = Object.keys(rows[0]);

        html += `
          <div class="overflow-x-auto overflow-y-auto max-h-[130px] rounded-lg border border-zinc-800 bg-black/40">
              <table class="w-full text-left text-xs border-collapse">
                  <thead class="bg-zinc-950 text-emerald-400 sticky top-0 z-20 shadow-sm">
                      <tr>
                        ${headers.map(h => `<th class="p-2 border-b border-zinc-800 font-semibold uppercase tracking-wider whitespace-nowrap">${h}</th>`).join('')}
                      </tr>
                  </thead>

                  <tbody class="divide-y divide-zinc-800/80 text-zinc-300">
                    ${rows.map(row => `
                      <tr class="hover:bg-zinc-800/50 transition-colors">
                        ${headers.map(h => {
                          let val = row[h];

                          if (
                            typeof val === 'object' &&
                            val !== null
                          ) {
                            val = JSON.stringify(val);
                          }

                          return `<td class="p-2 whitespace-nowrap font-mono text-[11px]">${val !== null && val !== undefined ? val : '<span class="text-zinc-600">NULL</span>'}</td>`;
                        }).join('')}
                      </tr>
                    `).join('')}
                  </tbody>
              </table>
          </div>
        `;
      }

      section.innerHTML = html;

      container.appendChild(section);
    }

    /* END BLOCK 4.1 */

    /* END BLOCK 4 */


    /* ==========================================================
       BLOCK 5: SQL EXPORTER FUNCTIONS
       ========================================================== */

    /* ----------------------------------------------------------
       BLOCK 5.1: SQL DATA TYPE CONVERSION
       ---------------------------------------------------------- */

    // Determines the SQL data type based on the column value
    function getSqlType(col, val, pkName) {
      if (col === pkName) {
        return "BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY";
      }

      if (typeof val === "number") {
        return Number.isInteger(val)
          ? "BIGINT"
          : "NUMERIC";
      }

      if (typeof val === "boolean") {
        return "BOOLEAN";
      }

      if (typeof val === "object" && val !== null) {
        return "JSONB";
      }

      if (
        col.includes("_at") ||
        col.includes("date")
      ) {
        return "TIMESTAMPTZ";
      }

      return "TEXT";
    }

    /* END BLOCK 5.1 */


    /* ----------------------------------------------------------
       BLOCK 5.2: BUILD TABLE SQL STATEMENTS
       ---------------------------------------------------------- */

    // Builds CREATE TABLE and optional INSERT SQL statements
    function buildTableSQL(
      tableName,
      rows,
      includeData = true
    ) {
      const sampleRow =
        (rows && rows.length > 0)
          ? rows[0]
          : null;

      const pkName = getPrimaryKey(
        tableName,
        sampleRow
      );

      let sql = [
        `-- TABLE: public.${tableName}`,
        `CREATE TABLE IF NOT EXISTS public.${tableName} (`
      ];

      let colDefs = [];

      if (sampleRow) {
        Object.keys(sampleRow).forEach(col => {
          colDefs.push(
            `    ${col} ${getSqlType(col, sampleRow[col], pkName)}`
          );
        });

      } else {
        colDefs.push(
          `    ${pkName} BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY`
        );
      }

      sql.push(
        colDefs.join(",\n"),
        `);\n`
      );

      if (
        includeData &&
        rows &&
        rows.length > 0
      ) {
        sql.push(
          `-- DATA INSERTS: public.${tableName}`
        );

        const columns = Object.keys(rows[0]);

        rows.forEach(row => {
          const values = columns.map(h => {
            const val = row[h];

            if (
              val === null ||
              val === undefined
            ) {
              return "NULL";
            }

            if (
              typeof val === 'number' ||
              typeof val === 'boolean'
            ) {
              return val;
            }

            if (typeof val === 'object') {
              return `'${JSON.stringify(val).replace(/'/g, "''")}'::jsonb`;
            }

            return `'${String(val).replace(/'/g, "''")}'`;
          });

          sql.push(
            `INSERT INTO public.${tableName} (${columns.join(', ')}) VALUES (${values.join(', ')});`
          );
        });

        sql.push("\n");
      }

      return sql.join("\n");
    }

    /* END BLOCK 5.2 */


    /* ----------------------------------------------------------
       BLOCK 5.3: EXPORT SINGLE TABLE SQL
       ---------------------------------------------------------- */

    // Exports either the selected table structure or its structure and data
    async function exportSingleTableSQL(
      tableName,
      includeData = true
    ) {
      const status = document.getElementById('statusText');

      const exportType = includeData
        ? "SQL + Data"
        : "SQL เฉพาะโครงสร้าง";

      status.innerHTML =
        `⏳ กำลังเตรียม ${exportType} ของตาราง ${tableName}...`;

      try {
        let rows = [];

        if (includeData) {
          if (
            Object.prototype.hasOwnProperty.call(
              tablesDataCache,
              tableName
            )
          ) {
            rows = tablesDataCache[tableName] || [];

          } else {
            let query = supabaseClient
              .from(tableName)
              .select('*');

            if (tableName === 'orders') {
              const date90DaysAgo = new Date();

              date90DaysAgo.setDate(
                date90DaysAgo.getDate() - 90
              );

              query = query
                .gte('created_at', date90DaysAgo.toISOString())
                .order('created_at', {
                  ascending: false
                })
                .limit(500);
            }

            const {
              data,
              error
            } = await query;

            if (error) {
              throw error;
            }

            rows = data || [];

            tablesDataCache[tableName] = rows;
          }

        } else {
          if (
            Object.prototype.hasOwnProperty.call(
              tablesDataCache,
              tableName
            ) &&
            tablesDataCache[tableName] &&
            tablesDataCache[tableName].length > 0
          ) {
            rows = [
              tablesDataCache[tableName][0]
            ];

          } else {
            const {
              data,
              error
            } = await supabaseClient
              .from(tableName)
              .select('*')
              .limit(1);

            if (error) {
              throw error;
            }

            rows = data || [];
          }
        }

        const header =
          `-- ========================================================\n` +
          `-- ${includeData ? 'TABLE SCHEMA & DATA' : 'TABLE STRUCTURE ONLY'}: public.${tableName}\n` +
          `-- Date: ${new Date().toLocaleString()}\n` +
          `-- ========================================================\n\n`;

        const finalSQL =
          header +
          buildTableSQL(
            tableName,
            rows,
            includeData
          );

        await navigator.clipboard.writeText(finalSQL);

        if (includeData) {
          status.innerHTML =
            `<span class="text-emerald-300">📦 คัดลอก SQL พร้อมข้อมูลของตาราง ${tableName} แล้ว (${rows.length} รายการ)</span>`;

        } else {
          status.innerHTML =
            `<span class="text-blue-300">📋 คัดลอกเฉพาะโครงสร้าง SQL ของตาราง ${tableName} แล้ว</span>`;
        }

      } catch (err) {
        status.innerHTML =
          `<span class="text-rose-400">❌ เกิดข้อผิดพลาดในการคัดลอก SQL ของตาราง ${tableName}</span>`;

        console.error(
          `Export table SQL error (${tableName}):`,
          err
        );
      }
    }

    /* END BLOCK 5.3 */


    /* ----------------------------------------------------------
       BLOCK 5.4: EXPORT COMPLETE SCHEMA SQL
       ---------------------------------------------------------- */

    // Exports all table structures directly without rendering table cards
    async function exportSchemaOnly() {
      const status = document.getElementById('statusText');

      status.innerHTML =
        "⏳ กำลังดึงโครงสร้าง Schema จาก Supabase...";

      try {
        // Retrieves table names directly from Supabase
        const tableList = await fetchTablesWithComments();

        if (
          !tableList ||
          tableList.length === 0
        ) {
          status.innerHTML =
            `<span class="text-rose-400">❌ ไม่พบตาราง หรือไม่สามารถดึงรายชื่อตารางได้</span>`;
          return;
        }

        // Generates the Thailand local date and time
        const now = new Date();

        const dateText = now.toLocaleString('en-GB', {
          timeZone: 'Asia/Bangkok',
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        });

        // Prepares the SQL file header
        let sqlStatements = [
          "-- ========================================================",
          "-- FILE: schema.sql (Structure Only)",
          `-- Date: ${dateText}`,
          "-- ========================================================\n"
        ];

        let successCount = 0;
        let errorTables = [];

        // Fetches one sample row from each table directly
        // Does not render table cards or modify the table display
        for (const tableName of tableList) {
          try {
            const {
              data,
              error
            } = await supabaseClient
              .from(tableName)
              .select('*')
              .limit(1);

            if (error) {
              throw error;
            }

            // Uses sample data only to identify column names and types
            const sampleData = data || [];

            // Generates CREATE TABLE statements only
            const tableSQL = buildTableSQL(
              tableName,
              sampleData,
              false
            );

            sqlStatements.push(tableSQL);

            successCount++;

          } catch (err) {
            console.error(
              `Schema export error (${tableName}):`,
              err
            );

            errorTables.push(tableName);
          }
        }

        // Checks whether any table was successfully exported
        if (successCount === 0) {
          status.innerHTML =
            `<span class="text-rose-400">❌ ไม่สามารถสร้าง Schema ได้</span>`;
          return;
        }

        // Combines all table structures into one SQL document
        const schemaSQL = sqlStatements.join("\n");

        // Copies the complete schema to Clipboard
        await navigator.clipboard.writeText(schemaSQL);

        if (errorTables.length === 0) {
          status.innerHTML =
            `<span class="text-emerald-300">✅ คัดลอก schema.sql สำเร็จ (${successCount} ตาราง) โดยไม่ต้องดึงตารางมาแสดงก่อน</span>`;

        } else {
          status.innerHTML =
            `<span class="text-amber-300">⚠️ คัดลอก Schema สำเร็จ ${successCount} จาก ${tableList.length} ตาราง แต่มี ${errorTables.length} ตารางที่ไม่สามารถดึงได้</span>`;

          console.warn(
            "Tables not exported:",
            errorTables
          );
        }

      } catch (err) {
        console.error(
          "Schema export error:",
          err
        );

        status.innerHTML =
          `<span class="text-rose-400">❌ เกิดข้อผิดพลาดในการส่งออก schema.sql หรือคัดลอก Clipboard ไม่สำเร็จ</span>`;
      }
    }

    /* END BLOCK 5.4 */

    /* END BLOCK 5 */

  </script>
</body>
