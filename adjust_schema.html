<!DOCTYPE html>
<html lang="th">
<head>
  <!-- [Start Block 1.1] HEAD CONFIGURATION -->
  <!-- Initialize Application -->
  <script src="appInit.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>Supabase - Data Explorer & SQL Exporter</title>

  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Load Supabase SDK Before Client Initialization -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Initialize Supabase Client -->
  <script src="supabaseClient.js"></script>
  <!-- [End Block 1.1] HEAD CONFIGURATION -->

  <!-- [Start Block 1.2] GLOBAL STYLES -->
  <style>
    html, body {
      font-family: 'Sarabun', sans-serif;
      background-color: #000000;
      color: #ffffff;
      touch-action: manipulation;
      overflow-x: hidden;
      overflow-y: auto !important;
      height: auto;
      margin: 0;
      padding: 0;
    }

    input, select, textarea, button {
      font-size: 16px;
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    ::-webkit-scrollbar-track {
      background: #18181b;
    }

    ::-webkit-scrollbar-thumb {
      background: #3f3f46;
      border-radius: 9999px;
    }
  </style>
  <!-- [End Block 1.2] GLOBAL STYLES -->
</head>

<body class="min-h-screen pt-28 pb-16 px-3 relative">

  <!-- ==========================================================
       [Start Block 2] USER INTERFACE & LAYOUT COMPONENTS
       ส่วนติดต่อผู้ใช้และองค์ประกอบหน้าจอ
       ========================================================== -->

  <!-- [Start Block 2.1] STICKY HEADER & NAVIGATION -->
  <!-- ส่วนหัวของหน้าเว็บและปุ่มควบคุมหลัก -->
  <div class="fixed top-0 left-0 right-0 bg-zinc-950/95 backdrop-blur-md border-b border-zinc-800 p-3 z-40 shadow-xl">
    <div class="max-w-7xl mx-auto space-y-2">

      <div class="grid grid-cols-4 gap-2">
        <a href="menu.html" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-2.5 px-1.5 rounded-xl text-xs transition active:scale-95 shadow flex flex-col items-center justify-center text-center leading-tight no-underline">
          <span>🔑</span>
          <span>หน้าหลัก</span>
        </a>

        <button onclick="fetchAllTablesData()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-1.5 rounded-xl text-xs transition active:scale-95 shadow flex flex-col items-center justify-center text-center leading-tight cursor-pointer">
          <span>🚀</span>
          <span>ดึงตาราง</span>
        </button>

        <button onclick="exportSchemaOnly()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 px-1.5 rounded-xl text-xs transition active:scale-95 shadow flex flex-col items-center justify-center text-center leading-tight cursor-pointer">
          <span>⚡</span>
          <span>คัดลอก schema.sql</span>
        </button>

        <button onclick="truncateOrdersTable()" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-2.5 px-1.5 rounded-xl text-xs transition active:scale-95 shadow flex flex-col items-center justify-center text-center leading-tight cursor-pointer">
          <span>🗑️</span>
          <span>ล้าง Orders & Expenses</span>
        </button>
      </div>

      <div id="statusText" class="text-[11px] font-semibold text-center text-zinc-400 truncate">
        ⏳ พร้อมใช้งานระบบ (ดึงข้อมูล Comment จาก Supabase ของจริง)
      </div>
    </div>
  </div>
  <!-- [End Block 2.1] STICKY HEADER & NAVIGATION -->

  <!-- [Start Block 2.2] TABLES DISPLAY CONTAINER -->
  <!-- ส่วนแสดงผลรายการตารางข้อมูลจากฐานข้อมูล -->
  <div class="max-w-7xl mx-auto space-y-6">
    <div id="tablesContainer" class="space-y-6"></div>
  </div>
  <!-- [End Block 2.2] TABLES DISPLAY CONTAINER -->

  <!-- [End Block 2] USER INTERFACE & LAYOUT COMPONENTS -->

  <!-- ==========================================================
       [Start Block 3] JAVASCRIPT CORE LOGIC & FUNCTIONS
       การทำงานส่วนตรรกะและฟังก์ชันของระบบ
       ========================================================== -->
  <script>
    /* --- [Start Block 3.1] GLOBAL VARIABLES & CONFIGURATIONS --- */
    /* การประกาศตัวแปรส่วนกลางและการตั้งค่าพื้นฐาน */
    let tablesDataCache = {};
    let tableCommentsMap = {};

    const primaryKeyMap = {
      'customer_types': 'customer_type_id',
      'customers': 'customer_id',
      'food_groups': 'food_group_id',
      'foods': 'food_id',
      'locations': 'location_id',
      'orders': 'order_id',
      'expenses': 'expense_id',
      'zones': 'zone_id'
    };

    function getPrimaryKey(tableName, sampleRow) {
      if (primaryKeyMap[tableName]) {
        return primaryKeyMap[tableName];
      }

      if (sampleRow) {
        const keys = Object.keys(sampleRow);
        const found = keys.find(k => k.endsWith('_id') || k === 'id');
        if (found) return found;
        return keys[0];
      }

      return 'id';
    }
    /* --- [End Block 3.1] GLOBAL VARIABLES & CONFIGURATIONS --- */

    /* --- [Start Block 3.2] DATABASE FETCH OPERATIONS --- */
    /* ฟังก์ชันสำหรับการดึงข้อมูลและเชื่อมต่อกับฐานข้อมูล Supabase */
    async function fetchTablesWithComments() {
      try {
        const { data, error } = await supabaseClient.rpc('get_tables_with_comments');

        if (error || !data) {
          console.error("RPC Error:", error);
          return [];
        }

        tableCommentsMap = {};
        data.forEach(item => {
          if (item.table_comment) {
            tableCommentsMap[item.table_name] = item.table_comment;
          }
        });

        return data.map(item => item.table_name);
      } catch (err) {
        console.error("Fetch Exception:", err);
        return [];
      }
    }

    async function fetchAllTablesData() {
      const status = document.getElementById('statusText');
      const container = document.getElementById('tablesContainer');

      status.innerHTML = "⏳ กำลังดึงตารางและ Comment ของจริงจาก Supabase...";

      const tableList = await fetchTablesWithComments();

      if (tableList.length === 0) {
        status.innerHTML = `<span class="text-rose-400">❌ ไม่พบตาราง หรือฟังก์ชัน get_tables_with_comments มีปัญหาการเข้าถึง</span>`;
        return;
      }

      status.innerHTML = `⏳ กำลังดึงข้อมูลจาก ${tableList.length} ตาราง...`;

      container.innerHTML = "";
      tablesDataCache = {};
      let totalCount = 0;

      for (const tableName of tableList) {
        try {
          let query = supabaseClient.from(tableName).select('*');

          if (tableName === 'orders') {
            const date90DaysAgo = new Date();
            date90DaysAgo.setDate(date90DaysAgo.getDate() - 90);

            query = query
              .gte('created_at', date90DaysAgo.toISOString())
              .order('created_at', { ascending: false })
              .limit(500);
          }

          const { data, error } = await query;

          if (error) {
            renderTableCard(tableName, null, error.message);
          } else {
            tablesDataCache[tableName] = data || [];
            renderTableCard(tableName, data, null);
            totalCount += data ? data.length : 0;
          }
        } catch (err) {
          renderTableCard(tableName, null, err.message);
        }
      }

      status.innerHTML = `<span class="text-emerald-400">✅ ดึงข้อมูลสำเร็จทั้งหมด ${tableList.length} ตาราง (รวม ${totalCount} รายการ)</span>`;
    }
    /* --- [End Block 3.2] DATABASE FETCH OPERATIONS --- */

    /* --- [Start Block 3.3] UI RENDERING FUNCTIONS --- */
    /* ฟังก์ชันสำหรับการสร้างและเรนเดอร์การแสดงผลการ์ดตารางข้อมูล */
    function renderTableCard(tableName, rows, errorMsg) {
      const container = document.getElementById('tablesContainer');
      const section = document.createElement('div');

      section.className = `bg-zinc-900 border ${errorMsg ? 'border-rose-900/50' : 'border-zinc-800'} rounded-2xl p-4 sm:p-5 shadow-lg space-y-3`;

      const dbComment = tableCommentsMap[tableName] ? ` (${tableCommentsMap[tableName]})` : '';
      let noteBadge = '';

      if (tableName === 'orders') {
        noteBadge = `<span class="bg-amber-500/20 text-amber-300 text-[10px] px-2 py-0.5 rounded-md border border-amber-500/30">⚡ ย้อนหลัง 90 วัน / สูงสุด 500 แถว</span>`;
      }

      let html = `
        <div class="flex flex-col gap-2.5 border-b ${errorMsg ? 'border-rose-900/40' : 'border-zinc-800'} pb-3">
            <div class="flex items-center justify-between gap-2 flex-wrap">
                <h2 class="text-base font-bold ${errorMsg ? 'text-rose-400' : 'text-amber-400'}">📌 ตาราง: <span class="text-white">${tableName}</span><span class="text-zinc-400 text-xs font-normal">${dbComment}</span></h2>

                <div class="flex items-center gap-2">
                    ${!errorMsg ? `<span class="bg-zinc-800 text-zinc-300 text-xs px-2.5 py-1 rounded-full border border-zinc-700">${rows ? rows.length : 0} รายการ</span>` : ''}
                    ${noteBadge}
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2 w-full pt-1">
                <button onclick="exportSingleTableSQL('${tableName}', false)" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2 px-3 rounded-lg transition active:scale-95 shadow text-center truncate cursor-pointer">
                    📋 Copy SQL
                </button>

                <button onclick="exportSingleTableSQL('${tableName}', true)" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 px-3 rounded-lg transition active:scale-95 shadow text-center truncate cursor-pointer">
                    📦 SQL + Data
                </button>
            </div>
        </div>
      `;

      if (errorMsg) {
        html += `<p class="text-xs text-rose-300 bg-black/50 p-2.5 rounded-lg border border-rose-900/30">❌ เกิดข้อผิดพลาด: ${errorMsg}</p>`;
      } else if (!rows || rows.length === 0) {
        html += `<p class="text-xs text-zinc-500 py-2 italic">⏳ ไม่มีรายการอาหาร</p>`;
      } else {
        const headers = Object.keys(rows[0]);

        html += `
          <div class="overflow-x-auto overflow-y-auto max-h-[130px] rounded-lg border border-zinc-800 bg-black/40">
              <table class="w-full text-left text-xs border-collapse">
                  <thead class="bg-zinc-950 text-emerald-400 sticky top-0 z-20 shadow-sm">
                      <tr>
                        ${headers.map(h => `<th class="p-2 border-b border-zinc-800 font-semibold uppercase tracking-wider whitespace-nowrap">${h}</th>`).join('')}
                      </tr>
                  </thead>

                  <tbody class="divide-y divide-zinc-800/80 text-zinc-300">
                    ${rows.map(row => `
                      <tr class="hover:bg-zinc-800/50 transition-colors">
                        ${headers.map(h => {
                          let val = row[h];
                          if (typeof val === 'object' && val !== null) {
                            val = JSON.stringify(val);
                          }
                          return `<td class="p-2 whitespace-nowrap font-mono text-[11px]">${val !== null && val !== undefined ? val : '<span class="text-zinc-600">NULL</span>'}</td>`;
                        }).join('')}
                      </tr>
                    `).join('')}
                  </tbody>
              </table>
          </div>
        `;
      }

      section.innerHTML = html;
      container.appendChild(section);
    }
    /* --- [End Block 3.3] UI RENDERING FUNCTIONS --- */

    /* --- [Start Block 3.4] SQL EXPORTER FUNCTIONS --- */
    /* ฟังก์ชันสำหรับการแปลงข้อมูลเป็น SQL Statement และส่งออกไฟล์ schema.sql */
    function getSqlType(col, val, pkName) {
      if (col === pkName) {
        return "BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY";
      }
      if (typeof val === "number") {
        return Number.isInteger(val) ? "BIGINT" : "NUMERIC";
      }
      if (typeof val === "boolean") {
        return "BOOLEAN";
      }
      if (typeof val === "object" && val !== null) {
        return "JSONB";
      }
      if (col.includes("_at") || col.includes("date")) {
        return "TIMESTAMPTZ";
      }
      return "TEXT";
    }

    function buildTableSQL(tableName, rows, includeData = true) {
      const sampleRow = (rows && rows.length > 0) ? rows[0] : null;
      const pkName = getPrimaryKey(tableName, sampleRow);

      let sql = [
        `-- TABLE: public.${tableName}`,
        `CREATE TABLE IF NOT EXISTS public.${tableName} (`
      ];

      let colDefs = [];
      if (sampleRow) {
        Object.keys(sampleRow).forEach(col => {
          colDefs.push(`    ${col} ${getSqlType(col, sampleRow[col], pkName)}`);
        });
      } else {
        colDefs.push(`    ${pkName} BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY`);
      }

      sql.push(colDefs.join(",\n"), `);\n`);

      if (includeData && rows && rows.length > 0) {
        sql.push(`-- DATA INSERTS: public.${tableName}`);
        const columns = Object.keys(rows[0]);

        rows.forEach(row => {
          const values = columns.map(h => {
            const val = row[h];
            if (val === null || val === undefined) return "NULL";
            if (typeof val === 'number' || typeof val === 'boolean') return val;
            if (typeof val === 'object') return `'${JSON.stringify(val).replace(/'/g, "''")}'::jsonb`;
            return `'${String(val).replace(/'/g, "''")}'`;
          });

          sql.push(`INSERT INTO public.${tableName} (${columns.join(', ')}) VALUES (${values.join(', ')});`);
        });

        sql.push("\n");
      }

      return sql.join("\n");
    }

    async function exportSingleTableSQL(tableName, includeData = true) {
      const status = document.getElementById('statusText');
      const exportType = includeData ? "SQL + Data" : "SQL เฉพาะโครงสร้าง";

      status.innerHTML = `⏳ กำลังเตรียม ${exportType} ของตาราง ${tableName}...`;

      try {
        let rows = [];

        if (includeData) {
          if (Object.prototype.hasOwnProperty.call(tablesDataCache, tableName)) {
            rows = tablesDataCache[tableName] || [];
          } else {
            let query = supabaseClient.from(tableName).select('*');
            if (tableName === 'orders') {
              const date90DaysAgo = new Date();
              date90DaysAgo.setDate(date90DaysAgo.getDate() - 90);
              query = query.gte('created_at', date90DaysAgo.toISOString()).order('created_at', { ascending: false }).limit(500);
            }
            const { data, error } = await query;
            if (error) throw error;
            rows = data || [];
            tablesDataCache[tableName] = rows;
          }
        } else {
          if (Object.prototype.hasOwnProperty.call(tablesDataCache, tableName) && tablesDataCache[tableName] && tablesDataCache[tableName].length > 0) {
            rows = [tablesDataCache[tableName][0]];
          } else {
            const { data, error } = await supabaseClient.from(tableName).select('*').limit(1);
            if (error) throw error;
            rows = data || [];
          }
        }

        const header = `-- ========================================================\n` +
                       `-- ${includeData ? 'TABLE SCHEMA & DATA' : 'TABLE STRUCTURE ONLY'}: public.${tableName}\n` +
                       `-- Date: ${new Date().toLocaleString()}\n` +
                       `-- ========================================================\n\n`;

        const finalSQL = header + buildTableSQL(tableName, rows, includeData);
        await navigator.clipboard.writeText(finalSQL);

        if (includeData) {
          status.innerHTML = `<span class="text-emerald-300">📦 คัดลอก SQL พร้อมข้อมูลของตาราง ${tableName} แล้ว (${rows.length} รายการ)</span>`;
        } else {
          status.innerHTML = `<span class="text-blue-300">📋 คัดลอกเฉพาะโครงสร้าง SQL ของตาราง ${tableName} แล้ว</span>`;
        }
      } catch (err) {
        status.innerHTML = `<span class="text-rose-400">❌ เกิดข้อผิดพลาดในการคัดลอก SQL ของตาราง ${tableName}</span>`;
        console.error(`Export table SQL error (${tableName}):`, err);
      }
    }

    async function exportSchemaOnly() {
      const status = document.getElementById('statusText');
      status.innerHTML = "⏳ กำลังดึงโครงสร้าง Schema จาก Supabase...";

      try {
        const tableList = await fetchTablesWithComments();

        if (!tableList || tableList.length === 0) {
          status.innerHTML = `<span class="text-rose-400">❌ ไม่พบตาราง หรือไม่สามารถดึงรายชื่อตารางได้</span>`;
          return;
        }

        const now = new Date();
        const dateText = now.toLocaleString('en-GB', {
          timeZone: 'Asia/Bangkok',
          day: '2-digit', month: '2-digit', year: 'numeric',
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        });

        let sqlStatements = [
          "-- ========================================================",
          "-- FILE: schema.sql (Structure Only)",
          `-- Date: ${dateText}`,
          "-- ========================================================\n"
        ];

        let successCount = 0;
        let errorTables = [];

        for (const tableName of tableList) {
          try {
            const { data, error } = await supabaseClient.from(tableName).select('*').limit(1);
            if (error) throw error;
            const sampleData = data || [];
            const tableSQL = buildTableSQL(tableName, sampleData, false);
            sqlStatements.push(tableSQL);
            successCount++;
          } catch (err) {
            console.error(`Schema export error (${tableName}):`, err);
            errorTables.push(tableName);
          }
        }

        if (successCount === 0) {
          status.innerHTML = `<span class="text-rose-400">❌ ไม่สามารถสร้าง Schema ได้</span>`;
          return;
        }

        const schemaSQL = sqlStatements.join("\n");
        await navigator.clipboard.writeText(schemaSQL);

        if (errorTables.length === 0) {
          status.innerHTML = `<span class="text-emerald-300">✅ คัดลอก schema.sql สำเร็จ (${successCount} ตาราง) โดยไม่ต้องดึงตารางมาแสดงก่อน</span>`;
        } else {
          status.innerHTML = `<span class="text-amber-300">⚠️ คัดลอก Schema สำเร็จ ${successCount} จาก ${tableList.length} ตาราง แต่มี ${errorTables.length} ตารางที่ไม่สามารถดึงได้</span>`;
        }
      } catch (err) {
        console.error("Schema export error:", err);
        status.innerHTML = `<span class="text-rose-400">❌ เกิดข้อผิดพลาดในการส่งออก schema.sql หรือคัดลอก Clipboard ไม่สำเร็จ</span>`;
      }
    }

    async function exportAllTablesSQLWithData() {
      exportSchemaOnly();
    }

    async function truncateOrdersTable() {
      const isConfirmed = confirm("⚠️ คำเตือน: คุณต้องการลบข้อมูลทั้งหมดและรีเซ็ต ID ของตาราง 'orders' และ 'expenses' ให้เริ่มต้นใหม่ใช่หรือไม่?");
      if (!isConfirmed) return;

      const status = document.getElementById('statusText');
      status.innerHTML = "⏳ กำลังลบข้อมูลและรีเซ็ต ID ของตาราง orders และ expenses...";

      try {
        const targetTables = ['orders', 'expenses'];

        for (const tableName of targetTables) {
          const { error } = await supabaseClient.rpc('truncate_table', { target_table: tableName });
          if (error) throw new Error(`${tableName}: ${error.message}`);
        }

        status.innerHTML = `<span class="text-emerald-300">✅ ลบข้อมูลและรีเซ็ต ID ของตาราง orders และ expenses สำเร็จแล้ว (ID เริ่มต้นที่ 1)</span>`;

        setTimeout(() => {
          if (typeof fetchAllTablesData === 'function' && document.getElementById('tablesContainer').innerHTML.trim() !== '') {
            fetchAllTablesData();
          }
        }, 1000);
      } catch (err) {
        console.error("Truncate orders & expenses error:", err);
        status.innerHTML = `<span class="text-rose-400">❌ เกิดข้อผิดพลาดในการลบตาราง: ${err.message}</span>`;
      }
    }
    /* --- [End Block 3.4] SQL EXPORTER FUNCTIONS --- */
  </script>
  <!-- [End Block 3] JAVASCRIPT CORE LOGIC & FUNCTIONS -->
</body>
</html>
