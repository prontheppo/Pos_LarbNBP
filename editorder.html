  SUMMARY: หน้าแก้ไขออร์เดอร์ พร้อมระบบ Popup Iframe, Auto-Resize และโครงสร้าง Block สากล พร้อมกรองโซน

<!DOCTYPE html>
<html lang="th">
<head>
    <script src="appInit.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>แก้ไขออร์เดอร์ - ลาบหนองบัวลำภู</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
      :root { --bg-color: #f8fafc; }
      html, body { height: 100dvh; margin: 0; padding: 0; font-family: 'Sarabun', system-ui, -apple-system, sans-serif; background-color: var(--bg-color); touch-action: pan-y; -webkit-user-select: none; user-select: none; }
      .app-container { max-width: 500px; margin: 0 auto; height: 100dvh; background: #ffffff; display: flex; flex-direction: column; overflow: hidden; }
      ::-webkit-scrollbar { display: none; }

      .group-btn-v2 { background-color: #ffffff; border: 1.5px solid #fde68a; color: #334155; transition: all 0.2s ease; }
      .group-btn-v2.active { background-color: #f59e0b; border-color: #d97706; color: #ffffff; box-shadow: 0 2px 6px rgba(245, 158, 11, 0.3); }

      .customer-autocomplete-wrapper { position: relative; width: 100%; }
      .customer-dropdown {
          position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #ffffff;
          border: 1px solid #cbd5e1; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
          max-height: 180px; overflow-y: auto; z-index: 50; display: none;
      }
      .customer-dropdown.active { display: block; }
      .customer-dropdown-item {
          padding: 10px 12px; font-size: 12px; color: #334155; cursor: pointer;
          display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9;
      }
      .customer-dropdown-item:hover { background-color: #fef3c7; }

      .cart-item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f1f5f9; }
      .delete-btn { color: #ef4444; font-weight: bold; font-size: 18px; padding: 0 6px; cursor: pointer; background: transparent; border: none; }

      .custom-modal-overlay {
          position: fixed; top: 0; left: 0; right: 0; bottom: 0;
          background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
          display: none; align-items: center; justify-content: center; z-index: 9999; padding: 1rem;
      }
      .custom-modal-overlay.active { display: flex !important; }

      .popup-container {
          background: #ffffff !important; width: 100% !important; max-width: 28rem !important;
          height: auto !important; max-height: 92vh !important; border-radius: 1.5rem !important; 
          box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important;
          display: flex; flex-direction: column; overflow: hidden !important; position: relative;
          animation: popupFadeIn 0.2s ease-out;
      }
      @keyframes popupFadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
      
      .popup-content-wrapper { width: 100%; background: #ffffff; display: flex; flex-direction: column; overflow-y: auto; border-radius: 1.5rem !important; }
      #popupIframe { width: 100%; height: auto; border: 0; display: block; background: transparent; }

      .wheel::-webkit-scrollbar { display: none; }
      .wheel { -ms-overflow-style: none; scrollbar-width: none; scroll-snap-type: y mandatory; }
      .wheel-item {
          height: 36px; scroll-snap-align: center; display: flex; align-items: center; justify-content: center;
          font-size: 0.875rem; font-weight: 800; color: #1e293b; transition: color 0.15s ease;
      }
      .single-line-box { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 0.75rem; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center">

<div class="app-container shadow-2xl w-full border border-slate-100 flex flex-col">
    <div class="p-4 bg-white border-b border-slate-100 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2">
            <button type="button" onclick="goBackToReport()" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 font-bold active:scale-95 transition">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div>
                <h2 class="font-extrabold text-sm text-slate-800">แก้ไขรายละเอียดออเดอร์</h2>
                <p class="text-[10px] text-slate-400 font-semibold" id="editModalOrderTitle">รหัสออเดอร์: ⏳ กำลังโหลด...</p>
            </div>
        </div>
        <button type="button" onclick="goBackToReport()" class="text-slate-400 hover:text-slate-600 font-bold text-base px-2">✕</button>
    </div>

    <div class="flex-1 overflow-y-auto p-4 space-y-4 bg-white flex flex-col">
        <div id="editLocationSelectorWrapper" class="shrink-0"></div>
        <div class="space-y-1.5 flex-1 flex flex-col min-h-0">
            <span class="text-xs font-bold text-slate-500 shrink-0">🍱 รายการอาหารในออเดอร์</span>
            <div class="border-2 border-slate-200 rounded-2xl p-3 flex-1 overflow-y-auto space-y-2 bg-slate-50/50" id="editOrderItemsContainer">
                <div class="text-center text-slate-400 py-6 text-xs">⏳ กำลังโหลดรายการอาหาร...</div>
            </div>
        </div>
        <button type="button" onclick="openCategoryModalForEdit()" class="w-full py-3 border-2 border-dashed border-emerald-400 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold rounded-2xl flex items-center justify-center gap-2 transition active:scale-95 cursor-pointer text-sm shrink-0">
            <span>+</span> เพิ่มรายการอาหาร
        </button>
    </div>

    <div class="p-4 bg-white border-t border-slate-100 space-y-3 shrink-0 shadow-lg">
        <div class="flex justify-between items-end">
            <span class="text-xs text-slate-500 font-bold" id="editCartCountText">0 รายการ | 0 ชิ้น</span>
            <div class="text-right">
                <span class="text-[10px] text-slate-400 block font-bold">ยอดรวมสุทธิ</span>
                <span class="text-lg font-black text-slate-800" id="editTotalPrice">0 บาท</span>
            </div>
        </div>
        <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="goBackToReport()" class="py-2.5 bg-slate-100 text-slate-600 font-bold text-xs rounded-xl hover:bg-slate-200 active:scale-95 transition">✕ ยกเลิก</button>
            <button type="button" onclick="deleteCurrentEditingOrder()" class="py-2.5 bg-rose-500 text-white font-bold text-xs rounded-xl shadow-md hover:bg-rose-600 active:scale-95 transition">🗑️ ลบ</button>
            <button type="button" onclick="saveOrderEditData()" class="py-2.5 bg-amber-500 text-white font-bold text-xs rounded-xl shadow-md hover:bg-amber-600 active:scale-95 transition">✏️ บันทึก</button>
        </div>
    </div>
</div>

<div id="calendarModalOverlay" class="custom-modal-overlay" onclick="toggleModal('calendarModalOverlay','calendarModalBox',false)">
    <div id="calendarModalBox" class="popup-container" onclick="event.stopPropagation()">
        <div class="popup-content-wrapper">
            <div class="flex justify-between items-center px-4 py-3 bg-slate-50 border-b border-slate-100 shrink-0">
                <div class="flex items-center gap-2"><span class="text-base">📅</span><h2 class="font-extrabold text-xs text-slate-800">เลือกวันที่ออเดอร์</h2></div>
                <button type="button" onclick="toggleModal('calendarModalOverlay','calendarModalBox',false)" class="text-slate-400 hover:text-slate-600 font-bold text-base px-2">✕</button>
            </div>
            <iframe id="calendarFrame" src="" class="w-full border-none bg-white min-h-[360px]"></iframe>
        </div>
    </div>
</div>

<div id="subLocZoneModal" class="custom-modal-overlay" onclick="toggleModal('subLocZoneModal','subLocZoneBox',false)">
    <div id="subLocZoneBox" class="popup-container" onclick="event.stopPropagation()">
        <div class="popup-content-wrapper">
            <div class="flex justify-between items-center px-4 py-3 border-b border-slate-100 bg-slate-50 flex-shrink-0">
                <span class="font-extrabold text-sm text-slate-700 truncate px-1" id="locationModalTitle">📍 เลือกสถานที่จัดส่ง</span>
                <button type="button" onclick="toggleModal('subLocZoneModal','subLocZoneBox',false)" class="w-7 h-7 rounded-full bg-slate-200 hover:bg-rose-100 hover:text-rose-600 text-slate-600 flex items-center justify-center font-bold text-xs transition cursor-pointer">✕</button>
            </div>
            <iframe id="locationZoneFrame" src="" class="w-full border-none bg-white min-h-[420px]"></iframe>
        </div>
    </div>
</div>

<div id="dynamicPopupOverlay" class="custom-modal-overlay" onclick="handleOverlayClick()">
    <div id="popupContainerBox" class="popup-container" onclick="event.stopPropagation()">
        <div class="popup-content-wrapper">
            <iframe id="popupIframe" src=""></iframe>
        </div>
    </div>
</div>

<div id="customAlertModal" class="custom-modal-overlay" onclick="toggleModal('customAlertModal','customAlertBox',false)">
    <div class="popup-container max-w-xs p-5 text-center bg-white rounded-3xl shadow-2xl m-4" onclick="event.stopPropagation()" id="customAlertBox">
        <div id="customAlertIcon" class="text-3xl mb-2">🎉</div>
        <h3 id="customAlertTitle" class="font-extrabold text-base text-slate-800 mb-1">แจ้งเตือน</h3>
        <p id="customAlertMessage" class="text-xs text-slate-600 mb-5 leading-relaxed font-medium">ข้อความ...</p>
        <div id="customAlertButtons" class="flex gap-2"></div>
    </div>
</div>

<script>
let db = null, targetOrderId = null, currentEditingOrder = null;
let currentEditingOrderItems = [], locationsCache = [], zonesCache = [], foodsCache = [], categoriesCache = [], customersList = [];
let selectedCustomerObj = null;
let locationFoodPricesMap = {}, isDeliveryFeeWaived = false;
let selectedOrderDate = '', curH = '00', curM = '00';
const ITEM_HEIGHT = 36;
let popupHistory = [];
let pendingFoodSelectInit = null;

function getAppOrigin() { return window.location.origin; }

window.onload = async function() {
    const urlParams = new URLSearchParams(window.location.search);
    targetOrderId = urlParams.get('order_id');
    if (!targetOrderId) { window.location.href = 'salereport.html'; return; }
    db = window.supabaseClient || supabaseClient;
    renderEditLocationComponent('editLocationSelectorWrapper');
    await fetchMasterDataAndOrder();
};

function goBackToReport() { window.location.href = 'salereport.html'; }

function formatThaiDateDisplay(dateStr) {
    if (!dateStr) return 'เลือกวันที่';
    const [y, m, d] = dateStr.split('-');
    const thaiMonthsShort = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
    return `${parseInt(d)} ${thaiMonthsShort[parseInt(m)-1]} ${parseInt(y)+543}`;
}

async function fetchMasterDataAndOrder() {
    if (!db) return;
    try {
        const [locRes, zoneRes, foodRes, catRes, priceRes, custRes, orderRes] = await Promise.all([
            db.from('locations').select('*').order('location_name'),
            db.from('location_zone').select('*').order('zone_name'),
            db.from('foods').select('*').order('food_id'),
            db.from('food_groups').select('*').order('food_group_id'),
            db.from('location_food_prices').select('*'),
            db.from('customers').select('*').order('customer_name'),
            db.from('orders').select('*').eq('order_id', targetOrderId).single()
        ]);

        locationsCache = locRes.data || [];
        zonesCache = zoneRes.data || [];
        foodsCache = foodRes.data || [];
        customersList = custRes.data || [];
        categoriesCache = (catRes.data || []).filter(c => c.food_group_name !== 'importmain').sort((a,b)=>Number(a.food_group_id)-Number(b.food_group_id));
        if (priceRes.data) priceRes.data.forEach(i => locationFoodPricesMap[`${i.location_id}_${i.food_id}`] = Number(i.custom_price || 0));

        if (orderRes.error || !orderRes.data) return showAlert('ข้อผิดพลาด', 'ไม่พบข้อมูลออเดอร์', '❌', goBackToReport);

        currentEditingOrder = orderRes.data;
        document.getElementById('editModalOrderTitle').textContent = `รหัสออเดอร์: #${targetOrderId}`;

        if (currentEditingOrder.created_at) {
            const d = new Date(currentEditingOrder.created_at);
            selectedOrderDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            curH = String(d.getHours()).padStart(2,'0');
            curM = String(d.getMinutes()).padStart(2,'0');
            document.getElementById('editOrderDateBtnText').textContent = formatThaiDateDisplay(selectedOrderDate);
            const wheelH = document.getElementById('wheelH'), wheelM = document.getElementById('wheelM');
            if(wheelH && wheelM) { scrollToValue(wheelH, parseInt(curH, 10)); scrollToValue(wheelM, parseInt(curM, 10)); }
        }

        const typeId = Number(currentEditingOrder.customer_type_id || 1);
        selectEditCustomerGroup(typeId);

        if (currentEditingOrder.customer_name) {
            const custName = removeDuplicateWords(currentEditingOrder.customer_name || '');
            document.querySelectorAll('.customer-input-field').forEach(inp => inp.value = custName);
        }

        if (typeId === 2 && currentEditingOrder.location_id) {
            const foundLoc = locationsCache.find(l => String(l.location_id) === String(currentEditingOrder.location_id));
            if (foundLoc) {
                document.getElementById('editSelectedLocationId').value = foundLoc.location_id;
                let txt = foundLoc.location_name;
                if (currentEditingOrder.zone_id) {
                    const foundZone = zonesCache.find(z => String(z.zone_id) === String(currentEditingOrder.zone_id));
                    if (foundZone) {
                        document.getElementById('editSelectedZoneId').value = foundZone.zone_id;
                        txt += ` - ${foundZone.zone_name}`;
                    }
                }
                document.getElementById('editLocationBtnText').innerText = txt;
            }
        }

        const rawItems = typeof currentEditingOrder.items === 'string' ? JSON.parse(currentEditingOrder.items) : (currentEditingOrder.items || []);
        currentEditingOrderItems = Array.isArray(rawItems) ? rawItems.map(normalizeOrderItem) : [];
        renderEditOrderModalItems();
    } catch (err) { showAlert('เกิดข้อผิดพลาด', 'ไม่สามารถโหลดข้อมูลได้', '❌', goBackToReport); }
}

function renderEditLocationComponent(containerId) {
    document.getElementById(containerId).innerHTML = `
        <div class="bg-amber-50/50 border border-amber-200 rounded-2xl p-3 shadow-sm space-y-2">
            <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="selectEditCustomerGroup(1)" id="btn-group-1" class="group-btn-v2 active h-[38px] rounded-xl font-bold text-xs flex items-center justify-center gap-1 cursor-pointer">🏡 ชาวบ้าน</button>
                <button type="button" onclick="selectEditCustomerGroup(2)" id="btn-group-2" class="group-btn-v2 h-[38px] rounded-xl font-bold text-xs flex items-center justify-center gap-1 cursor-pointer">🧳 นักท่องเที่ยว</button>
                <button type="button" onclick="selectEditCustomerGroup(3)" id="btn-group-3" class="group-btn-v2 h-[38px] rounded-xl font-bold text-xs flex items-center justify-center gap-1 cursor-pointer">😊 สบายดี</button>
            </div>
            <div class="flex gap-2 items-center">
                <div class="flex-1 customer-autocomplete-wrapper">
                    <input type="text" id="editCustomerInput" oninput="handleCustomerInput(this.value)" placeholder="👤 ชื่อ หรือ เบอร์โทรลูกค้า" autocomplete="off" class="customer-input-field w-full h-[38px] px-3 border border-amber-200 rounded-xl text-xs bg-white outline-none">
                    <div id="customerDropdown-editLocation" class="customer-dropdown"></div>
                </div>
                <div id="editLocationBtnContainer" class="w-5/12 hidden">
                    <button type="button" onclick="openSubLocationModal()" class="w-full h-[38px] bg-amber-500 text-white font-bold px-2 rounded-xl text-xs flex items-center justify-center gap-1 shadow-sm">📍 <span id="editLocationBtnText" class="truncate">เลือกสถานที่</span></button>
                </div>
            </div>

            <div class="grid grid-cols-12 gap-2 bg-white p-2 border border-slate-200/80 rounded-xl items-center mt-1">
                <div class="col-span-6 flex flex-col justify-center">
                    <span class="text-[10px] font-bold text-slate-400 mb-0.5 ml-1">📅 วันที่ออเดอร์</span>
                    <button type="button" onclick="openCalendarModal()" class="w-full h-[36px] px-2.5 bg-slate-50 hover:bg-amber-50 border border-slate-200 text-slate-800 font-extrabold text-xs rounded-xl flex items-center justify-between shadow-2xs transition active:scale-95">
                        <span id="editOrderDateBtnText" class="truncate">เลือกวันที่</span>
                        <span class="text-slate-400 text-[10px]">▼</span>
                    </button>
                </div>
                <div class="col-span-6 flex flex-col justify-center">
                    <span class="text-[10px] font-bold text-slate-400 mb-0.5 ml-1">⏰ เวลา (เลื่อนขึ้น-ลง)</span>
                    <div class="single-line-box px-2 h-[36px] flex items-center justify-center gap-1">
                        <div class="relative w-10 h-[36px] overflow-hidden"><div id="wheelH" class="wheel w-full h-full overflow-y-auto"></div></div>
                        <span class="text-xs font-black text-slate-800 pb-0.5">:</span>
                        <div class="relative w-10 h-[36px] overflow-hidden"><div id="wheelM" class="wheel w-full h-full overflow-y-auto"></div></div>
                        <span class="text-[10px] font-bold text-slate-600 self-end mb-1">น.</span>
                    </div>
                </div>
            </div>
            <input type="hidden" id="editCustomerGroupSelect" value="1">
            <input type="hidden" id="editSelectedLocationId" value="">
            <input type="hidden" id="editSelectedZoneId" value="">
        </div>`;
    initTimeWheels();
}

function handleCustomerInput(val) {
    document.querySelectorAll('.customer-input-field').forEach(inp => { if (inp.value !== val) inp.value = val; });
    selectedCustomerObj = null;
    const dropdown = document.getElementById('customerDropdown-editLocation');
    if (!dropdown) return;
    const cleanVal = removeDuplicateWords(val);
    if (!cleanVal) { dropdown.classList.remove('active'); return; }
    const matches = customersList.filter(c => removeDuplicateWords(c.customer_name || '').toLowerCase().includes(cleanVal.toLowerCase()));
    if (matches.length === 0) { dropdown.classList.remove('active'); return; }
    dropdown.innerHTML = '';
    matches.forEach(cust => {
        const item = document.createElement('div');
        item.className = 'customer-dropdown-item';
        item.innerHTML = `<span class="font-semibold">${removeDuplicateWords(cust.customer_name)}</span>`;
        item.onclick = () => {
            selectedCustomerObj = cust;
            document.querySelectorAll('.customer-input-field').forEach(inp => inp.value = removeDuplicateWords(cust.customer_name));
            dropdown.classList.remove('active');
        };
        dropdown.appendChild(item);
    });
    dropdown.classList.add('active');
}

function initTimeWheels() {
    const wheelH = document.getElementById('wheelH'), wheelM = document.getElementById('wheelM');
    if(!wheelH || !wheelM) return;
    buildWheel(wheelH, 24); buildWheel(wheelM, 60);
    setTimeout(() => { scrollToValue(wheelH, parseInt(curH, 10)); scrollToValue(wheelM, parseInt(curM, 10)); }, 50);
    setupScrollListener(wheelH, 23, (val) => curH = val);
    setupScrollListener(wheelM, 59, (val) => curM = val);
}

function buildWheel(container, count) {
    container.innerHTML = '';
    for (let i = 0; i < count; i++) {
        const item = document.createElement('div');
        item.className = 'wheel-item';
        item.textContent = String(i).padStart(2, '0');
        container.appendChild(item);
    }
}

function setupScrollListener(container, maxIdx, onSelect) {
    let timer = null;
    container.onscroll = () => {
        let idx = Math.min(Math.max(Math.round(container.scrollTop / ITEM_HEIGHT), 0), maxIdx);
        onSelect(String(idx).padStart(2, '0'));
        clearTimeout(timer);
        timer = setTimeout(() => { container.scrollTo({ top: idx * ITEM_HEIGHT, behavior: 'smooth' }); }, 100);
    };
}

function scrollToValue(container, index) { container.scrollTop = index * ITEM_HEIGHT; }

function selectEditCustomerGroup(groupId) {
    document.getElementById('editCustomerGroupSelect').value = groupId;
    document.querySelectorAll('.group-btn-v2').forEach(b => b.classList.remove('active'));
    document.getElementById(`btn-group-${groupId}`)?.classList.add('active');

    const locContainer = document.getElementById('editLocationBtnContainer');
    if (groupId === 2) locContainer.classList.remove('hidden');
    else {
        locContainer.classList.add('hidden');
        document.getElementById('editSelectedLocationId').value = '';
        document.getElementById('editSelectedZoneId').value = '';
    }
    if (currentEditingOrderItems.length > 0) renderEditOrderModalItems();
}

function selectLocationAndZone(locId, locName, zoneId, zoneName) {
    document.getElementById('editSelectedLocationId').value = locId;
    document.getElementById('editSelectedZoneId').value = zoneId || '';
    document.getElementById('editLocationBtnText').textContent = `${locName}${zoneName ? ' - ' + zoneName : ''}`;
    toggleModal('subLocZoneModal', 'subLocZoneBox', false);
    renderEditOrderModalItems();
}

function removeDuplicateWords(text) {
    if (!text) return '';
    const parts = text.trim().split(/\s+/);
    return (parts.length === 2 && parts[0] === parts[1]) ? parts[0] : text.trim();
}

function normalizeOrderItem(item) {
    const q = Number(item.qty || item.quantity || 1);
    const p = Number(item.unit_price || item.price || 0);
    const fId = Number(item.food_id || item.id || 9999);
    const fName = item.name || item.food_name || 'รายการ';
    return {
        item_id: item.item_id || `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
        food_id: fId, name: fName, food_name: fName, qty: q, quantity: q,
        price: Number(item.price || p), unit_price: Number(item.unit_price || p),
        total_price: Number(item.total_price || (p * q)), note: item.note || '',
        food_group_id: Number(item.food_group_id || 1),
        friedEggQty: Number(item.friedEggQty || 0), omeletQty: Number(item.omeletQty || 0),
        base_price: item.base_price !== undefined ? item.base_price : null,
        cost_price: Number(item.cost_price || 0), isSpecialMenu: Boolean(item.isSpecialMenu),
        is_buying_resell: Boolean(item.is_buying_resell), originalIndex: Number(item.originalIndex || 0)
    };
}

function openCalendarModal() {
    document.getElementById('calendarFrame').src = 'calendar.html';
    toggleModal('calendarModalOverlay', 'calendarModalBox', true);
}

function openSubLocationModal() {
    document.getElementById('locationModalTitle').textContent = '📍 เลือกสถานที่จัดส่ง';
    const iframe = document.getElementById('locationZoneFrame');
    iframe.src = 'location.html';
    toggleModal('subLocZoneModal', 'subLocZoneBox', true);

    iframe.onload = () => {
        iframe.contentWindow.postMessage({ type: 'RENDER_LOCATIONS', locations: locationsCache, counts: {} }, getAppOrigin());
    };
}

function openCategoryModalForEdit() { openDynamicPopup('foodgroup.html', false); }

function openDynamicPopup(url, keepPrevious = false, restoring = false) {
    const overlay = document.getElementById('dynamicPopupOverlay');
    const iframe = document.getElementById('popupIframe');
    if (!url || !iframe) return;

    if (!restoring) {
        if (keepPrevious && overlay.classList.contains('active') && iframe.getAttribute('src')) popupHistory.push(iframe.getAttribute('src'));
        else if (!keepPrevious) popupHistory = [];
    }

    iframe.style.height = '200px';
    overlay.classList.add('active');
    iframe.src = url;

    iframe.onload = () => {
        if (pendingFoodSelectInit && iframe.contentWindow) {
            iframe.contentWindow.postMessage(pendingFoodSelectInit, getAppOrigin());
            pendingFoodSelectInit = null;
        }
        if (iframe.contentWindow) {
            iframe.contentWindow.postMessage({ type: 'RENDER_CATEGORIES', categories: categoriesCache, foods: foodsCache, cart: currentEditingOrderItems }, getAppOrigin());
        }
    };
}

function navigatePopupBack() {
    if (popupHistory.length > 0) openDynamicPopup(popupHistory.pop(), false, true);
    else closeDynamicPopup();
}

function handleOverlayClick() { navigatePopupBack(); }

function closeDynamicPopup() {
    popupHistory = [];
    pendingFoodSelectInit = null;
    document.getElementById('dynamicPopupOverlay').classList.remove('active');
    document.getElementById('popupIframe').src = '';
    renderEditOrderModalItems();
}

window.addEventListener('message', (event) => {
    if (event.origin !== getAppOrigin()) return;
    if (!event.data || typeof event.data !== 'object' || typeof event.data.type !== 'string') return;

    const data = event.data;
    const { type, catId, catName, height, locationObj, zoneObj, group_id, group_name, cartItem, action, selectedDate } = data;
    const popupIframe = document.getElementById('popupIframe');
    const locationZoneFrame = document.getElementById('locationZoneFrame');

    const isPopupMessage = !!popupIframe && event.source === popupIframe.contentWindow;
    const isLocationMessage = !!locationZoneFrame && event.source === locationZoneFrame.contentWindow;

    if (type === 'RESIZE_POPUP') {
        const requestedHeight = Number(height);
        if (Number.isFinite(requestedHeight) && requestedHeight > 0) {
            if (isPopupMessage) popupIframe.style.height = `${requestedHeight}px`;
            else if (isLocationMessage) locationZoneFrame.style.height = `${Math.min(requestedHeight, 450)}px`;
        }
        return;
    }

    if (type === 'SELECT_LOCATION' && isLocationMessage && locationObj && typeof locationObj === 'object') {
        const targetLocId = locationObj.location_id ?? null;
        const targetLocName = String(locationObj.location_name || '');

        if (targetLocName.includes('หน้าร้าน')) {
            selectLocationAndZone(targetLocId, targetLocName, null, '');
            return;
        }

        const filteredZones = zonesCache.filter(z => Number(z.location_id) === Number(targetLocId));
        document.getElementById('locationModalTitle').textContent = `เลือกโซน/ห้องพัก (${targetLocName})`;
        locationZoneFrame.src = 'zone.html';
        locationZoneFrame.onload = () => {
            locationZoneFrame.contentWindow.postMessage({ type: 'RENDER_ZONES', zones: filteredZones, locationId: targetLocId }, getAppOrigin());
        };
        return;
    }

    if (type === 'SELECT_ZONE' && isLocationMessage && zoneObj && typeof zoneObj === 'object') {
        const zoneId = zoneObj.zone_id ?? null;
        const zoneName = String(zoneObj.zone_name || '');
        const currentLocId = document.getElementById('editSelectedLocationId').value || '';
        const currentLocName = document.getElementById('editLocationBtnText').textContent.split(' - ')[0] || '';
        selectLocationAndZone(currentLocId, currentLocName, zoneId, zoneName);
        return;
    }

    if (type === 'ADD_NEW_ZONE' && isLocationMessage) {
        const { zoneName, locationId } = data;
        if (zoneName && typeof db !== 'undefined') {
            db.from('location_zone').insert([{ zone_name: zoneName, location_id: locationId }]).select().single()
                .then(({ data: newZone, error }) => {
                    if (!error && newZone) {
                        zonesCache.push(newZone);
                        const filteredZones = zonesCache.filter(z => Number(z.location_id) === Number(locationId));
                        locationZoneFrame.contentWindow.postMessage({ type: 'RENDER_ZONES', zones: filteredZones, locationId: locationId }, getAppOrigin());
                    }
                });
        }
        return;
    }

    if (type === 'SELECT_CATEGORY' || type === 'OPEN_CONSIGNMENT_LIST') {
        const safeCatId = Number(catId);
        if (!Number.isFinite(safeCatId)) return;
        openDynamicPopup(`foodmenu.html?group_id=${safeCatId}&name=${encodeURIComponent(String(catName || ''))}`, true);
        return;
    }

    if (type === 'OPEN_FOOD_SELECT' || type === 'SELECT_CONSIGNMENT_ITEM') {
        if (!data.food || data.food.food_id == null) return;
        pendingFoodSelectInit = { type: 'INIT_FOOD_SELECT', food: data.food, catId: Number(catId) };
        openDynamicPopup(`foodselect.html?food_id=${encodeURIComponent(data.food.food_id)}&group_id=${encodeURIComponent(catId)}`, true);
        return;
    }

    if (type === 'OPEN_ADD_MENU') {
        openDynamicPopup(`foodaddnew.html?group_id=${encodeURIComponent(group_id || '')}&group_name=${encodeURIComponent(group_name || '')}`, true);
        return;
    }

    if (type === 'BACK_TO_CATEGORY') { navigatePopupBack(); return; }
    if (type === 'ADD_TO_CART' && cartItem) { addItemToEditCart(cartItem); return; }
    if (type === 'DELETE_CART_ITEM_BY_ID' && data.itemId != null) { removeEditCartItemById(data.itemId); return; }
    if (type === 'CLOSE_POPUP') { closeDynamicPopup(); return; }

    if (action === 'SELECT_DATE' && selectedDate) {
        selectedOrderDate = selectedDate;
        document.getElementById('editOrderDateBtnText').textContent = formatThaiDateDisplay(selectedDate);
        toggleModal('calendarModalOverlay', 'calendarModalBox', false);
    }
});

function addItemToEditCart(newItem) {
    const safeQty = Math.max(1, Number(newItem.qty || newItem.quantity) || 1);
    const foodId = Number(newItem.food_id || newItem.id || 9999);
    const foodName = newItem.name || newItem.food_name || 'รายการ';
    
    let basePrice = getGroupBasePriceForEdit(newItem, Number(document.getElementById('editCustomerGroupSelect').value || 1));
    let unitPrice = Number(newItem.unit_price || newItem.price || basePrice) || 0;
    let daoQty = Number(newItem.friedEggQty || 0);
    let jiaoQty = Number(newItem.omeletQty || 0);
    let finalUnitPrice = unitPrice + (daoQty * 10) + (jiaoQty * 10);
    let subtotalPrice = finalUnitPrice * safeQty;

    const normalizedItem = {
        item_id: newItem.item_id || `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
        food_id: foodId, name: foodName, food_name: foodName, qty: safeQty, quantity: safeQty,
        price: unitPrice, unit_price: finalUnitPrice, total_price: subtotalPrice, note: newItem.note || '',
        food_group_id: Number(newItem.food_group_id || 1), friedEggQty: daoQty, omeletQty: jiaoQty,
        base_price: newItem.base_price !== undefined ? newItem.base_price : null,
        cost_price: Number(newItem.cost_price || 0), isSpecialMenu: Boolean(newItem.isSpecialMenu),
        is_buying_resell: Boolean(newItem.is_buying_resell), originalIndex: currentEditingOrderItems.length
    };

    currentEditingOrderItems.push(normalizedItem);
    renderEditOrderModalItems();
}

function removeEditCartItemById(itemId) {
    currentEditingOrderItems = currentEditingOrderItems.filter(item => String(item.item_id) !== String(itemId));
    renderEditOrderModalItems();
}

function getGroupBasePriceForEdit(item, groupId) {
    const foodId = item.food_id || item.id;
    const currentLocId = document.getElementById('editSelectedLocationId')?.value || '';
    let customPrice = null;

    for (const c of [item.custom_price, item.customPrice, item.special_price, item.specialPrice]) {
        if (c !== null && c !== undefined && c !== '' && Number(c) > 0) { customPrice = Number(c); break; }
    }

    if (customPrice === null) {
        const foodObj = foodsCache.find(f => String(f.food_id) === String(foodId));
        if (foodObj) {
            const stdPrice = Number(foodObj.price_1) || 0;
            const savedPrice = Number(item.price) || 0;
            if (savedPrice > 0 && stdPrice > 0 && savedPrice !== stdPrice) customPrice = savedPrice;
            else if (savedPrice > 0 && stdPrice === 0) customPrice = savedPrice;
        }
    }

    if (customPrice !== null) return customPrice;
    if (currentLocId && foodId && locationFoodPricesMap[`${currentLocId}_${foodId}`] > 0) {
        return Number(locationFoodPricesMap[`${currentLocId}_${foodId}`]);
    }

    const foodObj = foodsCache.find(f => String(f.food_id) === String(foodId));
    if (foodObj) {
        const prices = [foodObj.price_1, foodObj.price_2, foodObj.price_3].map(Number);
        const groupPrice = prices[groupId - 1];
        if (groupPrice > 0) return groupPrice;
        return prices[0] > 0 ? prices[0] : Number(item.price || 0);
    }
    return Number(item.price || 0);
}

function renderEditOrderModalItems() {
    const container = document.getElementById('editOrderItemsContainer');
    container.innerHTML = '';
    let totalCartPrice = 0, totalQty = 0;
    const customerType = Number(document.getElementById('editCustomerGroupSelect').value || 1);
    const locationId = document.getElementById('editSelectedLocationId').value;

    if (currentEditingOrderItems.length === 0) {
        container.innerHTML = `<div class="text-center text-slate-400 py-6 text-xs">⏳ ยังไม่มีรายการอาหารในบิลนี้</div>`;
        document.getElementById('editCartCountText').textContent = `0 รายการ | 0 ชิ้น`;
        document.getElementById('editTotalPrice').textContent = `0 บาท`;
        return;
    }

    currentEditingOrderItems.forEach((item, index) => {
        let q = Number(item.qty || item.quantity || 1);
        let daoQty = Number(item.friedEggQty || 0);
        let jiaoQty = Number(item.omeletQty || 0);

        let basePrice = getGroupBasePriceForEdit(item, customerType);
        let unitPrice = basePrice + (daoQty * 10) + (jiaoQty * 10);
        let sub = unitPrice * q;

        item.unit_price = unitPrice;
        item.total_price = sub;
        totalQty += q;
        totalCartPrice += sub;

        let details = [];
        if (daoQty > 0) details.push(`ไข่ดาว ${daoQty}`);
        if (jiaoQty > 0) details.push(`ไข่เจียว ${jiaoQty}`);
        if (item.note) details.push(item.note);

        const row = document.createElement('div');
        row.className = 'cart-item-row text-xs';
        row.innerHTML = `
            <div class="flex-1 pr-2 flex items-center gap-1">
                <button type="button" onclick="currentEditingOrderItems.splice(${index},1); renderEditOrderModalItems();" class="delete-btn text-sm">&times;</button>
                <div>
                    <span class="font-bold text-slate-800">${q}x ${item.name || item.food_name || 'รายการ'}</span>
                    <span class="text-amber-600 font-semibold">${details.length ? ` (${details.join(', ')})` : ''}</span>
                </div>
            </div>
            <span class="font-extrabold text-slate-900">${sub}.-</span>`;
        container.appendChild(row);
    });

    let deliveryFee = 0;
    const currentLocObj = locationsCache.find(l => String(l.location_id) === String(locationId));
    if (customerType === 2 && currentLocObj && !currentLocObj.location_name.includes('หน้าร้าน') && !isDeliveryFeeWaived) {
        if (totalCartPrice < (Number(currentLocObj.min_order_for_free_delivery) || 300)) {
            deliveryFee = Number(currentLocObj.delivery_fee) || 20;
        }
    }

    if (deliveryFee > 0) {
        const deliveryRow = document.createElement('div');
        deliveryRow.className = 'cart-item-row bg-amber-50/60 p-2 rounded-xl border border-amber-100 text-xs';
        deliveryRow.innerHTML = `
            <div class="flex-1 flex items-center gap-1"><span>🛵</span><span class="font-bold text-amber-900">ค่าบริการจัดส่ง</span></div>
            <div class="flex items-center gap-3">
                <span class="font-extrabold text-amber-900">${deliveryFee}.-</span>
                <button type="button" onclick="isDeliveryFeeWaived=true; renderEditOrderModalItems();" class="delete-btn">&times;</button>
            </div>`;
        container.appendChild(deliveryRow);
    }

    document.getElementById('editCartCountText').textContent = `${currentEditingOrderItems.length} รายการ | ${totalQty} ชิ้น`;
    document.getElementById('editTotalPrice').textContent = `${(totalCartPrice + deliveryFee).toLocaleString()} บาท`;
}

async function ensureCustomerSaved(inputValue) {
    const val = removeDuplicateWords(inputValue);
    if (!val) return null;
    if (selectedCustomerObj) return selectedCustomerObj;
    const existing = customersList.find(c => removeDuplicateWords(c.customer_name || '').toLowerCase() === val.toLowerCase());
    if (existing) return existing;
    try {
        if (typeof db !== 'undefined') {
            const { data, error } = await db.from('customers').insert([{ customer_name: val }]).select().single();
            if (!error && data) { customersList.push(data); return data; }
        }
    } catch (err) { console.error('Insert Customer Error:', err); }
    return { customer_name: val };
}

async function saveOrderEditData() {
    if (!targetOrderId) return;
    try {
        const customerType = Number(document.getElementById('editCustomerGroupSelect').value || 1);
        const rawCustomerInput = document.getElementById('editCustomerInput')?.value || '';
        const customerObj = await ensureCustomerSaved(rawCustomerInput);
        const customerDisplayName = customerObj ? removeDuplicateWords(customerObj.customer_name || '') : removeDuplicateWords(rawCustomerInput);

        const locationId = document.getElementById('editSelectedLocationId').value || null;
        const zoneId = document.getElementById('editSelectedZoneId').value || null;
        const timeVal = `${curH}:${curM}`;

        let subtotal = currentEditingOrderItems.reduce((sum, item) => sum + Number(item.total_price || 0), 0);
        let deliveryFee = 0;
        const currentLocObj = locationsCache.find(l => String(l.location_id) === String(locationId));
        if (customerType === 2 && currentLocObj && !currentLocObj.location_name.includes('หน้าร้าน') && !isDeliveryFeeWaived) {
            if (subtotal < (Number(currentLocObj.min_order_for_free_delivery) || 300)) deliveryFee = Number(currentLocObj.delivery_fee) || 20;
        }

        const updatePayload = {
            customer_type_id: customerType, customer_name: customerDisplayName,
            customer_id: customerObj ? String(customerObj.customer_id || '') : null,
            location_id: locationId ? Number(locationId) : null,
            zone_id: zoneId ? Number(zoneId) : null,
            items: JSON.stringify(currentEditingOrderItems),
            subtotal: subtotal, delivery_fee: deliveryFee,
            total_price: subtotal + deliveryFee,
            total_qty: currentEditingOrderItems.reduce((sum, item) => sum + Number(item.qty || 1), 0)
        };

        if (selectedOrderDate) updatePayload.created_at = new Date(`${selectedOrderDate}T${timeVal}:00`).toISOString();

        const { error } = await db.from('orders').update(updatePayload).eq('order_id', targetOrderId);
        if (error) throw error;
        showAlert('สำเร็จ', 'บันทึกการแก้ไขเรียบร้อยแล้ว!', '🎉', () => goBackToReport());
    } catch (err) { showAlert('เกิดข้อผิดพลาด', err.message, '❌'); }
}

async function deleteCurrentEditingOrder() {
    if (!targetOrderId) return;
    showAlert('ยืนยันการลบ', `คุณต้องการลบออเดอร์ #${targetOrderId} ใช่หรือไม่?`, '🗑', async () => {
        try {
            const { error } = await db.from('orders').delete().eq('order_id', targetOrderId);
            if (error) throw error;
            showAlert('สำเร็จ', 'ลบออเดอร์เรียบร้อยแล้ว', '🗑️', () => goBackToReport());
        } catch (err) { showAlert('เกิดข้อผิดพลาด', err.message, '❌'); }
    }, true);
}

function toggleModal(modalId, boxId, show = true) {
    const m = document.getElementById(modalId);
    if(m) m.classList.toggle('active', show);
}

function showAlert(title, message, icon = '🎉', onOk = null, isConfirm = false) {
    document.getElementById('customAlertTitle').textContent = title;
    document.getElementById('customAlertMessage').textContent = message;
    document.getElementById('customAlertIcon').textContent = icon;
    const btns = document.getElementById('customAlertButtons');

    if(!isConfirm) {
        btns.innerHTML = `<button type="button" class="w-full py-2.5 bg-amber-500 text-white font-bold text-xs rounded-xl shadow-md cursor-pointer">ตกลง</button>`;
        btns.firstElementChild.onclick = () => { toggleModal('customAlertModal','customAlertBox',false); if(onOk) onOk(); };
    } else {
        btns.innerHTML = `
            <button type="button" class="flex-1 py-2.5 bg-slate-100 text-slate-700 font-bold text-xs rounded-xl cursor-pointer">ยกเลิก</button>
            <button type="button" class="flex-1 py-2.5 bg-rose-500 text-white font-bold text-xs rounded-xl shadow-md cursor-pointer">ยืนยัน</button>`;
        btns.children[0].onclick = () => toggleModal('customAlertModal','customAlertBox',false);
        btns.children[1].onclick = () => { toggleModal('customAlertModal','customAlertBox',false); if(onOk) onOk(); };
    }
    toggleModal('customAlertModal','customAlertBox',true);
}
