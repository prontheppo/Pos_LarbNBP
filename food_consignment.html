<!--
  ========================================================================
  FILE NAME: food_consignment.html
  SUMMARY: แบ่งโครงสร้างออกเป็น 2 บล็อกหลัก และ 10 บล็อกย่อย ดังนี้

   - [บล็อก 1] UI COMPONENTS & LAYOUT (ส่วนแสดงผลหน้าจอผู้ใช้)
     (ประกอบด้วย 4 หัวข้อ)
       - [บล็อก 1.1] HEADER (ส่วนหัวแสดงชื่อหมวดหมู่และปุ่มปิด)
       - [บล็อก 1.2] ADD NEW CONSIGNMENT ITEM (ปุ่มเปิดหน้าเพิ่มรายการใหม่)
       - [บล็อก 1.3] CONSIGNMENT ITEMS GRID (ตารางแสดงรายการสินค้าพร้อม Badge ที่ลอยเด่น)
       - [บล็อก 1.4] CSS STYLES (รูปแบบ CSS และตำแหน่ง Badge)

   - [บล็อก 2] LOGIC & DATABASE OPERATIONS (ระบบการทำงานและการจัดการข้อมูล)
     (ประกอบด้วย 5 หัวข้อ)
       - [บล็อก 2.1] PAGE INITIALIZATION (เริ่มต้นการทำงานเมื่อโหลดหน้าเว็บ)
       - [บล็อก 2.2] AUTOMATIC POPUP HEIGHT ADJUSTMENT (ปรับความสูง Popup อัตโนมัติ)
       - [บล็อก 2.3] FETCH ITEMS FROM SUPABASE (ดึงข้อมูลรายการจากตาราง foods)
       - [บล็อก 2.4] RENDER CONSIGNMENT VIEW (แสดงผลรายการและคำนวณ Badge จำนวน)
       - [บล็อก 2.5] ACTIONS (เปิดหน้าเพิ่มเมนูและเลือกรายการ)
  ========================================================================
-->
<!DOCTYPE html>
<html lang="th">
<head>
    <script src="appInit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>เลือกรายการ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- ----------------------------------------------------------
         BLOCK 1.4: CSS STYLES
         ---------------------------------------------------------- -->
    <style>
        html, body {
            width: 100%; height: auto;
            background-color: #ffffff; color: #1e293b;
            font-family: 'Sarabun', sans-serif; margin: 0; padding: 0; user-select: none;
            display: flex; flex-direction: column; overflow: hidden;
            border-radius: 1.5rem;
        }
        .consignment-btn {
            position: relative;
            background-color: #fffbeb;
            border: 1.5px solid #fde68a;
            color: #78350f;
            transition: all 0.2s ease;
            overflow: visible !important; /* ป้องกันไม่ให้ป้าย Badge ถูกตัดขอบ */
        }
        .consignment-btn:active { transform: scale(0.96); background-color: #fef3c7; }

        /* ปรับตำแหน่ง Badge ให้ลอยเด่นเหลื่อมขอบมุมบนขวาเหมือนรูปที่ 1 */
        .item-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background-color: #ef4444;
            color: #ffffff;
            font-weight: 800;
            font-size: 11px;
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.25);
            border: 2px solid #ffffff;
            z-index: 50;
        }
    </style>
    <!-- END BLOCK 1.4 -->
</head>
<body>

    <!-- ==========================================================
         BLOCK 1: UI COMPONENTS & LAYOUT
         ========================================================== -->

    <!-- ----------------------------------------------------------
         BLOCK 1.1: HEADER
         ---------------------------------------------------------- -->
    <div class="flex justify-between items-center px-4 py-3 border-b border-slate-100 bg-slate-50 flex-shrink-0">
        <span id="consignmentTitleHeader" class="font-extrabold text-sm text-slate-700 truncate px-2">📌 รายการฝากซื้อ</span>
        <button type="button" onclick="closePopup()" class="w-7 h-7 rounded-full bg-slate-200 hover:bg-rose-100 hover:text-rose-600 text-slate-600 flex items-center justify-center font-bold text-xs transition cursor-pointer">✕</button>
    </div>
    <!-- END BLOCK 1.1 -->

    <div class="flex flex-col space-y-3 p-3.5 px-4 bg-white w-full">

        <!-- ----------------------------------------------------------
             BLOCK 1.2: ADD NEW CONSIGNMENT ITEM
             ---------------------------------------------------------- -->
        <div id="addConsignmentSection" class="bg-amber-50 p-2.5 rounded-2xl border border-amber-200 flex flex-shrink-0">
            <button type="button" onclick="openAddNewMenuModal()" class="w-full h-10 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs rounded-xl transition cursor-pointer shadow-sm flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-circle-plus text-sm"></i> ➕ เพิ่มรายการใหม่
            </button>
        </div>
        <!-- END BLOCK 1.2 -->

        <!-- ----------------------------------------------------------
             BLOCK 1.3: CONSIGNMENT ITEMS GRID
             ---------------------------------------------------------- -->
        <div id="consignmentGrid" class="grid grid-cols-2 gap-2.5 pt-2 pr-1">
            <span class="text-slate-400 text-xs py-8 text-center col-span-2 block">⏳ กำลังโหลดรายการ...</span>
        </div>
        <!-- END BLOCK 1.3 -->

    </div>
    <!-- END BLOCK 1 -->

    <script>
        /* ==========================================================
           BLOCK 2: LOGIC & DATABASE OPERATIONS
           ========================================================== */
        let consignmentItems = [];
        let currentCart = (() => { try { const value = JSON.parse(localStorage.getItem('cart') || '[]'); return Array.isArray(value) ? value : []; } catch (error) { console.error('Invalid cart data:', error); return []; } })();
        
        const urlParams = new URLSearchParams(window.location.search);
        const targetGroupId = parseInt(urlParams.get('group_id'), 10) || 99;

        /* ----------------------------------------------------------
           BLOCK 2.1: PAGE INITIALIZATION
           ---------------------------------------------------------- */
        window.addEventListener('DOMContentLoaded', async () => {
            updateHeaderTitle();
            await fetchConsignmentItemsFromSupabase();
            updateParentHeight();
        });
        /* END BLOCK 2.1 */

        function updateHeaderTitle() {
            const titleEl = document.getElementById('consignmentTitleHeader');
            if (titleEl) {
                if (targetGroupId === 98) {
                    titleEl.textContent = '📌 เมนูพิเศษ';
                } else {
                    titleEl.textContent = '📌 รายการสินค้าฝากซื้อ';
                }
            }
        }

        window.addEventListener('message', (event) => {
            if (event.source !== window.parent || event.origin !== window.location.origin) return;
            const { type, cart } = event.data || {};
            if (type === 'UPDATE_CART_STATE' && Array.isArray(cart)) {
                currentCart = cart;
                renderConsignmentView();
            }
        });

        /* ----------------------------------------------------------
           BLOCK 2.2: AUTOMATIC POPUP HEIGHT ADJUSTMENT
           ---------------------------------------------------------- */
        let lastReportedHeight = 0;
        let resizeTimer = null;
        function updateParentHeight() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (window.parent !== window) {
                    const totalHeight = document.body.scrollHeight + 25;
                    if (Math.abs(totalHeight - lastReportedHeight) >= 2) {
                        lastReportedHeight = totalHeight;
                        window.parent.postMessage({ type: 'RESIZE_POPUP', height: totalHeight }, window.location.origin);
                    }
                }
            }, 60);
        }
        /* END BLOCK 2.2 */

        /* ----------------------------------------------------------
           BLOCK 2.3: FETCH ITEMS FROM SUPABASE
           ---------------------------------------------------------- */
        async function fetchConsignmentItemsFromSupabase() {
            try {
                if (typeof supabaseClient !== 'undefined') {
                    const { data, error } = await supabaseClient
                        .from('foods')
                        .select('*')
                        .eq('food_group_id', targetGroupId)
                        .order('food_name', { ascending: true });
                    
                    if (error) {
                        console.error("Supabase Error:", error);
                        document.getElementById('consignmentGrid').innerHTML = `<span class="text-rose-500 text-xs py-8 text-center col-span-2 block">❌ ${error.message}</span>`;
                        updateParentHeight();
                        return;
                    }

                    if (data) consignmentItems = data;
                    renderConsignmentView();
                } else {
                    document.getElementById('consignmentGrid').innerHTML = '<span class="text-rose-500 text-xs py-8 text-center col-span-2 block">⚠️ ไม่พบการเชื่อมต่อ Supabase</span>';
                    updateParentHeight();
                }
            } catch (err) {
                console.error("Error loading items:", err);
                document.getElementById('consignmentGrid').innerHTML = '<span class="text-rose-500 text-xs py-8 text-center col-span-2 block">❌ โหลดข้อมูลไม่สำเร็จ</span>';
                updateParentHeight();
            }
        }
        /* END BLOCK 2.3 */

        /* ----------------------------------------------------------
           BLOCK 2.4: RENDER CONSIGNMENT VIEW
           ---------------------------------------------------------- */
        function renderConsignmentView() {
            const grid = document.getElementById('consignmentGrid');
            grid.className = "grid grid-cols-2 gap-2.5 pt-2 pr-1";
            grid.innerHTML = '';

            updateHeaderTitle();

            if (!consignmentItems || consignmentItems.length === 0) {
                grid.innerHTML = '<span class="text-slate-400 text-xs py-8 text-center col-span-2 block">ยังไม่มีรายการ กดปุ่มเพิ่มด้านบนได้เลย</span>';
                updateParentHeight();
                return;
            }

            consignmentItems.forEach(item => {
                const matchedItems = (currentCart || []).filter(cartItem => 
                    String(cartItem.food_id) === String(item.food_id) || 
                    String(cartItem.name).trim() === String(item.food_name).trim()
                );
                const totalQty = matchedItems.reduce((sum, cartItem) => sum + (Number(cartItem.qty) || 1), 0);

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'consignment-btn py-3 px-3 rounded-2xl text-center font-bold text-xs transition cursor-pointer shadow-sm truncate';
                
                let badgeHtml = totalQty > 0 ? `<span class="item-badge">${totalQty}</span>` : '';

                btn.innerHTML = `
                    ${badgeHtml}
                    <div class="truncate">${item.food_name}</div>
                `;
                
                btn.onclick = () => selectConsignmentItem(item);
                grid.appendChild(btn);
            });

            updateParentHeight();
        }
        /* END BLOCK 2.4 */

        /* ----------------------------------------------------------
           BLOCK 2.5: ACTIONS
           ---------------------------------------------------------- */
        function openAddNewMenuModal() {
            const groupNameText = (targetGroupId === 98) ? 'เมนูพิเศษ' : 'สินค้าฝากซื้อ';
            window.parent.postMessage({
                type: 'OPEN_ADD_MENU',
                group_id: targetGroupId,
                group_name: groupNameText
            }, window.location.origin);
        }

        function selectConsignmentItem(foodObj) {
            window.parent.postMessage({
                type: 'SELECT_CONSIGNMENT_ITEM',
                food: foodObj,
                catId: targetGroupId
            }, window.location.origin);
        }

        function closePopup() {
            if (window.self !== window.top) {
                window.parent.postMessage({ type: 'CLOSE_POPUP' }, window.location.origin);
            }
        }
        /* END BLOCK 2.5 */

        /* ==========================================================
           END BLOCK 2: LOGIC & DATABASE OPERATIONS
           ========================================================== */
    </script>
</body>
</html>
