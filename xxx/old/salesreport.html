<!DOCTYPE html>
<html lang="th">
<head>
    <script src="appInit.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>รายงานการขายและการจัดการ - ลาบหนองบัวลำภู</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- ไฟล์ Initialization ของ Supabase -->
    <script src="supabaseClient.js"></script>
    <!-- FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
      :root { --bg-color: #f8fafc; }
      html, body {
        height: 100dvh; margin: 0; padding: 0;
        font-family: 'Sarabun', system-ui, -apple-system, sans-serif;
        background-color: var(--bg-color);
        touch-action: pan-y; -webkit-text-size-adjust: 100%;
        -webkit-user-select: none; user-select: none;
      }
      .app-container {
        max-width: 500px; margin: 0 auto; height: 100dvh;
        background: #ffffff; display: flex; flex-direction: column;
        box-sizing: border-box; overflow: hidden;
      }
      ::-webkit-scrollbar { display: none; }
      .tab-content { display: none; height: 100%; width: 100%; flex-direction: column; overflow: hidden; }
      .tab-content.active { display: flex; }
      .tab-btn { transition: all 0.2s ease; border: 1px solid transparent; }
      .tab-btn.tab-overview { background-color: #faf5ff; color: #7e22ce; }
      .tab-btn.tab-daily { background-color: #eff6ff; color: #1d4ed8; }
      .tab-btn.tab-group { background-color: #fdf4ff; color: #a21caf; }
      .tab-btn.active-tab {
        background-color: #ffffff !important;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        font-weight: 800; border-color: #cbd5e1; transform: scale(1.02);
      }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center antialiased">

<div class="app-container shadow-2xl w-full border border-slate-100">
    <!-- TOP HEADER & TAB BAR -->
    <header class="bg-white border-b border-slate-200 shrink-0">
        <div class="px-4 pt-3 pb-2 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-xl">📊</span>
                <h1 class="font-extrabold text-base text-slate-800 tracking-tight">รายงานการขาย</h1>
            </div>
            <a href="index.html" class="bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 px-3 py-1 rounded-lg text-xs font-bold transition flex items-center gap-1 no-underline">
                🏠 หน้าหลัก
            </a>
        </div>

        <div class="p-1.5 mx-3 mb-2 bg-slate-200/80 rounded-xl grid grid-cols-3 gap-1">
            <button type="button" onclick="switchTab('overview', this)" class="tab-btn tab-overview active-tab py-2 rounded-lg transition flex flex-col items-center justify-center gap-0.5 cursor-pointer">
                <span class="text-base">📋</span>
                <span class="text-[10px]">สรุป</span>
            </button>
            <button type="button" onclick="switchTab('daily', this)" class="tab-btn tab-daily py-2 rounded-lg transition flex flex-col items-center justify-center gap-0.5 cursor-pointer">
                <span class="text-base">📅</span>
                <span class="text-[10px]">รายวัน</span>
            </button>
            <button type="button" onclick="switchTab('groupsales', this)" class="tab-btn tab-group py-2 rounded-lg transition flex flex-col items-center justify-center gap-0.5 cursor-pointer">
                <span class="text-base">📁</span>
                <span class="text-[10px]">กลุ่ม</span>
            </button>
        </div>
    </header>

    <!-- TAB 0: สรุปยอดขายแยกตามวัน -->
    <div id="tabOverview" class="tab-content">
        <div class="p-3 bg-slate-50 border-b border-slate-100 shrink-0">
            <div class="bg-purple-50 p-2.5 rounded-xl border border-purple-100 flex justify-between items-center">
                <span class="text-xs font-bold text-purple-900">📅 สรุปยอดขายย้อนหลัง 15 วัน</span>
                <span id="overviewTotalBillCount" class="text-xs font-extrabold text-purple-700 bg-white px-2 py-0.5 rounded-md border border-purple-200">0 วัน</span>
            </div>
        </div>
        <div id="overviewDateListContainer" class="p-3 overflow-y-auto space-y-2.5 bg-slate-100 flex-1" style="-webkit-overflow-scrolling: touch;">
            <div class="text-center text-slate-400 py-10 text-xs font-medium">⏳ กำลังโหลดสรุปยอดขาย...</div>
        </div>
    </div>

    <!-- TAB 1: รายงานออร์เดอร์รายวัน -->
    <div id="tabDaily" class="tab-content">
        <div class="p-3 bg-slate-50 border-b border-slate-100 space-y-2 shrink-0">
            <div class="bg-blue-50 p-2 rounded-xl border border-blue-100 flex items-center justify-between">
                <span class="text-xs font-bold text-blue-900">📅 เลือกวันที่:</span>
                <button type="button" onclick="openCalendar()" class="px-3 py-1 border border-slate-200 rounded-lg text-xs font-bold bg-white text-blue-700 shadow-xs flex items-center gap-1 cursor-pointer">
                    <span id="txtDailyDate" class="font-bold text-blue-600">--/--/----</span>
                </button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div class="bg-white p-2 rounded-lg border border-slate-200 shadow-xs">
                    <div class="text-[10px] text-slate-500 font-bold">จำนวนบิลวันนี้</div>
                    <div class="text-xs font-black text-slate-800" id="dailySummaryCount">0 บิล</div>
                </div>
                <div class="bg-emerald-50 p-2 rounded-lg border border-emerald-200 shadow-xs">
                    <div class="text-[10px] text-emerald-700 font-bold">ยอดขายรวมสุทธิ</div>
                    <div class="text-xs font-black text-emerald-600" id="dailySummaryTotal">0 บาท</div>
                </div>
            </div>
        </div>
        <div class="p-3 overflow-y-auto space-y-3 bg-slate-100 flex-1" id="dailyOrdersContainer" style="-webkit-overflow-scrolling: touch;"></div>
    </div>

    <!-- TAB 2: ยอดขายแยกตามกลุ่มลูกค้า -->
    <div id="tabGroupSales" class="tab-content">
        <div class="p-3 bg-slate-50 border-b border-slate-100 shrink-0 space-y-2.5">
            <div class="bg-emerald-50 p-2 rounded-xl border border-emerald-100 flex items-center justify-between">
                <span class="text-xs font-bold text-emerald-900">📅 วันที่ดูยอดขาย:</span>
                <button type="button" onclick="openCalendar()" class="px-3 py-1 border border-slate-200 rounded-lg text-xs font-bold bg-white text-emerald-700 shadow-xs flex items-center gap-1 cursor-pointer">
                    <span id="txtGroupDate" class="font-bold text-emerald-600">--/--/----</span>
                </button>
            </div>
            <div id="groupHeaderSummaryBox"></div>
        </div>
        <div id="groupSummaryContainer" class="p-3 overflow-y-auto space-y-3 bg-slate-100 flex-1" style="-webkit-overflow-scrolling: touch;">
            <div class="text-center text-slate-400 py-10 text-xs font-medium">กำลังโหลดข้อมูลยอดขาย...</div>
        </div>
    </div>
</div>

<!-- MODAL: รายละเอียดกลุ่มในแท็บกลุ่มลูกค้า -->
<div id="groupDetailModal" onclick="handleOutsideModalClick(event)" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl flex flex-col max-h-[80vh] overflow-hidden transform scale-95 transition-transform duration-200" id="groupDetailBox">
        <div class="bg-slate-800 text-white p-4 flex justify-between items-center">
            <div>
                <h3 id="modalGroupName" class="font-extrabold text-sm text-amber-400">กลุ่มลูกค้า</h3>
                <p id="modalGroupMeta" class="text-[11px] text-slate-300 mt-0.5">จำนวน 0 บิล</p>
            </div>
            <button type="button" onclick="closeGroupModal()" class="bg-slate-700 hover:bg-slate-600 text-white w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold cursor-pointer">✕</button>
        </div>
        <div id="modalOrderList" class="p-4 overflow-y-auto space-y-3 flex-1 bg-slate-100"></div>
        <div class="p-3 bg-white border-t border-slate-100 flex justify-between items-center px-4">
            <span class="text-xs font-bold text-slate-600">ยอดรวมของกลุ่มนี้:</span>
            <span id="modalGroupTotal" class="text-sm font-black text-emerald-600">฿0.-</span>
        </div>
    </div>
</div>

<!-- MODAL: ปฏิทินเลือกวันที่ -->
<div id="calendarModal" onclick="handleCalendarOutsideClick(event)" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="bg-white w-full max-w-xs rounded-2xl shadow-2xl overflow-hidden relative flex flex-col transform scale-95 transition-transform duration-200" id="calendarBox">
        <div class="bg-slate-800 text-white p-3 flex justify-between items-center">
            <h3 class="text-xs font-bold text-amber-400">📅 เลือกวันที่</h3>
            <button type="button" onclick="closeCalendarModal()" class="w-7 h-7 rounded-full bg-slate-700 text-white flex items-center justify-center font-bold text-xs cursor-pointer">✕</button>
        </div>
        <iframe id="calendarIframe" src="" class="w-full h-[380px] border-none"></iframe>
    </div>
</div>

<script>
    let db;
    let allOrdersCache = [];
    let locationsCache = [];
    let fetchedDatesSet = new Set();
    let currentActiveTab = 'overview';
    let currentSelectedDate = '';
    let globalGroupData = {};

    function getTodayString() {
        const d = new Date();
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function getOrderDateStr(order) {
        const rawDate = order.created_at || order.order_date || order.date || '';
        if (!rawDate) return '';
        return String(rawDate).split('T')[0].split(' ')[0];
    }

    function formatDateThai(dateString) {
        if (!dateString) return '';
        const parts = dateString.split('-');
        if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
        return dateString;
    }

    window.onload = async function() {
        currentSelectedDate = getTodayString();
        updateDateDisplays();

        if (typeof window.supabaseClient !== 'undefined') db = window.supabaseClient;
        else if (typeof supabaseClient !== 'undefined') db = supabaseClient;

        await fetchMasterData();
        await fetchInitialOrders();
    };

    function normalizeOrder(order) {
        let items = [];
        if (typeof order.items === 'string') {
            try { items = JSON.parse(order.items); } catch(e) { items = []; }
        } else if (Array.isArray(order.items)) {
            items = order.items;
        }

        let computedItems = items.map(item => {
            let q = Number(item.qty || item.quantity || 1);
            let unitPrice = Number(item.price || item.unit_price || 0);
            let itemTotal = Number(item.total_price || item.sum || (unitPrice * q));
            let name = item.name || item.food_name || '';
            
            let rawNote = item.note || item.comment || item.remark || item.details || item.option || item.note_text || item.topping || item.extras || '';
            
            let friedEgg = Number(item.friedEggQty || item.khaiDaoQty || item.fried_egg || item.egg_dao || 0);
            if (friedEgg > 0) {
                let eggText = `ไข่ดาว ${friedEgg}`;
                rawNote = rawNote ? `${rawNote}, ${eggText}` : eggText;
            }

            let omelet = Number(item.omeletQty || item.khaiJiaoQty || item.omelet || item.egg_jiao || 0);
            if (omelet > 0) {
                let jiaoText = `ไข่เจียว ${omelet}`;
                rawNote = rawNote ? `${rawNote}, ${jiaoText}` : jiaoText;
            }

            if (!rawNote && item.selectedOptions) {
                if (typeof item.selectedOptions === 'string') rawNote = item.selectedOptions;
                else if (Array.isArray(item.selectedOptions)) rawNote = item.selectedOptions.join(', ');
            }
            
            if (!rawNote && Array.isArray(item.options)) {
                rawNote = item.options.map(opt => opt.name || opt).join(', ');
            }

            if (!rawNote && item.selectedToppings) {
                if (Array.isArray(item.selectedToppings)) {
                    rawNote = item.selectedToppings.map(t => t.name || t).join(', ');
                }
            }

            if (name.includes('(') && name.includes(')')) {
                const match = name.match(/^(.*?)\s*\((.*?)\)$/);
                if (match) {
                    name = match[1].trim();
                    let bracketNote = match[2].trim();
                    rawNote = rawNote ? `${rawNote}, ${bracketNote}` : bracketNote;
                }
            }

            let note = '';
            if (rawNote) {
                if (typeof rawNote === 'string') {
                    note = rawNote.trim();
                } else if (typeof rawNote === 'object') {
                    note = JSON.stringify(rawNote);
                }
            }

            return { name: name || 'รายการ', qty: q, unitPrice, totalPrice: itemTotal, note };
        });

        let deliveryFee = Number(order.delivery_fee || 0);
        let subtotal = computedItems.reduce((sum, item) => sum + item.totalPrice, 0);
        let billTotal = Number(order.total_price || order.subtotal || 0);
        
        if (billTotal === 0 && subtotal > 0) {
            billTotal = subtotal + deliveryFee;
        }

        let groupTypeName = "ชาวบ้าน";
        let typeId = Number(order.customer_type_id);
        if (typeId === 2) {
            let locName = "";
            if (order.location_id) {
                const foundLoc = locationsCache.find(l => String(l.location_id) === String(order.location_id));
                if (foundLoc) locName = foundLoc.location_name;
            }
            groupTypeName = locName ? locName : "นักท่องเที่ยว";
        } else if (typeId === 3) {
            groupTypeName = "สบายดี";
        }

        return {
            ...order,
            parsedItems: computedItems,
            computedTotal: billTotal,
            deliveryFee: deliveryFee,
            groupTypeName,
            dateStr: getOrderDateStr(order)
        };
    }

    async function fetchMasterData() {
        if (!db) return;
        try {
            const locRes = await db.from('locations').select('*').order('location_name', { ascending: true });
            if (locRes.data) locationsCache = locRes.data;
        } catch (err) { console.error("Error fetching locations:", err); }
    }

    async function fetchInitialOrders() {
        if (!db) return;
        
        const pastDate = new Date();
        pastDate.setDate(pastDate.getDate() - 15);
        const pastDateStr = pastDate.toISOString().split('T')[0] + 'T00:00:00';
        
        const { data, error } = await db.from('orders')
            .select('*')
            .gte('created_at', pastDateStr)
            .order('order_id', { ascending: true });

        if (error) { console.error("Error fetching initial orders:", error); return; }
        
        const normalized = (data || []).map(o => normalizeOrder(o));
        normalized.forEach(o => { if (o.dateStr) fetchedDatesSet.add(o.dateStr); });
        allOrdersCache = normalized;
        
        switchTab(currentActiveTab, document.querySelector('.tab-btn.active-tab'));
    }

    async function ensureOrdersForDate(targetDateStr) {
        if (!db || fetchedDatesSet.has(targetDateStr)) return;

        if (currentActiveTab === 'daily') {
            document.getElementById('dailyOrdersContainer').innerHTML = `<div class="text-center text-slate-400 py-10 text-xs font-medium">⏳ กำลังค้นหาออร์เดอร์ของวันที่ ${formatDateThai(targetDateStr)}...</div>`;
        } else if (currentActiveTab === 'groupsales') {
            document.getElementById('groupSummaryContainer').innerHTML = `<div class="text-center text-slate-400 py-10 text-xs font-medium">⏳ กำลังค้นหาออร์เดอร์ของวันที่ ${formatDateThai(targetDateStr)}...</div>`;
        }

        const startStr = `${targetDateStr}T00:00:00`;
        const endStr = `${targetDateStr}T23:59:59.999`;

        const { data, error } = await db.from('orders')
            .select('*')
            .gte('created_at', startStr)
            .lte('created_at', endStr)
            .order('order_id', { ascending: true });

        if (!error && data) {
            const newOrders = data.map(o => normalizeOrder(o));
            newOrders.forEach(no => {
                const idKey = no.order_id || no.id;
                if (!allOrdersCache.some(o => (o.order_id || o.id) === idKey)) {
                    allOrdersCache.push(no);
                }
            });
        }
        
        fetchedDatesSet.add(targetDateStr);
    }

    function updateDateDisplays() {
        const text = formatDateThai(currentSelectedDate);
        if (document.getElementById('txtDailyDate')) document.getElementById('txtDailyDate').textContent = text;
        if (document.getElementById('txtGroupDate')) document.getElementById('txtGroupDate').textContent = text;
    }

    async function switchTab(tabName, btnEl) {
        currentActiveTab = tabName;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active-tab'));
        if (btnEl) btnEl.classList.add('active-tab');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        if (tabName === 'overview') {
            document.getElementById('tabOverview').classList.add('active');
            renderOverviewData();
        } else if (tabName === 'daily') {
            document.getElementById('tabDaily').classList.add('active');
            await ensureOrdersForDate(currentSelectedDate);
            filterDailyOrders();
        } else if (tabName === 'groupsales') {
            document.getElementById('tabGroupSales').classList.add('active');
            await ensureOrdersForDate(currentSelectedDate);
            renderGroupSalesData();
        }
    }

    function openCalendar() {
        const iframe = document.getElementById('calendarIframe');
        const countsMap = {};
        allOrdersCache.forEach(item => {
            const d = item.dateStr;
            if (d) countsMap[d] = (countsMap[d] || 0) + 1;
        });
        sessionStorage.setItem('calendarEventsData', JSON.stringify(countsMap));
        iframe.src = 'calendar.html';
        
        const modal = document.getElementById('calendarModal');
        modal.classList.remove('opacity-0', 'pointer-events-none');
        document.getElementById('calendarBox').classList.remove('scale-95');
    }

    function closeCalendarModal() {
        const modal = document.getElementById('calendarModal');
        modal.classList.add('opacity-0', 'pointer-events-none');
        document.getElementById('calendarBox').classList.add('scale-95');
        setTimeout(() => { document.getElementById('calendarIframe').src = ''; }, 200);
    }

    function handleCalendarOutsideClick(e) {
        if (e.target.id === 'calendarModal') closeCalendarModal();
    }

    window.addEventListener('message', async function(event) {
        if (!event.data || typeof event.data !== 'object') return;
        if (event.data.action === 'SELECT_DATE' || event.data.selectedDate) {
            const selectedDateStr = event.data.selectedDate || event.data.date;
            if (selectedDateStr) {
                currentSelectedDate = selectedDateStr;
                updateDateDisplays();
                
                await ensureOrdersForDate(currentSelectedDate);
                
                if (currentActiveTab === 'daily') filterDailyOrders();
                else if (currentActiveTab === 'groupsales') renderGroupSalesData();
            }
            closeCalendarModal();
        }
        if (event.data.action === 'CLOSE_MODAL') closeCalendarModal();
    });

    function renderOverviewData() {
        const container = document.getElementById('overviewDateListContainer');
        if (!container) return;
        if (allOrdersCache.length === 0) {
            container.innerHTML = `<div class="text-center text-slate-400 py-10 text-xs font-medium">📭 ไม่พบข้อมูลออร์เดอร์ในช่วง 15 วันที่ผ่านมา</div>`;
            document.getElementById('overviewTotalBillCount').textContent = '0 วัน';
            return;
        }

        let dateGroups = {};
        allOrdersCache.forEach(order => {
            let dateStr = order.dateStr;
            if (!dateStr) return;
            if (!dateGroups[dateStr]) dateGroups[dateStr] = { totalAmount: 0, count: 0 };

            dateGroups[dateStr].totalAmount += order.computedTotal;
            dateGroups[dateStr].count += 1;
        });

        let sortedDates = Object.keys(dateGroups).sort((a, b) => b.localeCompare(a));
        document.getElementById('overviewTotalBillCount').textContent = `${sortedDates.length} วัน`;

        container.innerHTML = sortedDates.map(dateStr => {
            const data = dateGroups[dateStr];
            return `
                <div onclick="goToDailyTab('${dateStr}')" class="bg-white p-3.5 rounded-xl border border-slate-200 hover:border-purple-400 active:scale-95 transition cursor-pointer shadow-xs flex justify-between items-center">
                    <div>
                        <div class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                            <span>📅 วันที่:</span> <span class="text-purple-700 font-extrabold">${formatDateThai(dateStr)}</span>
                        </div>
                        <div class="text-[11px] text-slate-500 mt-1">จำนวนบิล: <span class="font-bold text-slate-700">${data.count} บิล</span></div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs font-black text-emerald-600">฿${data.totalAmount.toLocaleString()}.-</div>
                        <div class="text-[10px] text-slate-400 mt-0.5">แตะเพื่อดูบิลประจำวัน 🔍</div>
                    </div>
                </div>`;
        }).join('');
    }

    function goToDailyTab(dateStr) {
        currentSelectedDate = dateStr;
        updateDateDisplays();
        switchTab('daily', document.querySelector('.tab-btn.tab-daily'));
    }

    function filterDailyOrders() {
        const container = document.getElementById('dailyOrdersContainer');
        if (!container) return;
        container.innerHTML = '';

        let filtered = allOrdersCache.filter(o => o.dateStr === currentSelectedDate);
        filtered.sort((a, b) => new Date(a.created_at || 0) - new Date(b.created_at || 0));

        if (filtered.length === 0) {
            container.innerHTML = `<div class="text-center text-xs text-slate-400 py-8 font-medium">📭 ไม่พบออร์เดอร์ในวันที่ ${formatDateThai(currentSelectedDate)}</div>`;
            document.getElementById('dailySummaryCount').textContent = '0 บิล';
            document.getElementById('dailySummaryTotal').textContent = '0 บาท';
            return;
        }

        let total = 0;
        filtered.forEach(order => {
            total += order.computedTotal;

            let itemsHtml = order.parsedItems.map(item => {
                let comment = item.note ? ` <span class="text-amber-800 font-semibold bg-amber-50 px-1.5 py-0.5 rounded text-[11px]">(${item.note})</span>` : '';
                return `<tr class="border-b border-slate-100">
                    <td class="p-1.5 text-xs text-slate-800 font-medium">${item.name}${comment}</td>
                    <td class="p-1.5 text-xs text-center font-bold">x${item.qty}</td>
                    <td class="p-1.5 text-xs text-right font-bold text-blue-600">${item.totalPrice.toLocaleString()}.-</td>
                </tr>`;
            }).join('');

            if (order.deliveryFee > 0) {
                itemsHtml += `<tr class="border-b border-slate-100 bg-amber-50/60">
                    <td class="p-1.5 text-xs text-amber-900 font-bold flex items-center gap-1"><span>🛵</span><span>ค่าบริการจัดส่ง</span></td>
                    <td class="p-1.5 text-xs text-center font-bold text-amber-900">-</td>
                    <td class="p-1.5 text-xs text-right font-bold text-amber-900">${order.deliveryFee.toLocaleString()}.-</td>
                </tr>`;
            }

            let orderId = order.order_id || order.id;

            container.innerHTML += `
                <div onclick="goToEditOrder(${orderId})" class="bg-white border border-slate-200 hover:border-amber-400 rounded-xl p-3 shadow-xs space-y-2 cursor-pointer transition active:scale-95">
                    <div class="flex justify-between border-b border-slate-100 pb-2">
                        <span class="font-bold text-xs text-amber-900 bg-amber-100 px-2.5 py-0.5 rounded">${order.groupTypeName} ✏️</span>
                        <span class="text-xs font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded truncate max-w-[200px]">👤 ${order.customer_name || order.groupTypeName}</span>
                    </div>
                    <table class="w-full text-left"><tbody>${itemsHtml}</tbody></table>
                    <div class="flex justify-between pt-1 text-xs font-bold border-t border-slate-100">
                        <span>ยอดรวม:</span>
                        <span class="text-emerald-600 text-sm font-black">${order.computedTotal.toLocaleString()} บาท</span>
                    </div>
                </div>`;
        });

        document.getElementById('dailySummaryCount').textContent = `${filtered.length} บิล`;
        document.getElementById('dailySummaryTotal').textContent = `${total.toLocaleString()} บาท`;
    }

    function renderGroupSalesData() {
        const headerBox = document.getElementById('groupHeaderSummaryBox');
        const container = document.getElementById('groupSummaryContainer');
        if (!container || !headerBox) return;

        let filteredOrders = allOrdersCache.filter(o => o.dateStr === currentSelectedDate);
        if (filteredOrders.length === 0) {
            headerBox.innerHTML = `<div class="bg-slate-800 text-white p-3.5 rounded-xl shadow-xs"><div class="text-[11px] text-slate-300">ยอดขายรวม (${formatDateThai(currentSelectedDate)})</div><div class="text-xl font-black text-emerald-400">฿0.-</div><div class="text-[11px] text-slate-300 mt-1">จำนวนบิล: 0 บิล</div></div>`;
            container.innerHTML = `<div class="text-center text-slate-400 py-12 text-xs font-medium">📭 ไม่พบข้อมูลการขาย</div>`;
            return;
        }

        globalGroupData = {};
        let grandTotalOrders = 0, grandTotalPrice = 0;

        filteredOrders.forEach(order => {
            let groupKey = order.groupTypeName;

            if (!globalGroupData[groupKey]) globalGroupData[groupKey] = { orderCount: 0, totalPrice: 0, orders: [] };

            globalGroupData[groupKey].orderCount += 1;
            globalGroupData[groupKey].totalPrice += order.computedTotal;
            globalGroupData[groupKey].orders.push(order);

            grandTotalOrders += 1;
            grandTotalPrice += order.computedTotal;
        });

        headerBox.innerHTML = `<div class="bg-slate-800 text-white p-3.5 rounded-xl shadow-xs"><div class="text-[11px] text-slate-300">ยอดขายรวม (${formatDateThai(currentSelectedDate)})</div><div class="text-xl font-black text-emerald-400">฿${grandTotalPrice.toLocaleString()}.-</div><div class="text-[11px] text-slate-300 mt-1">จำนวนบิล: <span class="text-white font-bold">${grandTotalOrders} บิล</span></div></div>`;

        let html = '';
        for (let [groupName, data] of Object.entries(globalGroupData)) {
            html += `
                <div onclick="openGroupModal('${groupName}')" class="bg-white border border-slate-200 hover:border-blue-400 active:scale-95 cursor-pointer transition rounded-xl p-3.5 flex justify-between items-center shadow-xs">
                    <div>
                        <div class="font-bold text-xs text-slate-800 flex items-center gap-1.5">
                            <span>👥 กลุ่ม:</span> <span class="text-blue-600 font-extrabold truncate max-w-[180px]">${groupName}</span>
                        </div>
                        <div class="text-[11px] text-slate-500 mt-1">จำนวนบิล: <span class="font-bold text-slate-700">${data.orderCount} บิล</span> <span class="text-blue-500 ml-1 font-semibold">(ดูรายละเอียด 🔍)</span></div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs font-black text-emerald-600">฿${data.totalPrice.toLocaleString()}.-</div>
                        <div class="text-[10px] text-slate-400 mt-0.5">กดเพื่อเปิดบิล</div>
                    </div>
                </div>`;
        }
        container.innerHTML = html;
    }

    function openGroupModal(groupName) {
        const group = globalGroupData[groupName];
        if (!group) return;

        document.getElementById('modalGroupName').textContent = `👥 กลุ่ม: ${groupName}`;
        document.getElementById('modalGroupMeta').textContent = `จำนวนบิลทั้งหมด: ${group.orderCount} บิล`;
        document.getElementById('modalGroupTotal').textContent = `฿${group.totalPrice.toLocaleString()}.-`;

        let listHtml = '';
        group.orders.forEach(o => {
            let itemsHtml = '';
            o.parsedItems.forEach(item => {
                let comment = item.note ? ` <span class="text-amber-800 font-semibold bg-amber-50 px-1.5 py-0.5 rounded text-[10px]">(${item.note})</span>` : '';
                itemsHtml += `<div class="text-[11px] flex justify-between items-start text-slate-600 py-1 border-b border-slate-100 last:border-none">
                    <div><span class="font-medium text-slate-800">• ${item.name}${comment}</span> <span class="text-blue-600 font-bold ml-1">x${item.qty}</span></div>
                    <span class="font-bold text-slate-700 shrink-0 ml-2">฿${item.totalPrice.toLocaleString()}</span>
                </div>`;
            });

            if (o.deliveryFee > 0) {
                itemsHtml += `<div class="text-[11px] flex justify-between items-center text-amber-900 py-1 bg-amber-50/60 px-1 rounded border-b border-slate-100">
                    <div><span class="font-bold">🛵 ค่าบริการจัดส่ง</span></div>
                    <span class="font-bold shrink-0 ml-2">฿${o.deliveryFee.toLocaleString()}</span>
                </div>`;
            }

            let orderId = o.order_id || o.id;
            listHtml += `
                <div onclick="goToEditOrder(${orderId})" class="bg-white p-3 rounded-xl border border-slate-200 hover:border-amber-400 shadow-xs space-y-2 cursor-pointer transition active:scale-95">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                        <span class="font-bold text-xs text-amber-900 bg-amber-100 px-2.5 py-0.5 rounded">${groupName} ✏️</span>
                        <span class="text-xs font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded truncate max-w-[200px]">👤 ${o.customer_name || groupName}</span>
                    </div>
                    <div class="space-y-1">${itemsHtml}</div>
                    <div class="flex justify-between pt-1 text-xs font-bold border-t border-slate-100">
                        <span>ยอดรวม:</span>
                        <span class="text-emerald-600 text-sm font-black">฿${o.computedTotal.toLocaleString()}.-</span>
                    </div>
                </div>`;
        });

        document.getElementById('modalOrderList').innerHTML = listHtml;
        const modal = document.getElementById('groupDetailModal');
        modal.classList.remove('opacity-0', 'pointer-events-none');
        document.getElementById('groupDetailBox').classList.remove('scale-95');
    }

    function closeGroupModal() {
        const modal = document.getElementById('groupDetailModal');
        modal.classList.add('opacity-0', 'pointer-events-none');
        document.getElementById('groupDetailBox').classList.add('scale-95');
    }

    function handleOutsideModalClick(e) {
        if (e.target.id === 'groupDetailModal') closeGroupModal();
    }

    function goToEditOrder(orderId) {
        window.location.href = `editorder.html?order_id=${orderId}`;
    }
</script>
</body>
</html>
