<!DOCTYPE html>
<html lang="th">
<head>
    <script src="appInit.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>ระบบจัดการและเปรียบเทียบราคาร้านค้า - ลาบหนองบัวลำภู</title>
    <!-- โหลด Supabase JS Client (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- โหลดไฟล์เชื่อมต่อ Supabase ของคุณ -->
    <script src="supabaseClient.js"></script>
    <style>
      :root { --bg-color: #ffffff; }
      html, body {
        height: 100dvh; margin: 0; padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color); color: #333;
        touch-action: pan-y; -webkit-text-size-adjust: 100%;
        -webkit-user-select: none; user-select: none;
        overflow: hidden; /* ป้องกันหน้าจอภาพรวมเลื่อน */
      }

      .app-container {
        max-width: 500px; margin: 0 auto; height: 100dvh;
        background: #ffffff; display: flex; flex-direction: column;
        box-sizing: border-box; overflow: hidden; padding: 10px;
      }

      /* แถบหัวข้อด้านบน (ฟิกซ์อยู่กับที่) */
      .header-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        gap: 10px;
        flex-shrink: 0;
      }

      .btn-back {
        background-color: #e11d48;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        text-decoration: none;
        transition: background-color 0.2s, transform 0.1s;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }
      .btn-back:hover { background-color: #be123c; }
      .btn-back:active { transform: scale(0.98); }

      .page-title {
        font-size: 15px;
        font-weight: bold;
        color: #1e293b;
        margin: 0;
      }
      
      /* พื้นที่ตารางที่ให้เลื่อนเฉพาะข้อมูลราคา */
      .table-container { 
        flex: 1;
        width: 100%;
        overflow: auto; 
        background: white; 
        border-top: 1px solid #b0bec5;
        border-bottom: 1px solid #b0bec5;
        min-height: 0;
        position: relative;
        -webkit-overflow-scrolling: touch;
      }
      
      table { 
        width: max-content; 
        border-collapse: collapse; 
        font-size: 13px; 
        white-space: nowrap;
      }
      
      th, td { 
        border: 1px solid #b0bec5; 
        padding: 8px 6px; 
        text-align: center; 
        background-color: #ffffff;
      }
      
      /* ล็อกหัวตารางให้อยู่ด้านบนสุดเวลาเลื่อนแนวตั้ง */
      th { 
        background-color: #343a40; 
        color: white; 
        font-weight: 600; 
        position: sticky; 
        top: 0; 
        z-index: 20; 
      }
      
      /* ล็อกคอลัมน์แรก (ชื่อรายการ) ให้อยู่กับที่เวลาเลื่อนแนวนอน */
      td.product-name, th.product-header { 
        position: sticky; 
        left: 0; 
        z-index: 10; 
        background-color: #f1f3f5; 
        text-align: left; 
        font-weight: bold; 
        width: auto;
        max-width: 250px;
      }
      
      th.product-header {
        z-index: 30; /* สูงสุดเพื่อให้ทับมุมซ้ายบนตอนเลื่อน */
        background-color: #343a40;
        color: white;
      }

      input[type="number"] { 
        width: 45px; 
        padding: 4px 2px; 
        text-align: right; 
        border: none; 
        background: transparent; 
        font-size: 13px; 
        font-family: inherit;
      }
      input[type="number"]:focus { 
        outline: 2px solid #007bff; 
        background-color: #e3f2fd; 
      }
      
      .best-price-cell { background-color: #d4edda !important; color: #155724; font-weight: bold; }

      /* ฟอร์มเพิ่มข้อมูลด้านล่าง (ฟิกซ์อยู่กับที่ด้านล่างจอ) */
      .action-container { 
        display: grid; 
        grid-template-columns: 1fr 1fr; 
        gap: 10px; 
        margin-top: 10px; 
        width: 100%;
        box-sizing: border-box;
        flex-shrink: 0;
      }

      .action-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .action-container input { 
        width: 100%; 
        padding: 8px 10px; 
        border: 1px solid #ced4da; 
        border-radius: 4px; 
        font-size: 13px; 
        outline: none; 
        background: white;
        box-sizing: border-box;
      }
      .action-container input:focus { 
        border-color: #80bdff; 
        box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25); 
      }
      
      .btn { 
        padding: 8px 12px; 
        border: none; 
        border-radius: 4px; 
        cursor: pointer; 
        font-weight: bold; 
        color: white; 
        text-align: center;
        width: 100%;
        font-size: 13px;
      }
      .btn-green { background-color: #28a745; }
      .btn-green:hover { background-color: #218838; }
      .btn-blue { background-color: #007bff; }
      .btn-blue:hover { background-color: #0056b3; }

      .loading { text-align: center; font-size: 15px; color: #555; margin-top: 30px; }
      .status-msg { text-align: center; font-size: 12px; height: 16px; font-weight: bold; flex-shrink: 0; margin-top: 4px; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- แถบด้านบนสำหรับปุ่มย้อนกลับและชื่อหน้า (ตรึงนิ่ง) -->
    <div class="header-bar">
        <!-- เปลี่ยนลิงก์กลับไปที่หน้า index_admin.html -->
        <button class="btn-back" onclick="window.location.href='index_admin.html'">
            ⬅️ กลับหน้าผู้ดูแลระบบ
        </button>
        <span class="page-title">💰 จัดการต้นทุน</span>
    </div>

    <div id="loading" class="loading">กำลังโหลดข้อมูลตาราง...</div>
    <div id="statusMsg" class="status-msg"></div>
    
    <!-- ตารางแสดงผลที่เลื่อนเฉพาะข้างในกรอบ -->
    <div class="table-container" id="tableScrollWrapper" style="display: none;">
        <table id="priceTable">
            <thead>
                <tr id="tableHeader">
                    <th class="product-header">รายการ</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- ข้อมูลสินค้าจะถูกเติมที่นี่ -->
            </tbody>
        </table>
    </div>

    <!-- ฟอร์มเพิ่มข้อมูลด้านล่าง (ตรึงนิ่ง) -->
    <div class="action-container">
        <div class="action-group">
            <input type="text" id="newProductName" placeholder="ชื่อสินค้าใหม่...">
            <button class="btn btn-green" id="btnAddProduct">+ เพิ่มสินค้า</button>
        </div>
        <div class="action-group">
            <input type="text" id="newSupplierName" placeholder="ชื่อร้านค้าใหม่...">
            <button class="btn btn-blue" id="btnAddSupplier">+ เพิ่มร้านค้า</button>
        </div>
    </div>
</div>

<script>
    async function initApp() {
        const loadingEl = document.getElementById('loading');
        const statusMsg = document.getElementById('statusMsg');
        const tableWrapper = document.getElementById('tableScrollWrapper');
        const headerRow = document.getElementById('tableHeader');
        const tableBody = document.getElementById('tableBody');

        try {
            const db = window.supabaseClient || window.supabase || window._supabase;
            
            if (!db || typeof db.from !== 'function') {
                throw new Error('ไม่พบตัวแปร window.supabaseClient กรุณาตรวจสอบการโหลดไฟล์ supabaseClient.js');
            }

            async function loadData() {
                loadingEl.style.display = 'block';
                tableWrapper.style.display = 'none';

                const { data: suppliers, error: supError } = await db
                    .from('cost_suppliers')
                    .select('*')
                    .order('id', { ascending: true });
                if (supError) throw supError;

                const { data: products, error: prodError } = await db
                    .from('cost_products')
                    .select('*')
                    .order('name', { ascending: true });
                if (prodError) throw prodError;

                const { data: prices, error: priceError } = await db
                    .from('cost_product_prices')
                    .select('*');
                if (priceError) console.warn('ดึงราคาเก่าไม่ได้:', priceError.message);

                const priceMap = {};
                if (prices) {
                    prices.forEach(p => {
                        priceMap[`${p.product_id}-${p.supplier_id}`] = p.price;
                    });
                }

                headerRow.innerHTML = '<th class="product-header">รายการ</th>';
                suppliers.forEach(supplier => {
                    const th = document.createElement('th');
                    th.textContent = supplier.name;
                    headerRow.appendChild(th);
                });
                const thSummary = document.createElement('th');
                thSummary.textContent = '🏆 ร้านที่ถูกที่สุด';
                headerRow.appendChild(thSummary);

                function updateBestPriceRow(productId) {
                    let minPrice = Infinity;
                    let cheapestSupplier = '-';

                    suppliers.forEach(supplier => {
                        const inputEl = document.getElementById(`input-${productId}-${supplier.id}`);
                        if (!inputEl) return;
                        const val = parseFloat(inputEl.value);
                        
                        const tdParent = inputEl.parentElement;
                        tdParent.style.backgroundColor = '#ffffff';
                        
                        if (!isNaN(val) && val > 0) {
                            if (val < minPrice) {
                                minPrice = val;
                                cheapestSupplier = supplier.name;
                            }
                        }
                    });

                    const summaryCell = document.getElementById(`summary-${productId}`);
                    if (summaryCell && minPrice !== Infinity) {
                        summaryCell.innerHTML = `⭐ <b>${cheapestSupplier}</b> (${minPrice.toLocaleString()} บาท)`;
                        summaryCell.className = "best-price-cell";
                        
                        suppliers.forEach(supplier => {
                            const inputEl = document.getElementById(`input-${productId}-${supplier.id}`);
                            if (!inputEl) return;
                            const val = parseFloat(inputEl.value);
                            if (val === minPrice) {
                                inputEl.parentElement.style.backgroundColor = '#d4edda';
                            }
                        });
                    } else if (summaryCell) {
                        summaryCell.textContent = '-';
                        summaryCell.className = "";
                    }
                }

                tableBody.innerHTML = '';
                if (products.length === 0 || suppliers.length === 0) {
                    const tr = document.createElement('tr');
                    const td = document.createElement('td');
                    td.colSpan = suppliers.length + 2;
                    td.style.textAlign = 'center';
                    td.style.color = '#777';
                    td.textContent = '⚠️ ยังไม่มีข้อมูลสินค้าหรือร้านค้า กรุณาเพิ่มข้อมูลด้านล่างก่อนครับ';
                    tr.appendChild(td);
                    tableBody.appendChild(tr);
                } else {
                    products.forEach(product => {
                        const tr = document.createElement('tr');

                        const tdProd = document.createElement('td');
                        tdProd.textContent = product.name;
                        tdProd.className = "product-name";
                        tr.appendChild(tdProd);

                        suppliers.forEach(supplier => {
                            const td = document.createElement('td');
                            const input = document.createElement('input');
                            input.type = 'number';
                            input.step = 'any';
                            input.placeholder = '0.00';
                            input.id = `input-${product.id}-${supplier.id}`;
                            
                            const mapKey = `${product.id}-${supplier.id}`;
                            if (priceMap[mapKey] !== undefined && priceMap[mapKey] !== null) {
                                input.value = priceMap[mapKey];
                            }

                            input.addEventListener('focus', function() {
                                if (this.value === '0' || this.value === '0.00') {
                                    this.value = '';
                                }
                                setTimeout(() => { this.select(); }, 0);
                            });

                            input.addEventListener('change', async (e) => {
                                const val = e.target.value;
                                statusMsg.style.color = '#e67e22';
                                statusMsg.textContent = 'กำลังบันทึกราคา...';

                                try {
                                    const { error: saveError } = await db
                                        .from('cost_product_prices')
                                        .upsert({
                                            product_id: product.id,
                                            supplier_id: supplier.id,
                                            price: val === '' ? null : parseFloat(val)
                                        }, { onConflict: 'product_id,supplier_id' });

                                    if (saveError) throw saveError;

                                    statusMsg.style.color = '#27ae60';
                                    statusMsg.textContent = 'บันทึกสำเร็จ!';
                                    setTimeout(() => { statusMsg.textContent = ''; }, 1500);

                                    updateBestPriceRow(product.id);
                                } catch (err) {
                                    console.error('บันทึกไม่สำเร็จ:', err);
                                    statusMsg.style.color = '#c0392b';
                                    statusMsg.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
                                }
                            });

                            td.appendChild(input);
                            tr.appendChild(td);
                        });

                        const tdSummary = document.createElement('td');
                        tdSummary.id = `summary-${product.id}`;
                        tdSummary.textContent = '-';
                        tr.appendChild(tdSummary);

                        tableBody.appendChild(tr);
                        updateBestPriceRow(product.id);
                    });
                }

                loadingEl.style.display = 'none';
                tableWrapper.style.display = 'block';
            }

            document.getElementById('btnAddProduct').addEventListener('click', async () => {
                const nameInput = document.getElementById('newProductName');
                const name = nameInput.value.trim();
                if (!name) return alert('กรุณากรอกชื่อสินค้า');

                statusMsg.style.color = '#007bff';
                statusMsg.textContent = 'กำลังเพิ่มสินค้า...';

                const { error } = await db.from('cost_products').insert([{ name }]);
                if (error) {
                    alert('เพิ่มไม่สำเร็จ: ' + error.message);
                } else {
                    nameInput.value = '';
                    statusMsg.textContent = 'เพิ่มสินค้าสำเร็จ!';
                    setTimeout(() => { statusMsg.textContent = ''; }, 1500);
                    loadData();
                }
            });

            document.getElementById('btnAddSupplier').addEventListener('click', async () => {
                const nameInput = document.getElementById('newSupplierName');
                const name = nameInput.value.trim();
                if (!name) return alert('กรุณากรอกชื่อร้านค้า');

                statusMsg.style.color = '#007bff';
                statusMsg.textContent = 'กำลังเพิ่มร้านค้า...';

                const { error } = await db.from('cost_suppliers').insert([{ name }]);
                if (error) {
                    alert('เพิ่มไม่สำเร็จ: ' + error.message);
                } else {
                    nameInput.value = '';
                    statusMsg.textContent = 'เพิ่มร้านค้าสำเร็จ!';
                    setTimeout(() => { statusMsg.textContent = ''; }, 1500);
                    loadData();
                }
            });

            loadData();

        } catch (err) {
            console.error(err);
            loadingEl.style.color = '#c0392b';
            loadingEl.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
        }
    }

    initApp();
</script>

</body>
</html>
