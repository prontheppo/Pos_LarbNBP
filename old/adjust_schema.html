<!-- ไฟล์: adjus_schema.html -->
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>Supabase - Data Explorer & SQL Exporter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #000000; color: #ffffff; touch-action: manipulation; }
  </style>
</head>
<body class="min-h-screen p-4 pt-24 relative">

  <!-- แถบควบคุม Sticky Header บนสุด -->
  <div class="fixed top-0 left-0 right-0 bg-zinc-950/95 backdrop-blur-md border-b border-zinc-800 p-3 z-40 shadow-xl">
    <div class="max-w-7xl mx-auto space-y-2">
      <div class="grid grid-cols-3 gap-2">
        <a href="index_admin.html" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-2.5 px-1.5 rounded-xl text-xs transition active:scale-95 shadow flex flex-col items-center justify-center text-center leading-tight no-underline">
          <span>🔑</span><span>หน้า Admin</span>
        </a>
        <button onclick="fetchAllTablesData()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-1.5 rounded-xl text-xs transition active:scale-95 shadow flex flex-col items-center justify-center text-center leading-tight">
          <span>🚀</span><span>ดึงตาราง</span>
        </button>
        <button onclick="exportSchemaOnly()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 px-1.5 rounded-xl text-xs transition active:scale-95 shadow flex flex-col items-center justify-center text-center leading-tight">
          <span>⚡</span><span>คัดลอก schema.sql</span>
        </button>
      </div>

      <!-- ข้อความแสดงสถานะ -->
      <div id="statusText" class="text-[11px] font-semibold text-center text-zinc-400 truncate">
        พร้อมใช้งานระบบ (ดึงข้อมูล Comment จาก Supabase ของจริง)
      </div>
    </div>
  </div>

  <div class="max-w-7xl mx-auto space-y-6">
    <div id="tablesContainer" class="space-y-8"></div>
  </div>

  <script src="supabaseClient.js"></script>
  
  <script>
    let tablesDataCache = {}; 
    let tableCommentsMap = {}; // เก็บ Comment จริงจากฐานข้อมูล

    const primaryKeyMap = {
      'customer_types': 'customer_type_id',
      'customers': 'customer_id',
      'food_groups': 'food_group_id',
      'foods': 'food_id',
      'locations': 'location_id',
      'orders': 'order_id',
      'zones': 'zone_id'
    };

    function getPrimaryKey(tableName, sampleRow) {
      if (primaryKeyMap[tableName]) return primaryKeyMap[tableName];
      if (sampleRow) {
        const keys = Object.keys(sampleRow);
        const found = keys.find(k => k.endsWith('_id') || k === 'id');
        if (found) return found;
        return keys[0];
      }
      return 'id';
    }

    // ฟังก์ชันดึงรายชื่อตารางพร้อม Comment ของจริงจาก Supabase
    async function fetchTablesWithComments() {
      try {
        const { data, error } = await supabaseClient.rpc('get_tables_with_comments');
        if (error || !data) {
          console.error("RPC Error:", error);
          return [];
        }
        
        tableCommentsMap = {};
        data.forEach(item => {
          if (item.table_comment) {
            tableCommentsMap[item.table_name] = item.table_comment;
          }
        });
        
        return data.map(item => item.table_name);
      } catch (err) {
        console.error("Fetch Exception:", err);
        return [];
      }
    }

    async function fetchAllTablesData() {
      const status = document.getElementById('statusText');
      const container = document.getElementById('tablesContainer');
      
      status.innerHTML = "⏳ กำลังดึงตารางและ Comment ของจริงจาก Supabase...";
      const tableList = await fetchTablesWithComments();
      
      if (tableList.length === 0) {
        status.innerHTML = `<span class="text-rose-400">❌ ไม่พบตาราง หรือฟังก์ชัน get_tables_with_comments มีปัญหาการเข้าถึง</span>`;
        return;
      }

      status.innerHTML = `⏳ กำลังดึงข้อมูลจาก ${tableList.length} ตาราง...`;
      container.innerHTML = "";
      tablesDataCache = {};
      let totalCount = 0;
      
      for (const tableName of tableList) {
        try {
          let query = supabaseClient.from(tableName).select('*');

          if (tableName === 'orders') {
            const date90DaysAgo = new Date();
            date90DaysAgo.setDate(date90DaysAgo.getDate() - 90);
            
            query = query
              .gte('created_at', date90DaysAgo.toISOString())
              .order('created_at', { ascending: false })
              .limit(500);
          }

          const { data, error } = await query;

          if (error) {
            renderTableCard(tableName, null, error.message);
          } else {
            tablesDataCache[tableName] = data || [];
            renderTableCard(tableName, data, null);
            totalCount += (data ? data.length : 0);
          }
        } catch (err) {
          renderTableCard(tableName, null, err.message);
        }
      }
      status.innerHTML = `<span class="text-emerald-400">✅ ดึงข้อมูลสำเร็จทั้งหมด ${tableList.length} ตาราง (รวม ${totalCount} รายการ)</span>`;
    }
    
    function renderTableCard(tableName, rows, errorMsg) {
      const container = document.getElementById('tablesContainer');
      const section = document.createElement('div');
      section.className = `bg-zinc-900 border ${errorMsg ? 'border-rose-900/50' : 'border-zinc-800'} rounded-2xl p-5 shadow-lg space-y-3`;
      
      // ดึง Comment ของจริงจาก Supabase มาต่อท้าย (ถ้ามี)
      const dbComment = tableCommentsMap[tableName] ? ` (${tableCommentsMap[tableName]})` : '';
      
      let noteBadge = '';
      if (tableName === 'orders') {
        noteBadge = `<span class="bg-amber-500/20 text-amber-300 text-[10px] px-2 py-0.5 rounded-md border border-amber-500/30">⚡ ย้อนหลัง 90 วัน / สูงสุด 500 แถว</span>`;
      }

      let html = `
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b ${errorMsg ? 'border-rose-900/40' : 'border-zinc-800'} pb-3">
            <div class="flex items-center gap-2 flex-wrap">
                <h2 class="text-base font-bold ${errorMsg ? 'text-rose-400' : 'text-amber-400'}">📌 ตาราง: <span class="text-white">${tableName}</span><span class="text-zinc-400 text-xs font-normal">${dbComment}</span></h2>
                ${!errorMsg ? `<span class="bg-zinc-800 text-zinc-300 text-xs px-2.5 py-1 rounded-full border border-zinc-700">${rows ? rows.length : 0} รายการ</span>` : ''}
                ${noteBadge}
            </div>
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <button onclick="exportSingleTableSQL('${tableName}')" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition active:scale-95 shadow whitespace-nowrap">
                    📋 Copy SQL
                </button>
            </div>
        </div>
      `;
      
      if (errorMsg) {
        html += `<p class="text-xs text-rose-300 bg-black/50 p-2.5 rounded-lg border border-rose-900/30">❌ เกิดข้อผิดพลาด: ${errorMsg}</p>`;
      } else if (!rows || rows.length === 0) {
        html += `<p class="text-xs text-zinc-500 py-2 italic">-- ไม่มีข้อมูลในตารางนี้ --</p>`;
      } else {
        const headers = Object.keys(rows[0]);
        html += `
          <div class="overflow-x-auto max-h-[210px]">
              <table class="w-full text-left text-xs border-collapse">
                  <thead class="sticky top-0 bg-black text-emerald-400 z-10">
                      <tr>${headers.map(h => `<th class="p-2 border-b border-zinc-800 font-semibold uppercase tracking-wider">${h}</th>`).join('')}</tr>
                  </thead>
                  <tbody class="divide-y divide-zinc-800 text-zinc-300">
                    ${rows.map(row => `
                      <tr class="hover:bg-zinc-800/50">
                        ${headers.map(h => {
                          let val = row[h];
                          if (typeof val === 'object' && val !== null) val = JSON.stringify(val);
                          return `<td class="p-2 whitespace-nowrap font-mono text-[11px]">${val !== null && val !== undefined ? val : '<span class="text-zinc-600">NULL</span>'}</td>`;
                        }).join('')}
                      </tr>
                    `).join('')}
                  </tbody>
              </table>
          </div>
        `;
      }
      section.innerHTML = html;
      container.appendChild(section);
    }

    function getSqlType(col, val, pkName) {
      if (col === pkName) return "BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY";
      if (typeof val === "number") return Number.isInteger(val) ? "BIGINT" : "NUMERIC";
      if (typeof val === "boolean") return "BOOLEAN";
      if (typeof val === "object" && val !== null) return "JSONB";
      if (col.includes("_at") || col.includes("date")) return "TIMESTAMPTZ";
      return "TEXT";
    }

    function buildTableSQL(tableName, rows, includeData = true) {
      const sampleRow = (rows && rows.length > 0) ? rows[0] : null;
      const pkName = getPrimaryKey(tableName, sampleRow);

      let sql = [`-- TABLE: public.${tableName}`, `CREATE TABLE IF NOT EXISTS public.${tableName} (`];
      let colDefs = [];

      if (sampleRow) {
        Object.keys(sampleRow).forEach(col => {
          colDefs.push(`    ${col} ${getSqlType(col, sampleRow[col], pkName)}`);
        });
      } else {
        colDefs.push(`    ${pkName} BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY`);
      }

      sql.push(colDefs.join(",\n"), `);\n`);

      if (includeData && rows && rows.length > 0) {
        sql.push(`-- DATA INSERTS: public.${tableName}`);
        const columns = Object.keys(rows[0]);
        rows.forEach(row => {
          const values = columns.map(h => {
            const val = row[h];
            if (val === null || val === undefined) return "NULL";
            if (typeof val === 'number' || typeof val === 'boolean') return val;
            if (typeof val === 'object') return `'${JSON.stringify(val).replace(/'/g, "''")}'::jsonb`;
            return `'${String(val).replace(/'/g, "''")}'`;
          });
          sql.push(`INSERT INTO public.${tableName} (${columns.join(', ')}) VALUES (${values.join(', ')});`);
        });
        sql.push("\n");
      }
      return sql.join("\n");
    }

    async function exportSingleTableSQL(tableName) {
      const status = document.getElementById('statusText');
      status.innerHTML = `⏳ กำลังคัดลอก SQL ของตาราง ${tableName}...`;

      try {
        let rows = tablesDataCache[tableName];
        if (!rows) {
          let query = supabaseClient.from(tableName).select('*');
          if (tableName === 'orders') {
            const date90DaysAgo = new Date();
            date90DaysAgo.setDate(date90DaysAgo.getDate() - 90);
            query = query
              .gte('created_at', date90DaysAgo.toISOString())
              .order('created_at', { ascending: false })
              .limit(500);
          }
          const { data } = await query;
          rows = data || [];
          tablesDataCache[tableName] = rows;
        }

        const header = `-- ========================================================\n-- TABLE SCHEMA & DATA: public.${tableName}\n-- Date: ${new Date().toLocaleString()}\n-- ========================================================\n\n`;
        const finalSQL = header + buildTableSQL(tableName, rows, true);
        
        await navigator.clipboard.writeText(finalSQL);
        status.innerHTML = `<span class="text-blue-300">📋 คัดลอก SQL ตาราง ${tableName} ลง Clipboard แล้ว</span>`;
      } catch (err) {
        status.innerHTML = `<span class="text-rose-400">❌ เกิดข้อผิดพลาดในการคัดลอก SQL</span>`;
        console.error(err);
      }
    }

    // ฟังก์ชันสำหรับปุ่ม "คัดลอก schema.sql" โดยเฉพาะ (ดึงเฉพาะโครงสร้าง ชื่อตารางและคอลัมน์ ไม่เอาข้อมูลแถว)
    async function exportSchemaOnly() {
      const status = document.getElementById('statusText');
      status.innerHTML = "⏳ กำลังดึงโครงสร้าง Schema ทุกตาราง...";
      
      // ดึงรายชื่อตารางจากฐานข้อมูลมาทันทีโดยไม่ต้องกดปุ่มดึงตารางก่อน
      const tableList = await fetchTablesWithComments();
      
      if (tableList.length === 0) {
        status.innerHTML = `<span class="text-rose-400">❌ ไม่พบตาราง หรือไม่สามารถเชื่อมต่อฐานข้อมูลได้</span>`;
        return;
      }

      let sqlStatements = [
        "-- ========================================================",
        "-- FILE: schema.sql (Structure Only)",
        `-- Date: ${new Date().toLocaleString()}`,
        "-- ========================================================\n"
      ];

      for (const tableName of tableList) {
        try {
          // ดึงมาแค่ 1 แถวเพื่อเอาชื่อคอลัมน์มาทำโครงสร้าง CREATE TABLE (กำหนด includeData เป็น false)
          let sampleData = [];
          if (tablesDataCache[tableName] && tablesDataCache[tableName].length > 0) {
            sampleData = [tablesDataCache[tableName][0]];
          } else {
            const { data } = await supabaseClient.from(tableName).select('*').limit(1);
            sampleData = data || [];
          }
          
          sqlStatements.push(buildTableSQL(tableName, sampleData, false));
        } catch (err) {
          console.error(`Error processing table ${tableName}:`, err);
        }
      }

      const schemaSQL = sqlStatements.join("\n");
      if (schemaSQL) {
        await navigator.clipboard.writeText(schemaSQL);
        status.innerHTML = `<span class="text-amber-300">📋 คัดลอกโค้ด schema.sql (เฉพาะโครงสร้าง) ลง Clipboard แล้ว (${tableList.length} ตาราง)</span>`;
      } else {
        status.innerHTML = `<span class="text-rose-400">❌ ไม่สามารถคัดลอก SQL ได้</span>`;
      }
    }
  </script>
</body>
</html>
