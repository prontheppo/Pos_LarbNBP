<!-- ไฟล์: linereport.html -->
<!DOCTYPE html>
<html lang="th">
<head>
    <script src="appInit.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>รายงานยอดขายประจำวัน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; user-select: none; touch-action: manipulation; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

<div class="flex flex-col h-screen max-w-2xl mx-auto bg-white shadow-md">
    <!-- Header -->
    <div class="p-4 border-b text-center shrink-0">
        <h2 class="text-lg font-bold text-gray-800 m-0">รายงานยอดขายประจำวัน</h2>
        <span id="currentDateDisplay" class="hidden"></span>
        <span id="systemStatus" class="hidden"></span>
        <span id="previewLabel" class="hidden"></span>
    </div>

    <!-- Content Area -->
    <div class="flex-1 p-3 overflow-hidden">
        <textarea id="reportSummary" readonly class="w-full h-full p-3 border rounded-lg bg-gray-50 text-gray-800 font-mono text-xs leading-relaxed resize-none outline-none overflow-y-auto">กำลังโหลดข้อมูลวันปัจจุบัน...</textarea>
    </div>

    <!-- Footer -->
    <div class="p-3 border-t flex gap-2.5 shrink-0">
        <button onclick="location.href='index.html'" title="กลับหน้าหลัก" class="bg-gray-600 hover:bg-gray-700 text-white font-bold px-4 py-3 rounded-lg text-lg">🏠</button>
        <button id="sendBtn" onclick="sendReportToLine()" class="flex-1 bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-bold py-3 rounded-lg text-base transition-all">📲 ส่งรายงานเข้า LINE</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://wmhweeeyulhmoilypklz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_yXKK7aSunM_KCqRiUhGupQ__Qs1nyCd';
    const HEADERS = { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" };

    const todayObj = new Date();
    const TODAY_ISO = todayObj.toISOString().split('T')[0];
    const TODAY_SLASH = `${String(todayObj.getDate()).padStart(2,'0')}/${String(todayObj.getMonth()+1).padStart(2,'0')}/${todayObj.getFullYear()}`;
    const thaiMonths = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
    const DISPLAY_THAI_DATE = `${todayObj.getDate()} ${thaiMonths[todayObj.getMonth()]} ${todayObj.getFullYear() + 543}`;

    let currentFlexPayloads = [], currentTextSummaries = [], locationsCache = [];

    window.addEventListener('DOMContentLoaded', () => {
        const dateDisp = document.getElementById('currentDateDisplay');
        if (dateDisp) dateDisp.innerText = DISPLAY_THAI_DATE;
        fetchTodaySalesData();
    });

    function parseOrderItems(order) {
        let rawItems = Array.isArray(order.items) ? order.items : (typeof order.items === 'string' ? (JSON.parse(order.items || '[]')) : []);
        
        let computedItems = rawItems.map(item => {
            let q = Number(item.qty || item.quantity || 1);
            let unitPrice = Number(item.price || item.unit_price || 0);
            let totalPrice = Number(item.total_price || item.sum || (unitPrice * q));
            let name = item.name || item.food_name || 'รายการ';
            
            let notes = [
                item.note || item.comment || item.remark || item.details || item.option || item.topping || '',
                Number(item.friedEggQty || item.khaiDaoQty || item.fried_egg) > 0 ? `ไข่ดาว ${item.friedEggQty || item.khaiDaoQty || item.fried_egg}` : '',
                Number(item.omeletQty || item.khaiJiaoQty || item.omelet) > 0 ? `ไข่เจียว ${item.omeletQty || item.khaiJiaoQty || item.omelet}` : ''
            ].filter(Boolean);

            if (name.includes('(') && name.includes(')')) {
                const match = name.match(/^(.*?)\s*\((.*?)\)$/);
                if (match) { name = match[1].trim(); notes.push(match[2].trim()); }
            }

            return { name, qty: q, unitPrice, totalPrice, note: notes.join(', ') };
        });

        let subtotal = Number(order.subtotal || computedItems.reduce((s, i) => s + i.totalPrice, 0));
        let deliveryFee = Number(order.delivery_fee || 0);
        let billTotal = Number(order.total_price || (subtotal + deliveryFee));

        let typeId = Number(order.customer_type_id);
        let groupCategory = typeId === 2 ? "นักท่องเที่ยว" : ((typeId === 3 || String(order.customer_type || '').includes("สบายดี")) ? "สบายดี" : "ชาวบ้าน");
        let subLocationName = (typeId === 2 && order.location_id) ? (locationsCache.find(l => String(l.location_id) === String(order.location_id))?.location_name || "") : "";

        return { ...order, parsedItems: computedItems, computedSubtotal: subtotal, deliveryFee: deliveryFee, computedTotal: billTotal, groupCategory, subLocationName };
    }

    function createGroupFlexBubble(groupName, groupOrders, subTotal) {
        let contents = [
            { "type": "text", "text": `📌 กลุ่ม: ${groupName}`, "weight": "bold", "size": "lg", "color": "#1DB446" },
            { "type": "text", "text": ` วันที่: ${DISPLAY_THAI_DATE}`, "size": "xs", "color": "#aaaaaa", "margin": "xs" },
            { "type": "text", "text": `🛍️ สรุป: ${groupOrders.length} บิล (${subTotal.toLocaleString()} บาท)`, "size": "sm", "weight": "bold", "margin": "sm" },
            { "type": "separator", "margin": "md" }
        ];

        groupOrders.forEach((ord, idx) => {
            contents.push({ "type": "text", "text": `🧾 บิลที่ ${idx + 1}:${ord.subLocationName ? ` [${ord.subLocationName}]` : ''}`, "weight": "bold", "size": "sm", "margin": "md", "color": "#555555" });
            ord.parsedItems.forEach(item => {
                contents.push({
                    "type": "box", "layout": "horizontal", "margin": "sm",
                    "contents": [
                        { "type": "text", "text": `x${item.qty}`, "size": "xs", "color": "#888888", "flex": 2 },
                        { "type": "text", "text": item.name, "size": "xs", "color": "#333333", "flex": 7, "wrap": true },
                        { "type": "text", "text": `${item.totalPrice.toLocaleString()} บ.`, "size": "xs", "color": "#111111", "align": "end", "weight": "bold", "flex": 4 }
                    ]
                });
                if (item.note) contents.push({ "type": "text", "text": `└ [${item.note}]`, "size": "xxs", "color": "#aaaaaa", "margin": "xs" });
            });

            if (ord.deliveryFee > 0) {
                contents.push({
                    "type": "box", "layout": "horizontal", "margin": "xs",
                    "contents": [
                        { "type": "text", "text": `🛵`, "size": "xs", "flex": 2 },
                        { "type": "text", "text": `ค่าบริการจัดส่ง`, "size": "xs", "color": "#d97706", "flex": 7 },
                        { "type": "text", "text": `+${ord.deliveryFee.toLocaleString()} บ.`, "size": "xs", "color": "#d97706", "align": "end", "weight": "bold", "flex": 4 }
                    ]
                });
            }
        });

        return { "type": "bubble", "body": { "type": "box", "layout": "vertical", contents } };
    }

    async function fetchTodaySalesData() {
        const summaryBox = document.getElementById('reportSummary');
        try {
            const [locRes, orderRes] = await Promise.all([
                fetch(`${SUPABASE_URL}/rest/v1/locations?select=*`, { headers: HEADERS }).catch(() => null),
                fetch(`${SUPABASE_URL}/rest/v1/orders?select=*`, { headers: HEADERS })
            ]);

            if (locRes && locRes.ok) locationsCache = await locRes.json();
            if (!orderRes.ok) throw new Error(`HTTP Status ${orderRes.status}`);

            const rawOrders = await orderRes.json();
            const orders = rawOrders
                .filter(o => String(o.created_at || o.order_date || o.date || "").match(new RegExp(`${TODAY_ISO}|${TODAY_SLASH}`)))
                .map(o => parseOrderItems(o));

            currentFlexPayloads = [null];
            currentTextSummaries = [];

            let grouped = { "ชาวบ้าน": [], "นักท่องเที่ยว": [], "สบายดี": [] };
            let totalSales = 0;

            orders.forEach(o => {
                totalSales += o.computedTotal;
                (grouped[o.groupCategory] || grouped["ชาวบ้าน"]).push(o);
            });

            currentTextSummaries.push(`📊 รายงานยอดขายประจำวัน \n วันที่: ${DISPLAY_THAI_DATE}\n-----------------------------------\n👥 ชาวบ้าน: ${grouped["ชาวบ้าน"].length} ออเดอร์\n👥 นักท่องเที่ยว: ${grouped["นักท่องเที่ยว"].length} ออเดอร์\n👥 สบายดี: ${grouped["สบายดี"].length} ออเดอร์\n-----------------------------------\n🛒 ยอดขายรวมสุทธิ: ${totalSales.toLocaleString()} บาท (${orders.length} ออเดอร์)`);

            ["ชาวบ้าน", "นักท่องเที่ยว", "สบายดี"].forEach(g => {
                const groupOrders = grouped[g];
                if (!groupOrders.length) return;

                let subTotal = groupOrders.reduce((sum, o) => sum + o.computedTotal, 0);
                currentFlexPayloads.push(createGroupFlexBubble(g, groupOrders, subTotal));

                let txt = `📌 [ข้อความส่งเข้า LINE] กลุ่ม: ${g}\nสรุป: ${groupOrders.length} บิล (${subTotal.toLocaleString()} บาท)\n-----------------------------------\n`;
                groupOrders.forEach((ord, idx) => {
                    txt += `🧾 บิลที่ ${idx + 1}${ord.subLocationName ? ` [${ord.subLocationName}]` : ''}:\n`;
                    ord.parsedItems.forEach(i => {
                        txt += `  • x${i.qty} ${i.name} = ${i.totalPrice.toLocaleString()} บ.\n`;
                        if (i.note) txt += `    └ [${i.note}]\n`;
                    });
                    if (ord.deliveryFee > 0) {
                        txt += `  • 🛵 ค่าบริการจัดส่ง = +${ord.deliveryFee.toLocaleString()} บ.\n`;
                    }
                });
                currentTextSummaries.push(txt);
            });

            summaryBox.value = currentTextSummaries.join("\n=========================================\n\n");
        } catch (error) {
            summaryBox.value = `❌ ไม่สามารถโหลดข้อมูลได้\nสาเหตุ: ${error.message}`;
        }
    }

    async function sendReportToLine() {
        if (!currentTextSummaries.length) return;
        const btn = document.getElementById('sendBtn');
        btn.disabled = true;

        try {
            for (let i = 0; i < currentTextSummaries.length; i++) {
                btn.innerText = `⏳ กำลังส่ง (${i + 1}/${currentTextSummaries.length})...`;
                const payload = currentFlexPayloads[i] ? { flexPayload: currentFlexPayloads[i] } : { messageBody: currentTextSummaries[i] };
                
                const res = await fetch(`${SUPABASE_URL}/functions/v1/send-line-report`, {
                    method: "POST", headers: HEADERS, body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error((await res.json()).error || `HTTP ${res.status}`);
            }

            btn.innerText = "✅ ส่งเข้า LINE เรียบร้อยแล้ว";
            btn.classList.remove('bg-emerald-500', 'hover:bg-emerald-600');
            btn.classList.add('bg-blue-600');

            setTimeout(() => {
                btn.innerText = "📲 ส่งรายงานเข้า LINE";
                btn.classList.remove('bg-blue-600');
                btn.classList.add('bg-emerald-500', 'hover:bg-emerald-600');
                btn.disabled = false;
            }, 3000);

        } catch (error) {
            btn.innerText = "❌ ส่งไม่สำเร็จ";
            btn.classList.remove('bg-emerald-500');
            btn.classList.add('bg-red-600');

            setTimeout(() => {
                btn.innerText = "📲 ส่งรายงานเข้า LINE";
                btn.classList.remove('bg-red-600');
                btn.classList.add('bg-emerald-500');
                btn.disabled = false;
            }, 3000);
        }
    }
</script>
</body>
</html>
