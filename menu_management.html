  SUMMARY: ระบบรวมจัดการตารางราคาปกติ และราคาพิเศษตามสถานที่ (Unified Management)

<!DOCTYPE html>
<html lang="th">
<head>
    <script src="appInit.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>จัดการตารางราคาและราคาพิเศษ - ลาบหนองบัวลำภู</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- ==========================================================
         [Start Block 1] SETUP, CONFIG & GLOBAL VARIABLES
         ========================================================== -->
    <style>
      :root { --bg-color: #f8fafc; }
      html, body { 
          height: 100%; margin: 0; padding: 0; overflow: hidden; 
          font-family: 'Sarabun', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
          background-color: var(--bg-color); touch-action: manipulation; 
          -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; user-select: none;
      }
      .app-container { 
          max-width: 500px; margin: 0 auto; height: 100dvh; background: #ffffff; 
          display: grid; grid-template-rows: auto auto 1fr auto; box-sizing: border-box; overflow: hidden;
      }
      .excel-table { width: 100%; border-collapse: collapse; background-color: #ffffff; text-align: left; }
      .excel-table th, .excel-table td { border: 1px solid #cbd5e1; padding: 6px 6px; }
      .excel-table th { background-color: #2563eb; color: #ffffff; font-weight: bold; text-align: center; font-size: 1rem; }
      
      .custom-excel-table { table-layout: fixed; }
      .custom-excel-table th, .custom-excel-table td { height: 36px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 4px 6px; }
      .custom-excel-table th { background-color: #f8fafc; color: #334155; font-size: 11px; }

      ::-webkit-scrollbar { display: none; }
      .popup-scrollbar::-webkit-scrollbar { width: 4px; display: block; }
      .popup-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
      .popup-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }

      .custom-modal-overlay {
          position: fixed; top: 0; left: 0; right: 0; bottom: 0;
          background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(3px);
          display: none; align-items: center; justify-content: center; z-index: 9999;
      }
      .custom-modal-overlay.active { display: flex !important; }
      .custom-modal-box {
          background: white; border-radius: 20px; padding: 20px; width: 92%;
          max-width: 440px; max-height: 85vh; display: flex; flex-direction: column;
          box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2); touch-action: pan-y;
      }
      .excel-input {
          border: none; background: transparent; width: 100%; text-align: center;
          font-size: 13px; font-weight: 700; outline: none; padding: 2px 0; color: #2563eb;
      }
      .excel-input:focus { background-color: #ffffff; border: 1px solid #3b82f6; border-radius: 2px; }
      #addMenuIframe { width: 100%; height: auto; min-height: 250px; max-height: 85vh; border: 0; display: block; }
    </style>
    <!-- [End Block 1] -->
</head>
<body class="bg-slate-100 flex items-center justify-center antialiased">

             [Start Block 2] USER INTERFACE & LAYOUT COMPONENTS

            <div class="bg-amber-50/50 border border-amber-200/80 rounded-2xl p-2.5 shadow-sm">

    <!-- ==========================================================
         [Start Block 3] JAVASCRIPT CORE LOGIC & EVENT HANDLERS
         ========================================================== -->
    <script>
        let db;
        let menus = [];
        let foodGroups = []; 
        let locationsData = [];
        let currentMode = 'normal'; // 'normal' หรือ 'location'
        
        let currentGroupId = null;
        let currentGroupName = '';
        let selectedLocationId = null;
        let selectedLocationName = '';
        let currentCustomPrices = {};
        
        let editingFoodId = null;
        let selectedGroupIdForEdit = null;
        const categoryIcons = ['🍱', '🍲', '🍳', '🍚', '🥩', '⭐', '🥗', '🛍️', '🍽️', '🥢', '🍹'];

        function getDbClient() {
            if (db) return db;
            if (typeof window.supabaseClient !== 'undefined') db = window.supabaseClient;
            else if (typeof supabaseClient !== 'undefined') db = supabaseClient;
            return db;
        }

        window.addEventListener('DOMContentLoaded', async () => {
            db = getDbClient();
            if (db) {
                await loadAllData();
                await loadLocations();
            } else {
                console.error("ไม่สามารถเชื่อมต่อฐานข้อมูลได้");
            }
        });

        /* --- MODE SWITCHER --- */
        function switchMode(mode) {
            currentMode = mode;
            const tabNormal = document.getElementById('tabModeNormal');
            const tabLocation = document.getElementById('tabModeLocation');
            const locBar = document.getElementById('locationBarContainer');
            const headerTitle = document.getElementById('headerTitle');
            const footerNormal = document.getElementById('footerNormalMode');
            const footerLocation = document.getElementById('footerLocationMode');

            if (mode === 'normal') {
                tabNormal.className = "py-1.5 px-2 rounded-lg text-xs font-bold transition shadow-xs cursor-pointer bg-blue-600 text-white";
                tabLocation.className = "py-1.5 px-2 rounded-lg text-xs font-bold transition shadow-xs cursor-pointer bg-white text-slate-600 hover:bg-slate-200";
                locBar.classList.add('hidden');
                footerNormal.classList.remove('hidden');
                footerLocation.classList.add('hidden');
                headerTitle.textContent = "🏷️ ดูแลและแก้ไขตารางราคา (ทั่วไป)";
            } else {
                tabLocation.className = "py-1.5 px-2 rounded-lg text-xs font-bold transition shadow-xs cursor-pointer bg-amber-500 text-white";
                tabNormal.className = "py-1.5 px-2 rounded-lg text-xs font-bold transition shadow-xs cursor-pointer bg-white text-slate-600 hover:bg-slate-200";
                locBar.classList.remove('hidden');
                footerNormal.classList.add('hidden');
                footerLocation.classList.remove('hidden');
                headerTitle.textContent = "📍 กำหนดราคาพิเศษตามสถานที่";
            }
            sendDataToFoodGroupFrame();
        }

        /* --- IFRAME MESSAGING --- */
        window.addEventListener('message', async (event) => {
            if (event.origin !== window.location.origin && event.origin !== '*') return;
            const data = event.data || {};
            const { type, catId, catName, height } = data;
            const resolvedCatName = catName || data.categoryName || data.name;

            if (type === 'RESIZE_POPUP' && height) {
                const iframe = document.getElementById('addMenuIframe');
                if (iframe) iframe.style.height = `${height}px`;
            }

            if (type === 'SELECT_CATEGORY' || type === 'OPEN_CONSIGNMENT_LIST' || resolvedCatName || catId) {
                if (currentMode === 'normal') {
                    const matchedGroup = foodGroups.find(g => String(g.id) === String(catId) || String(g.name).trim() === String(resolvedCatName).trim());
                    if (matchedGroup) {
                        openCategoryPriceModalHTML(matchedGroup);
                    } else if (catId || resolvedCatName) {
                        openCategoryPriceModalHTML({ id: catId || resolvedCatName, name: resolvedCatName || `กลุ่ม ${catId}` });
                    }
                } else {
                    if (!selectedLocationId) {
                        showAlertModal('กรุณาเลือกสถานที่ / รีสอร์ต ด้านบนก่อนครับ');
                        return;
                    }
                    openLocationCategoryModal(resolvedCatName || catId);
                }
            } else if (type === 'CLOSE_ADD_MENU') {
                closeAddMenuModal();
                loadCategoryFoods();
            } else if (type === 'SHOW_ALERT') {
                showAlertModal(data.message);
            }
        });

        function sendDataToFoodGroupFrame() {
            const frame = document.getElementById('foodGroupFrame');
            if (frame && frame.contentWindow) {
                frame.contentWindow.postMessage({
                    type: 'RENDER_CATEGORIES',
                    categories: foodGroups.map(g => ({ food_group_id: g.id, food_group_name: g.name })),
                    foods: menus,
                    cart: []
                }, window.location.origin);
            }
        }

        /* --- DATA LOADING --- */
        async function loadAllData() {
            try {
                const [ { data: mData }, { data: fgData } ] = await Promise.all([
                    db.from('foods').select('*'),
                    db.from('food_groups').select('food_group_id, food_group_name').order('food_group_id', { ascending: true })
                ]);

                menus = mData || [];
                let rawGroups = (fgData || []).map(g => ({ id: g.food_group_id, name: g.food_group_name }));

                foodGroups = rawGroups.sort((a, b) => a.name.localeCompare(b.name, ['th', 'en'], { numeric: true }));
                sendDataToFoodGroupFrame();
            } catch (err) {
                console.error("Error loading data:", err);
            }
        }

        async function loadLocations() {
            try {
                const { data } = await db.from('locations').select('*');
                locationsData = data || [];
            } catch (err) {
                console.error("Error loading locations:", err);
            }
        }

        /* --- NORMAL MODE FUNCTIONS --- */
        async function openCategoryPriceModalHTML(cat) {
            currentGroupId = cat.id;
            currentGroupName = cat.name;
            document.getElementById('groupNameTitle').textContent = currentGroupName;
            document.getElementById('groupIdBadge').textContent = `ID: ${currentGroupId}`;
            openModal('popupModalWrapper');
            await loadCategoryFoods();
        }

        async function loadCategoryFoods() {
            const container = document.getElementById('foodListContainer');
            container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">⏳ กำลังโหลดรายการอาหาร...</div>`;
            try {
                const { data: foods } = await db.from('foods').select('*').eq('food_group_id', currentGroupId);
                renderFoodExcelTable(foods || []);
            } catch (err) {
                container.innerHTML = `<div class="text-center py-8 text-rose-500 text-xs">เกิดข้อผิดพลาด</div>`;
            }
        }

        function renderFoodExcelTable(foods) {
            const container = document.getElementById('foodListContainer');
            container.innerHTML = '';
            if (foods.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">ไม่มีรายการอาหารในหมวดหมู่นี้</div>`;
                return;
            }

            const table = document.createElement('table');
            table.className = 'excel-table';
            table.innerHTML = `
                <thead class="sticky top-0 z-10 shadow-sm">
                    <tr>
                        <th class="py-2.5 px-3 text-left">รายการอาหาร</th>
                        <th class="py-2.5 px-1 text-center" style="width: 18%;">ชาวบ้าน</th>
                        <th class="py-2.5 px-1 text-center" style="width: 18%;">นักท่องเที่ยว</th>
                        <th class="py-2.5 px-1 text-center" style="width: 18%;">สบายดี</th>
                    </tr>
                </thead>
                <tbody>
                    ${foods.map((food, i) => `
                        <tr class="${i % 2 === 0 ? 'bg-white' : 'bg-slate-50/70'}">
                            <td class="py-2 px-3 font-bold text-slate-800 text-[15px]">
                                <span onclick="openEditMenuModal(${food.food_id}, '${(food.food_name||'').replace(/'/g, "\\'")}', ${food.food_group_id})" class="cursor-pointer hover:text-indigo-600">${food.food_name}</span>
                            </td>
                            <td class="py-1 px-1 text-center"><input type="number" value="${food.price_1 || 0}" onblur="updatePrice(${food.food_id}, 'price_1', this.value)" class="w-full text-center font-bold text-slate-700 text-[15px] bg-transparent outline-none"></td>
                            <td class="py-1 px-1 text-center"><input type="number" value="${food.price_2 || 0}" onblur="updatePrice(${food.food_id}, 'price_2', this.value)" class="w-full text-center font-bold text-slate-700 text-[15px] bg-transparent outline-none"></td>
                            <td class="py-1 px-1 text-center"><input type="number" value="${food.price_3 || 0}" onblur="updatePrice(${food.food_id}, 'price_3', this.value)" class="w-full text-center font-bold text-slate-700 text-[15px] bg-transparent outline-none"></td>
                        </tr>
                    `).join('')}
                </tbody>
            `;
            container.appendChild(table);
        }

        async function updatePrice(foodId, field, val) {
            await db.from('foods').update({ [field]: parseFloat(val) || 0 }).eq('food_id', foodId);
        }

        /* --- LOCATION MODE FUNCTIONS --- */
        function openLocationModal() {
            const grid = document.getElementById('locationGrid');
            grid.innerHTML = locationsData.map(loc => `
                <button type="button" onclick="selectLocation(${loc.location_id}, '${loc.location_name}')" class="flex flex-col items-center justify-center p-3 bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-xl transition cursor-pointer shadow-sm">
                    <span class="text-xl mb-1">🏨</span>
                    <span class="text-xs font-bold text-slate-800 truncate w-full text-center">${loc.location_name}</span>
                </button>
            `).join('');
            openModal('locationModal');
        }

        async function selectLocation(id, name) {
            selectedLocationId = id;
            selectedLocationName = name;
            document.getElementById('locationBtnText').textContent = name;
            closeModal('locationModal');
        }

        function resetToHome() {
            selectedLocationId = null;
            selectedLocationName = '';
            document.getElementById('locationBtnText').textContent = '-- กรุณาเลือกสถานที่ / รีสอร์ต --';
        }

        async function openLocationCategoryModal(groupKey) {
            document.getElementById('locGroupNameTitle').textContent = groupKey;
            document.getElementById('locationBadge').textContent = `สถานที่: ${selectedLocationName}`;
            openModal('locationPopupModal');

            const container = document.getElementById('locFoodListContainer');
            container.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-400 text-xs">⏳ กำลังโหลด...</td></tr>`;

            try {
                const matchedGroup = foodGroups.find(g => String(g.id) === String(groupKey) || String(g.name).trim() === String(groupKey).trim());
                const targetGroupId = matchedGroup ? matchedGroup.id : groupKey;

                const [ { data: foods }, { data: prices } ] = await Promise.all([
                    db.from('foods').select('*').eq('food_group_id', targetGroupId),
                    db.from('location_food_prices').select('food_id, custom_price').eq('location_id', selectedLocationId)
                ]);

                currentCustomPrices = {};
                (prices || []).forEach(p => currentCustomPrices[p.food_id] = p.custom_price);

                const foodList = foods || [];
                if (foodList.length === 0) {
                    container.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-400 text-xs">❌ ไม่พบรายการอาหารในหมวดหมู่นี้</td></tr>`;
                    return;
                }

                container.innerHTML = foodList.map(f => `
                    <tr class="hover:bg-slate-100">
                        <td class="font-bold text-slate-800 px-2 truncate" style="font-size: 13px;">${f.food_name}</td>
                        <td class="text-center text-slate-500 text-[11px]">${f.price_1 || 0}</td>
                        <td class="text-center text-slate-500 text-[11px]">${f.price_2 || 0}</td>
                        <td class="text-center text-slate-500 text-[11px]">${f.price_3 || 0}</td>
                        <td class="text-center p-0 bg-amber-50/40">
                            <input type="text" placeholder="Std" value="${currentCustomPrices[f.food_id] ?? ''}" onblur="saveCustomPrice(${f.food_id}, this.value)" class="excel-input">
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
                container.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-rose-500 text-xs">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>`;
            }
        }

        async function saveCustomPrice(foodId, val) {
            if (!selectedLocationId) return;
            const v = val.trim();
            if (v === '') {
                await db.from('location_food_prices').delete().match({ location_id: selectedLocationId, food_id: foodId });
            } else {
                await db.from('location_food_prices').upsert({ location_id: selectedLocationId, food_id: foodId, custom_price: parseFloat(v) || 0 }, { onConflict: 'location_id, food_id' });
            }
        }

        /* --- HELPER MODALS & UTILITIES --- */
        function openModal(id) { document.getElementById(id)?.classList.add('active'); }
        function closeModal(id) { document.getElementById(id)?.classList.remove('active'); }
        function handleOutsideClick(e, id) { if (e.target.id === id) closeModal(id); }
        function showAlertModal(msg) {
            document.getElementById('alertMessageText').textContent = msg;
            openModal('customAlertModal');
        }

        function openEditMenuModal(foodId, foodName, groupId) {
            editingFoodId = foodId;
            selectedGroupIdForEdit = groupId;
            document.getElementById('foodNameInput').value = foodName;
            renderGroupGridForEdit();
            openModal('editModalWrapper');
        }

        function renderGroupGridForEdit() {
            const container = document.getElementById('groupGridContainer');
            container.innerHTML = foodGroups.map((g, i) => `
                <button type="button" onclick="selectedGroupIdForEdit=${g.id}; renderGroupGridForEdit();" class="p-2 rounded-xl text-xs font-bold border text-center flex items-center justify-center gap-1 cursor-pointer ${g.id === selectedGroupIdForEdit ? 'bg-indigo-600 text-white' : 'bg-white text-slate-700'}">
                    <span>${categoryIcons[i % categoryIcons.length]}</span> <span class="truncate">${g.name}</span>
                </button>
            `).join('');
        }

        async function saveFoodData() {
            const name = document.getElementById('foodNameInput').value.trim();
            if (!name) return;
            await db.from('foods').update({ food_name: name, food_group_id: selectedGroupIdForEdit }).eq('food_id', editingFoodId);
            closeEditModal();
            loadCategoryFoods();
        }

        async function deleteFoodData() {
            if (confirm('ต้องการลบเมนูนี้ใช่หรือไม่?')) {
                await db.from('foods').delete().eq('food_id', editingFoodId);
                closeEditModal();
                loadCategoryFoods();
            }
        }

        function closeEditModal() { closeModal('editModalWrapper'); }
        function openAddMenuModal() {
            document.getElementById('addMenuIframe').src = `foodaddnew.html?group_id=${currentGroupId}&group_name=${encodeURIComponent(currentGroupName)}`;
            openModal('addModalWrapper');
        }
        function closeAddMenuModal() { closeModal('addModalWrapper'); loadCategoryFoods(); }
        function openManageGroupModal() { renderCategoryList(); openModal('manageGroupModalWrapper'); }
        function closeManageGroupModal() { closeModal('manageGroupModalWrapper'); loadAllData(); }
        
        function renderCategoryList() {
            const container = document.getElementById('categoryListContainer');
            container.innerHTML = foodGroups.map(c => `
                <div class="flex items-center justify-between bg-white border border-slate-200 rounded-2xl p-2.5">
                    <span class="font-bold text-xs text-slate-800 truncate">📁 ${c.name}</span>
                </div>
            `).join('');
        }
        async function handleSaveCategoryAction() {
            const name = document.getElementById('addCategoryInput').value.trim();
            if (!name) return;
            await db.from('food_groups').insert([{ food_group_name: name }]);
            document.getElementById('addCategoryInput').value = '';
            loadAllData();
            renderCategoryList();
        }
    </script>
    <!-- [End Block 3] -->
</body>
</html>
